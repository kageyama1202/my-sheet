<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>案件の写真</title>
<!-- VERSION: 2026-11-17 (v1117-c) ダウンロード機能を追加: 画面上の「⬇ 全部ダウンロード」と日ごとの「⬇ この日」→ 取得が終わったら「📥 写真アプリへ保存」で共有シートへ(2段階/40枚ずつ)。保存した写真には✓(genba-photos.htmlと同じ記録を共有) | 前: 2026-11-17 (v1117-b) 現場モードの中から使えるように: 親が呼べる窓口 casePhotos.refresh(直近2日だけ再確認して新しい写真を追加)/同じ写真を二重に出さない | 前: 2026-11-17 (v1117-a) 新規: 案件モーダルの「🖼 写真」から開く、その案件に結びついた写真の閲覧ページ。日付ごとの索引(genba_photo_index)を新しい日から順にさかのぼって、案件キー(または案件名)が一致する写真を集めて表示。縮小版(thumbPath)があればそれを、なければ原寸を使う。タップで原寸表示(◀▶で前後) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="user-scope.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,"Hiragino Sans",sans-serif;padding:calc(10px + env(safe-area-inset-top)) 12px calc(30px + env(safe-area-inset-bottom))}
#top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
h1{font-size:16px;margin:0;flex:1;line-height:1.4;word-break:break-all}
#ver{font-size:10px;color:#777}
button{font-size:15px;border:none;border-radius:8px;padding:10px 14px;background:#3a3a3c;color:#fff;font-family:inherit}
#st{font-size:12px;color:#aaa;line-height:1.6;margin-bottom:10px;min-height:19px}
.day{margin-bottom:16px}
.day h2{font-size:14px;margin:0 0 6px;color:#ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.grid a{display:block;position:relative;background:#2c2c2e;border-radius:6px;overflow:hidden;aspect-ratio:4/3}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid span{position:absolute;left:3px;bottom:3px;font-size:10px;background:rgba(0,0,0,.6);padding:0 5px;border-radius:5px}
#bar{margin-bottom:10px}
.dl{font-size:13px;padding:6px 12px;background:#0a84ff;font-weight:bold;white-space:nowrap}
.dl.big{font-size:15px;padding:10px 16px}
.dl.ready{background:#30d158;color:#000}
.dl:disabled{background:#3a3a3c;color:#999}
.day h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid a.sv::after{content:'✓';position:absolute;right:4px;top:3px;font-size:12px;font-weight:bold;background:#30d158;color:#000;border-radius:8px;padding:0 6px}
#more{display:none;width:100%;margin-top:8px;background:#0a84ff}
#msg{color:#ccc;padding:30px 10px;text-align:center;line-height:1.8;white-space:pre-wrap}
#viewer{position:fixed;inset:0;background:#000;z-index:50;display:none}
#vwrap{width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
#vimg{display:block;width:100%;height:auto}
#vclose{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:51;background:rgba(60,60,62,.9);font-size:22px;padding:8px 16px}
#vprev,#vnext{position:fixed;top:50%;z-index:51;background:rgba(60,60,62,.8);font-size:24px;padding:14px 12px}
#vprev{left:6px}#vnext{right:6px}
#vinfo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:51;background:rgba(0,0,0,.65);font-size:13px;padding:4px 12px;border-radius:12px;white-space:nowrap}
</style>
</head>
<body>
<div id="top"><button id="bBack">←</button><h1 id="title">🖼 案件の写真</h1><button id="bReload">更新</button></div>
<div id="st"></div>
<div id="bar"><button id="dlAll" class="dl big" style="display:none"></button></div>
<div id="list"><div id="msg">読み込み中…</div></div>
<button id="more">さらに前の写真を探す</button>
<div id="ver" style="text-align:right;margin-top:14px"></div>
<div id="viewer"><div id="vwrap"><img id="vimg" alt=""></div><button id="vclose">✕</button><button id="vprev">◀</button><button id="vnext">▶</button><div id="vinfo"></div></div>
<script>
(function(){
'use strict';
var VER='v1117-c';
var DAYS_STEP=90;   // 1回で何日分さかのぼるか
var PAR=8;          // 同時に読む日数
var $=function(id){return document.getElementById(id)};
var p2=function(n){return String(n).padStart(2,'0')};
function ymd(d){return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())}
var WD=['日','月','火','水','木','金','土'];
$('ver').textContent=VER;
var q=new URLSearchParams(location.search);
var caseKey=q.get('case')||'',caseName=q.get('name')||'';
$('title').textContent='🖼 '+(caseName||'案件の写真');
$('bBack').onclick=function(){window.close();setTimeout(function(){if(history.length>1)history.back();else location.href='today.html'},400)};

function authReady(){
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej(new Error('認証が確認できません。ログインし直してください'))},8000);
    firebase.auth().onAuthStateChanged(function(u){clearTimeout(t);u?res(u):rej(new Error('認証切れです。ログインし直してください'))});
  });
}
function say(t){var b=$('list');b.textContent='';var d=document.createElement('div');d.id='msg';d.textContent=t;b.appendChild(d)}

var db=null,st=null,uk='';
var photos=[];          // 見つかった写真(新しい順に表示するため日ごとに追加)
var scanned=0;          // さかのぼった日数
var token=0,busy=false;
var dayBoxes={};        // ymd -> {grid}
var known={};           // すでに表示した写真のid(二重表示を防ぐ)
var urlCache={};        // storage path -> Promise<url>
function urlOf(path){
  if(!urlCache[path])urlCache[path]=st.ref('users/'+uk+'/'+path).getDownloadURL();
  return urlCache[path];
}
function mine(p){
  if(caseKey&&p.key===caseKey)return true;
  if(caseName&&p.site===caseName)return true;
  return false;
}
// 画面に近づいたタイルだけ画像の取得を始める(一度に何十枚も取りに行かない)
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){
  es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);e.target._load&&e.target._load()}});
},{rootMargin:'300px'}):null;

function tile(p,box){
  var a=document.createElement('a');a.href='#';a.dataset.id=p.id;if(shared[p.id])a.className='sv';
  var im=document.createElement('img');a.appendChild(im);
  var tm=new Date(p.ts);
  var sp=document.createElement('span');sp.textContent=p2(tm.getHours())+':'+p2(tm.getMinutes());a.appendChild(sp);
  a.onclick=function(ev){ev.preventDefault();openViewer(photos.indexOf(p))};
  a._load=function(){
    // 縮小版があればそれ、なければ原寸(重いので、枚数が多い場合は縮小版つきの版のカメラで撮った写真から速くなる)
    var path=p.thumbPath||p.path||('case_files/'+p.key+'/'+p.name);
    urlOf(path).then(function(u){im.src=u}).catch(function(){
      if(p.thumbPath){urlOf(p.path||('case_files/'+p.key+'/'+p.name)).then(function(u){im.src=u}).catch(function(){sp.textContent+=' (取得不可)'})}
      else sp.textContent+=' (取得不可)';
    });
  };
  box.appendChild(a);
  if(io)io.observe(a);else a._load();
}
function dayBox(key,date){
  if(dayBoxes[key])return dayBoxes[key];
  var wrap=document.createElement('div');wrap.className='day';
  var h=document.createElement('h2');wrap.appendChild(h);
  var ht=document.createElement('span');h.appendChild(ht);
  var hb=document.createElement('button');hb.className='dl';h.appendChild(hb);
  var grid=document.createElement('div');grid.className='grid';wrap.appendChild(grid);
  var o={wrap:wrap,grid:grid,h:ht,n:0,date:date,key:key};
  o.dl=bindDl(hb,function(){return photos.filter(function(p){return p._day===key}).sort(function(a,b){return a.ts-b.ts})},function(n){return '⬇ この日 '+n+'枚'});
  dayBoxes[key]=o;
  // 新しい日が上に来るように、日付の降順で挿入
  var list=$('list'),placed=false;
  var kids=list.querySelectorAll('.day');
  for(var i=0;i<kids.length;i++){if(kids[i]._key<key){list.insertBefore(wrap,kids[i]);placed=true;break}}
  wrap._key=key;
  if(!placed)list.appendChild(wrap);
  return o;
}
function addPhotos(date,arr){
  arr=arr.filter(function(p){if(known[p.id])return false;known[p.id]=1;return true});
  if(!arr.length)return;
  var key=ymd(date),o=dayBox(key,date);
  arr.sort(function(a,b){return a.ts-b.ts});
  arr.forEach(function(p){p._day=key;photos.push(p);tile(p,o.grid);o.n++});
  o.h.textContent=(date.getMonth()+1)+'/'+date.getDate()+'('+WD[date.getDay()]+')  '+o.n+'枚';
  o.dl.update();updateAll();
  // 表示順(日付の新しい順→時刻順)に並べ替えて、前後移動の順序をそろえる
  photos.sort(function(a,b){var da=ymd(new Date(a.ts)),dbk=ymd(new Date(b.ts));return da===dbk?a.ts-b.ts:(da<dbk?1:-1)});
}

async function scan(from,days,my){
  // from: 一番新しい日。そこから days 日さかのぼる
  var dates=[];
  for(var i=0;i<days;i++){var d=new Date(from);d.setDate(d.getDate()-i);d.setHours(0,0,0,0);dates.push(d)}
  var idx=0,found=0;
  async function worker(){
    while(true){
      if(my!==token)return;
      var i=idx++;if(i>=dates.length)return;
      var d=dates[i];
      try{
        var data=(await db.ref('genba_photo_index/'+ymd(d)).once('value')).val()||{};
        if(my!==token)return;
        var arr=Object.keys(data).map(function(k){return Object.assign({id:k},data[k])}).filter(mine);
        if(arr.length){if($('msg'))$('list').textContent='';addPhotos(d,arr);found+=arr.length}
      }catch(e){}
      scanned++;
      if(my===token)$('st').textContent='探しています… '+scanned+'日分を確認('+photos.length+'枚見つかりました)';
    }
  }
  var ws=[];for(var w=0;w<PAR;w++)ws.push(worker());
  await Promise.all(ws);
  return found;
}

var oldest=null;
async function start(){
  var my=++token;busy=true;
  photos=[];dayBoxes={};known={};scanned=0;urlCache={};
  $('more').style.display='none';
  say('読み込み中…');$('st').textContent='';
  try{
    await authReady();
    db=scopedDatabase(firebase.database());st=firebase.storage();uk=getUserKey();
    if(!caseKey&&!caseName){say('案件の指定がありません。案件モーダルの「🖼 写真」から開いてください');return}
    var today=new Date();today.setHours(0,0,0,0);
    await scan(today,DAYS_STEP,my);
    if(my!==token)return;
    oldest=new Date(today);oldest.setDate(oldest.getDate()-(DAYS_STEP-1));
    finish();
  }catch(e){say('⚠ '+(e&&e.message||e));$('st').textContent=''}
  finally{busy=false}
}
function finish(){
  var tail='(直近'+scanned+'日を確認)';
  $('st').textContent=photos.length?(photos.length+'枚 '+tail):'';
  if(!photos.length)say('この案件の写真は、直近'+scanned+'日の間にありません。\n(現場カメラで案件を選んで撮った写真だけが対象です。「さらに前」で、もっと前を探せます)');
  $('more').style.display='block';
}
$('more').onclick=async function(){
  if(busy||!oldest)return;
  busy=true;var my=token;
  this.textContent='探しています…';
  var from=new Date(oldest);from.setDate(from.getDate()-1);
  var before=photos.length;
  try{
    await scan(from,DAYS_STEP,my);
    oldest=new Date(from);oldest.setDate(oldest.getDate()-(DAYS_STEP-1));
    finish();
  }finally{busy=false;this.textContent='さらに前の写真を探す'}
};
$('bReload').onclick=start;
// 現場モード(親ページ)から呼ぶ窓口: 直近2日だけ読み直して、新しく送られた写真を追加する(全期間の再検索はしない)
async function refreshRecent(){
  if(busy||!db)return;
  var my=token;
  var today=new Date();today.setHours(0,0,0,0);
  for(var i=0;i<2;i++){
    var d=new Date(today);d.setDate(d.getDate()-i);
    try{
      var data=(await db.ref('genba_photo_index/'+ymd(d)).once('value')).val()||{};
      if(my!==token)return;
      var arr=Object.keys(data).map(function(k){return Object.assign({id:k},data[k])}).filter(mine);
      if(arr.length){if($('msg'))$('list').textContent='';addPhotos(d,arr)}
    }catch(e){}
  }
  if(photos.length)$('st').textContent=photos.length+'枚 (直近'+scanned+'日を確認)';
}
window.casePhotos={refresh:refreshRecent,reload:start};

/* ---- ダウンロード(写真アプリへ保存) ----
   iOSは「取得」と「共有シートを開く」を別々の操作にしないと開けないので2段階: ⬇で取得 → 📥で共有シート(「画像を保存」)。
   1回に扱うのは40枚まで。多いときは「続きをダウンロード」で次の40枚へ。保存した写真は✓(genba-photos.htmlと同じ記録を共有) */
var SK='genbaPhotos.shared';
var shared={};try{shared=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
function saveShared(){try{localStorage.setItem(SK,JSON.stringify(shared))}catch(e){}}
function markShared(){
  var as=document.querySelectorAll('.grid a');
  for(var i=0;i<as.length;i++)as[i].classList.toggle('sv',!!shared[as[i].dataset.id]);
}
var CHUNK=40;
function bindDl(btn,getItems,baseLabel){
  var s={files:null,ids:null,items:null,pos:0};
  function label(){
    if(s.files){btn.textContent='📥 写真アプリへ保存('+s.files.length+'枚)';btn.classList.add('ready');return}
    btn.classList.remove('ready');
    if(s.items&&s.pos>0&&s.pos<s.items.length){btn.textContent='⬇ 続きをダウンロード(残り'+(s.items.length-s.pos)+'枚)';return}
    btn.textContent=baseLabel(getItems().length);
  }
  btn.onclick=async function(){
    if(s.files){ // 2段階目: 共有シートを開く
      try{
        if(navigator.canShare&&!navigator.canShare({files:s.files})){alert('この端末では一括共有できません。写真を開いて長押しで保存してください。');return}
        await navigator.share({files:s.files});
        s.ids.forEach(function(id){shared[id]=Date.now()});saveShared();markShared();
        s.files=null;s.ids=null;
        if(s.items&&s.pos>=s.items.length){s.items=null;s.pos=0;btn.classList.remove('ready');btn.textContent='✓ 保存しました';setTimeout(label,2500);return}
      }catch(e){if(e&&e.name!=='AbortError')alert('共有できませんでした: '+(e.message||e))}
      label();return;
    }
    if(!s.items||s.pos>=s.items.length){s.items=getItems();s.pos=0}
    if(!s.items.length)return;
    btn.disabled=true;
    var chunk=s.items.slice(s.pos,s.pos+CHUNK),got=[],ids=[];
    try{
      for(var i=0;i<chunk.length;i++){
        btn.textContent='ダウンロード中 '+(s.pos+i+1)+'/'+s.items.length;
        var p=chunk[i];
        var u=await urlOf(p.path||('case_files/'+p.key+'/'+p.name));
        var r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);
        got.push(new File([await r.blob()],p.name,{type:'image/jpeg'}));ids.push(p.id);
      }
      s.files=got;s.ids=ids;s.pos+=chunk.length;
    }catch(e){
      s.files=null;s.ids=null;
      alert('取得できませんでした: '+(e&&e.message||e)+'\n(写真を1枚ずつ開いて長押しで保存もできます)');
    }
    btn.disabled=false;label();
  };
  label();
  return {update:function(){if(!s.files&&!btn.disabled)label()}};
}
var allDl=bindDl($('dlAll'),function(){return photos.slice().sort(function(a,b){return a.ts-b.ts})},function(n){return '⬇ 全部ダウンロード('+n+'枚)'});
function updateAll(){$('dlAll').style.display=photos.length?'':'none';allDl.update()}

/* ---- 原寸表示(タップで拡大/縮小、◀▶で前後) ---- */
var cur=-1;
function showAt(i){
  if(i<0||i>=photos.length)return;
  cur=i;var p=photos[i];
  var im=$('vimg');im.style.width='100%';im.removeAttribute('src');
  var tm=new Date(p.ts);
  $('vinfo').textContent=(i+1)+' / '+photos.length+'   '+(tm.getMonth()+1)+'/'+tm.getDate()+' '+p2(tm.getHours())+':'+p2(tm.getMinutes());
  var path=p.path||('case_files/'+p.key+'/'+p.name);
  urlOf(path).then(function(u){if(cur===i)im.src=u}).catch(function(){$('vinfo').textContent+='  (取得できません)'});
  $('vwrap').scrollTop=0;$('vwrap').scrollLeft=0;
}
function openViewer(i){$('viewer').style.display='block';showAt(i)}
$('vimg').onclick=function(){this.style.width=(this.style.width==='100%'?'250%':'100%')};
$('vclose').onclick=function(){$('viewer').style.display='none';$('vimg').removeAttribute('src');cur=-1};
$('vprev').onclick=function(){showAt(cur-1)};
$('vnext').onclick=function(){showAt(cur+1)};

start();
})();
</script>
</body>
</html>
