<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>仮予約</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<link rel="stylesheet" href="shared-modal.css">
<script src="shared-modal.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #4f8ef7;
    --accent-dim: rgba(79,142,247,0.15);
    --kari: #f0a500;
    --kari-dim: rgba(240,165,0,0.18);
    --kakutei: #2e9e5b;
    --kakutei-dim: rgba(46,158,91,0.18);
    --text: #e8e8e8;
    --text-dim: #888;
    --danger: #e05c5c;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px 14px 60px;
  }
  h1 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 13px; font-weight: 600; color: #aaa; margin-bottom: 10px; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px; }
  input[type=date], input[type=time], input[type=text], textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px;
    font-size: 15px;
    outline: none;
    font-family: var(--font);
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 50px; }
  .row2 { display: flex; gap: 8px; }
  .row2 > div { flex: 1; }
  button.primary {
    width: 100%;
    margin-top: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:active { opacity: 0.75; }
  button.primary:disabled { opacity: 0.5; }
  #formMsg { font-size: 13px; margin-top: 8px; min-height: 16px; }
  #formMsg.err { color: var(--danger); }
  #formMsg.ok { color: var(--kakutei); }

  .slot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    background: var(--surface2);
    margin-bottom: 6px;
    cursor: pointer;
    border-left: 3px solid var(--kari);
  }
  .slot.kakutei { border-left-color: var(--kakutei); }
  .slot .time { font-weight: 700; font-size: 13px; min-width: 92px; color: var(--accent); }
  .slot .who { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 5px; background: var(--kari-dim); color: var(--kari); font-weight: 700; }
  .badge.kakutei { background: var(--kakutei-dim); color: var(--kakutei); }
  .empty { color: var(--text-dim); font-size: 13px; padding: 6px 2px; }

  .list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--surface2);
    margin-bottom: 6px;
    cursor: pointer;
  }
  .list-item .d { font-size: 12px; color: var(--text-dim); min-width: 78px; }
  .list-item .t { font-weight: 700; font-size: 13px; min-width: 88px; color: var(--accent); }
  .list-item .w { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .target-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 14px;
    font-size: 15px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .target-btn:active { opacity: 0.7; }
  .target-btn.current { border-color: var(--accent); color: var(--accent); }

  .switch-target {
    font-size: 12px;
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
    margin-bottom: 14px;
    display: inline-block;
  }

  .week-nav {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; overflow-x: auto; }
  .week-col { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 4px 3px; min-height: 60px; }
  .week-col.today { border-color: var(--accent); }
  .week-col-head { text-align: center; margin-bottom: 4px; cursor: pointer; }
  .week-col-head .wd { font-size: 9px; color: #888; }
  .week-col-head .dnum { font-size: 13px; font-weight: 700; }
  .week-col.today .dnum { color: var(--accent); }
  .week-item {
    background: var(--bg);
    border-radius: 5px;
    padding: 3px 4px;
    margin-bottom: 3px;
    cursor: pointer;
    font-size: 9.5px;
    line-height: 1.3;
  }
  .week-item .wi-tm { color: var(--accent); font-weight: 700; display: block; }
  .week-item .wi-tt { color: #ccc; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .week-empty { font-size: 9px; color: var(--text-dim); text-align: center; padding: 6px 0; }

  .day-group { margin-bottom: 14px; }
  .day-group:last-child { margin-bottom: 0; }
  .day-group-header { font-size: 12px; font-weight: 700; color: #ccc; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .day-group-header.is-today { color: var(--accent); }
  .agenda-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 7px;
    background: var(--surface2);
    margin-bottom: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .agenda-item .ord { min-width: 20px; color: var(--text-dim); font-size: 11px; }
  .agenda-item .tm { min-width: 42px; color: var(--accent); font-weight: 700; font-size: 11px; }
  .agenda-item .tt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* modal */
  #overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
  }
  #overlay.show { display: flex; }
  #modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 18px;
    padding-bottom: 30px;
  }
  #modal h3 { font-size: 15px; margin-bottom: 10px; }
  #modal .mrow { font-size: 13px; color: #ccc; margin-bottom: 6px; }
  #modal .mrow b { color: #fff; }
  #modal .mbtns { display: flex; gap: 8px; margin-top: 14px; }
  #modal button { flex: 1; padding: 11px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
  #modal .close { background: var(--surface2); color: var(--text); }
  #modal .del { background: var(--danger); color: #fff; }
  #modal .conf { background: var(--kakutei); color: #fff; }

  #authNote { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  #adminBadge { display: inline-block; font-size: 10px; background: var(--accent-dim); color: var(--accent); padding: 2px 7px; border-radius: 5px; margin-left: 6px; font-weight: 700; }
</style>
</head>
<body>

<h1>仮予約<span id="adminBadge" style="display:none;">管理者</span></h1>
<div id="authNote" class="sub">読み込み中...</div>

<!-- 対象者選択画面 -->
<div id="targetPicker" style="display:none;">
  <div class="card">
    <h2>誰の予定を仮予約しますか？</h2>
    <div id="targetList"></div>
  </div>
</div>

<!-- 本体（対象者選択後に表示） -->
<div id="mainArea" style="display:none;">
  <div><span class="switch-target" onclick="backToPicker()">← 対象者を変更</span></div>
  <div class="sub" id="targetLabel"></div>

  <div class="card">
    <h2>週間カレンダー</h2>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <button class="week-nav" onclick="shiftWeek(-1)">◀ 前週</button>
      <div id="weekLabel" style="font-size:12px;color:#aaa;"></div>
      <button class="week-nav" onclick="shiftWeek(1)">翌週 ▶</button>
    </div>
    <div id="weekGrid" class="week-grid"></div>
    <div style="font-size:11px;color:var(--text-dim);margin-top:8px;">各予定をタップすると詳細（仮予約は削除・確定、案件は詳細情報）が見られます。</div>
  </div>

  <div class="card">
    <h2>この日の仮予約状況</h2>
    <label>日付</label>
    <input type="date" id="viewDate">
    <div id="slotsForDay" style="margin-top:10px;"></div>
  </div>

  <div class="card">
    <h2>仮予約を入れる</h2>
    <div class="row2">
      <div><label>開始時刻</label><input type="time" id="fStart" value="09:00"></div>
      <div><label>終了時刻</label><input type="time" id="fEnd" value="10:00"></div>
    </div>
    <label>お名前・会社名</label>
    <input type="text" id="fName" placeholder="例：営業部 山田">
    <label>案件名・要件メモ</label>
    <textarea id="fMemo" placeholder="例：〇〇邸 SK下見の件で相談"></textarea>
    <button class="primary" id="submitBtn" onclick="submitReservation()">この時間で仮予約する</button>
    <div id="formMsg"></div>
  </div>

  <div class="card">
    <h2>今後の仮予約 一覧</h2>
    <div id="upcomingList"><div class="empty">読み込み中...</div></div>
  </div>
</div>

<!-- 正規の案件モーダル（shared-modal.js用）。kari権限や対象外ユーザーには読み取り専用に切り替える -->
<div id="modal-overlay">
  <div id="modal-content">
    <button id="modal-close">✕ 閉じる</button>
    <div id="readonly-note" style="display:none;background:#fff3cd;color:#7a5b00;font-size:12px;padding:6px 10px;border-radius:6px;margin-bottom:10px;">閲覧のみ（この画面からの編集はできません）</div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <h3 id="mTitle"></h3>
    <div id="modalRows"></div>
    <div class="mbtns">
      <button class="close" onclick="closeModal()">閉じる</button>
      <button class="conf" id="mConfBtn" style="display:none;" onclick="markKakutei()">確定にする</button>
      <button class="del" id="mDelBtn" style="display:none;" onclick="deleteCurrentSlot()">削除</button>
    </div>
  </div>
</div>

<script>
// ============ 設定 ============
var firebaseConfig = {
  apiKey: "AIzaSyDznSykpSebsejNdQtpOgfORuzZSoW3_fs",
  authDomain: "project-6745138395263517914.firebaseapp.com",
  databaseURL: "https://project-6745138395263517914-default-rtdb.firebaseio.com",
  projectId: "project-6745138395263517914",
  storageBucket: "project-6745138395263517914.firebasestorage.app",
  messagingSenderId: "1054295910908",
  appId: "1:1054295910908:web:4072df05bd90bbdc896a79"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var rawDb = firebase.database(); // users/{userKey}/... を明示パスで扱う（scopedDatabaseは使わない）

var isAdmin = false;
var isKari = false;
var myUserKey = null;   // 自分がstaffログインしている場合の自分のuserKey（無ければnull）
var currentUid = null;
var targetUserKey = null; // 今、誰の枠に仮予約しているか
var currentDate = todayStr();
var currentModalPath = null; // "date/id"
var kariTargets = {};

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

document.getElementById('viewDate').value = currentDate;

// ============ 認証 ============
// 既にlogin.html経由でこのブラウザにスタッフ/管理者セッションがあれば、それをそのまま使う。
// セッションが無ければ、この機能専用のkari-login.html（専用PIN）へ誘導する。
firebase.auth().onAuthStateChanged(function (user) {
  if (user) {
    afterAuth(user);
  } else {
    redirectToKariLogin();
  }
});

function redirectToKariLogin() {
  var here = location.pathname.split('/').pop() || 'kari-yoyaku.html';
  location.replace('kari-login.html?return=' + encodeURIComponent(here));
}

function afterAuth(user) {
  currentUid = user.uid;
  user.getIdTokenResult().then(function (res) {
    var claims = res.claims || {};
    isAdmin = !!claims.admin;
    isKari = claims.role === 'kari';
    myUserKey = claims.userKey || null;

    if (!isAdmin && !isKari && claims.role !== 'staff') {
      firebase.auth().signOut().then(redirectToKariLogin);
      return;
    }

    document.getElementById('adminBadge').style.display = isAdmin ? 'inline-block' : 'none';
    document.getElementById('authNote').textContent = isAdmin
      ? '管理者としてアクセス中です。'
      : (isKari ? '仮予約用アカウントでアクセス中です。' : 'スタッフとしてアクセス中です。');

    loadTargets();
  });
}

// ============ 対象者選択 ============
function loadTargets() {
  rawDb.ref('config/kari_targets').once('value').then(function (snap) {
    kariTargets = snap.val() || {};
    renderTargetPicker();
  }).catch(function (e) {
    document.getElementById('authNote').textContent = '対象者リストの取得に失敗しました：' + e.message;
  });
}

function renderTargetPicker() {
  var box = document.getElementById('targetList');
  box.innerHTML = '';
  var keys = Object.keys(kariTargets);
  if (keys.length === 0) {
    box.innerHTML = '<div class="empty">対象者が未登録です（config/kari_targetsに追加してください）</div>';
  }
  keys.forEach(function (key) {
    var btn = document.createElement('button');
    btn.className = 'target-btn' + (key === myUserKey ? ' current' : '');
    btn.textContent = (kariTargets[key].name || key) + (key === myUserKey ? '（自分）' : '');
    btn.onclick = function () { selectTarget(key); };
    box.appendChild(btn);
  });
  document.getElementById('targetPicker').style.display = 'block';
  document.getElementById('mainArea').style.display = 'none';

  // staff/adminとして自分のuserKeyが分かっていれば、選び直す手間を省くため自動選択。
  // 仮予約(kari)ロールはどの対象にするか毎回選ぶ必要がある（自分の枠を持たないため）。
  if (myUserKey && kariTargets[myUserKey] && !isKari) {
    selectTarget(myUserKey);
  }
}

function backToPicker() {
  if (targetUserKey) {
    rawDb.ref('users/' + targetUserKey + '/kari_yoyaku_slots').off();
    rawDb.ref('users/' + targetUserKey + '/kari_yoyaku_slots/' + currentDate).off();
  }
  targetUserKey = null;
  document.getElementById('targetPicker').style.display = 'block';
  document.getElementById('mainArea').style.display = 'none';
}

function selectTarget(key) {
  targetUserKey = key;
  document.getElementById('targetLabel').textContent = '対象：' + (kariTargets[key].name || key);
  document.getElementById('targetPicker').style.display = 'none';
  document.getElementById('mainArea').style.display = 'block';
  loadCaseData(key);
  initData();
}

// ============ 既存の案件・個人予定（参考表示） ============
var targetTasks = {};
var targetPersonal = {};
function loadCaseData(key) {
  targetTasks = {};
  targetPersonal = {};
  window.__kariGlobalHeaders = [];
  rawDb.ref('users/' + key + '/app_tasks').once('value').then(function (snap) {
    targetTasks = snap.val() || {};
    renderWeekView();
  }).catch(function (e) { console.warn('app_tasks取得失敗', e); });
  rawDb.ref('users/' + key + '/personal_calendar').once('value').then(function (snap) {
    targetPersonal = snap.val() || {};
    renderWeekView();
  }).catch(function (e) { console.warn('personal_calendar取得失敗', e); });
  rawDb.ref('users/' + key + '/app_meta/headers').once('value').then(function (snap) {
    window.__kariGlobalHeaders = snap.val() || [];
  }).catch(function (e) { console.warn('app_meta取得失敗', e); });
}
function formatToYMD(v) {
  if (!v) return '';
  var s = String(v).trim();
  var m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (!m) return '';
  return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
}
function extractArea(addr) {
  if (!addr) return '';
  var a = addr.replace(/\s+/g, '');
  var s = a.match(/札幌市(.+?区)/); if (s) return s[1];
  var c = a.match(/北海道(.+?市)/); if (c && !c[1].includes('札幌')) return c[1];
  var t = a.match(/郡(.+?[町村])/); if (t) return t[1];
  return 'その他';
}
function buildDayItems(date) {
  var items = [];
  Object.keys(targetTasks).forEach(function (key) {
    var obj = targetTasks[key]; var cols = obj.csvData; if (!cols) return;
    var shitami = formatToYMD(cols[12]);
    var yotei = formatToYMD(obj.date);
    var title = cols[4] || '(無題)';
    var time = cols[13] || obj.time || '';
    var order = obj.order || '';
    var area = extractArea(cols[11] || '');
    if (shitami === date) {
      items.push({ badge: '🔵', kindLabel: '下見', title: title, area: area, time: time, order: order, obj: obj, caseKey: key, date: date });
    }
    if (yotei === date && yotei !== shitami) {
      items.push({ badge: '🟠', kindLabel: '下見予定', title: title, area: area, time: obj.time || '', order: order, obj: obj, caseKey: key, date: date });
    }
  });
  var pday = targetPersonal[date];
  if (pday) {
    Object.keys(pday).forEach(function (id) {
      var ev = pday[id];
      items.push({ badge: '📅', kindLabel: '個人予定', title: ev.title || '', area: '', time: ev.allDay ? '終日' : (ev.start || ''), order: '', personal: true, date: date });
    });
  }
  var kday = (allKariSlotsData[date]) || {};
  Object.keys(kday).forEach(function (id) {
    var e = kday[id];
    items.push({
      badge: e.status === '確定' ? '✅' : '🟠',
      kindLabel: e.status === '確定' ? '確定' : '仮予約',
      title: (e.requester_name || '') + (e.memo ? '　' + e.memo : ''),
      area: '', time: (e.start || '') + '〜' + (e.end || ''),
      order: '',
      kari: true, kariDate: date, kariId: id, kariE: e
    });
  });
  items.sort(function (a, b) {
    var oa = parseInt(a.order, 10); var ob = parseInt(b.order, 10);
    var oaKey = isNaN(oa) ? 9999 : oa;
    var obKey = isNaN(ob) ? 9999 : ob;
    if (oaKey !== obKey) return oaKey - obKey;
    return (a.time || '99:99').localeCompare(b.time || '99:99');
  });
  return items;
}

function renderWeekView() {
  var box = document.getElementById('weekGrid');
  if (!box || !currentDate) return;
  var base = dateFromStr(currentDate);
  var dow = base.getDay();
  var sunday = new Date(base); sunday.setDate(base.getDate() - dow);
  var labels = ['日', '月', '火', '水', '木', '金', '土'];
  var today = todayStr();
  var html = '';
  var weekDates = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(sunday); d.setDate(sunday.getDate() + i);
    var ds = dateToStr(d);
    weekDates.push(ds);
    var items = buildDayItems(ds);
    html += '<div class="week-col' + (ds === today ? ' today' : '') + '">';
    html += '<div class="week-col-head" data-daypick="' + ds + '"><div class="wd">' + labels[i] + '</div><div class="dnum">' + d.getDate() + '</div></div>';
    if (items.length === 0) {
      html += '<div class="week-empty">空き</div>';
    } else {
      items.forEach(function (it, idx) {
        var mainText = it.kari
          ? it.title
          : (it.personal ? it.title : (it.kindLabel + (it.area ? '【' + it.area + '】' : '')));
        html += '<div class="week-item" data-date="' + ds + '" data-idx="' + idx + '">'
          + '<span class="wi-tm">' + (it.order ? it.order + '. ' : '') + (it.time || '') + '</span>'
          + '<span class="wi-tt">' + it.badge + escapeHtml(mainText) + '</span>'
          + '</div>';
      });
    }
    html += '</div>';
  }
  box.innerHTML = html;
  document.getElementById('weekLabel').textContent = (sunday.getMonth() + 1) + '月' + sunday.getDate() + '日 〜';

  // 日付見出しタップ＝仮予約フォームの対象日を変更
  box.querySelectorAll('[data-daypick]').forEach(function (el) {
    el.onclick = function () {
      var ds = this.getAttribute('data-daypick');
      document.getElementById('viewDate').value = ds;
      attachDayListener(ds);
    };
  });

  // 各予定タップ＝詳細モーダル
  weekDates.forEach(function (ds3) {
    var dayItems = buildDayItems(ds3);
    var els = box.querySelectorAll('.week-item[data-date="' + ds3 + '"]');
    els.forEach(function (el) {
      var idx = parseInt(el.getAttribute('data-idx'), 10);
      var it = dayItems[idx];
      if (!it) return;
      el.onclick = function () {
        if (it.kari) openModal(it.kariDate, it.kariId, it.kariE);
        else if (it.personal) openPersonalInfoModal(it);
        else openRealCaseModal(it);
      };
    });
  });
}

// ============ データ購読 ============
function slotsRef(date) {
  return rawDb.ref('users/' + targetUserKey + '/kari_yoyaku_slots/' + date);
}
function slotsRootRef() {
  return rawDb.ref('users/' + targetUserKey + '/kari_yoyaku_slots');
}

var dayListenerDate = null;
function initData() {
  attachDayListener(currentDate);
  document.getElementById('viewDate').onchange = function () {
    attachDayListener(this.value);
  };
  subscribeUpcoming();
}

function attachDayListener(date) {
  if (dayListenerDate) slotsRef(dayListenerDate).off('value', renderDayView);
  currentDate = date;
  dayListenerDate = date;
  slotsRef(date).on('value', renderDayView);
  renderWeekView();
}

// ============ 週間カレンダー ============
var allKariCounts = {}; // date(YYYY-MM-DD) -> 件数（未使用だが互換のため保持）
var allKariSlotsData = {}; // date(YYYY-MM-DD) -> {id: entry} 週間表示用
function dateFromStr(s) { var p = s.split('-'); return new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2])); }
function dateToStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function shiftWeek(delta) {
  var d = dateFromStr(currentDate);
  d.setDate(d.getDate() + delta * 7);
  var newDate = dateToStr(d);
  document.getElementById('viewDate').value = newDate;
  attachDayListener(newDate);
}

var currentDaySlots = {};
function renderDayView(snap) {
  var data = snap.val() || {};
  currentDaySlots = data;
  renderWeekView();
  var box = document.getElementById('slotsForDay');
  var keys = Object.keys(data).sort(function (a, b) {
    return data[a].start.localeCompare(data[b].start);
  });
  if (keys.length === 0) {
    box.innerHTML = '<div class="empty">この日の仮予約はまだありません</div>';
    return;
  }
  box.innerHTML = '';
  keys.forEach(function (id) {
    var e = data[id];
    var div = document.createElement('div');
    div.className = 'slot' + (e.status === '確定' ? ' kakutei' : '');
    div.innerHTML =
      '<span class="time">' + e.start + '〜' + e.end + '</span>' +
      '<span class="who">' + escapeHtml(e.requester_name || '') + '</span>' +
      '<span class="badge' + (e.status === '確定' ? ' kakutei' : '') + '">' + (e.status || '仮') + '</span>';
    div.onclick = function () { openModal(currentDate, id, e); };
    box.appendChild(div);
  });
}

function subscribeUpcoming() {
  var box = document.getElementById('upcomingList');
  slotsRootRef().on('value', function (snap) {
    var all = snap.val() || {};
    allKariSlotsData = all;
    var rows = [];
    var today = todayStr();
    allKariCounts = {};
    Object.keys(all).forEach(function (date) {
      var dayData = all[date];
      allKariCounts[date] = Object.keys(dayData).length;
      if (date < today) return;
      Object.keys(dayData).forEach(function (id) {
        rows.push({ date: date, id: id, e: dayData[id] });
      });
    });
    renderWeekView();
    rows.sort(function (a, b) {
      return (a.date + a.e.start).localeCompare(b.date + b.e.start);
    });
    if (rows.length === 0) {
      box.innerHTML = '<div class="empty">今後の仮予約はありません</div>';
      return;
    }
    box.innerHTML = '';
    rows.forEach(function (r) {
      var div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML =
        '<span class="d">' + r.date + '</span>' +
        '<span class="t">' + r.e.start + '〜' + r.e.end + '</span>' +
        '<span class="w">' + escapeHtml(r.e.requester_name || '') + (r.e.status === '確定' ? ' ✅' : '') + '</span>';
      div.onclick = function () { openModal(r.date, r.id, r.e); };
      box.appendChild(div);
    });
  });
}

// ============ モーダル ============
function rowsHtml(rows) {
  return rows.map(function (r) {
    return '<div class="mrow"><b>' + escapeHtml(r.label) + '：</b>' + escapeHtml(r.value) + '</div>';
  }).join('');
}

function openModal(date, id, e) {
  currentModalPath = date + '/' + id;
  document.getElementById('mTitle').textContent = date + ' の仮予約';
  document.getElementById('modalRows').innerHTML = rowsHtml([
    { label: '時間', value: e.start + '〜' + e.end },
    { label: '依頼者', value: e.requester_name || '(未入力)' },
    { label: 'メモ', value: e.memo || '(メモなし)' },
    { label: '状態', value: e.status || '仮' }
  ]);

  var canDelete = isAdmin || isKari || (myUserKey === targetUserKey);
  document.getElementById('mDelBtn').style.display = canDelete ? 'block' : 'none';
  document.getElementById('mConfBtn').style.display = (isAdmin && e.status !== '確定') ? 'block' : 'none';

  document.getElementById('overlay').classList.add('show');
}

function openPersonalInfoModal(item) {
  currentModalPath = null;
  document.getElementById('mTitle').textContent = item.date + ' の個人予定';
  document.getElementById('modalRows').innerHTML = rowsHtml([
    { label: '時間', value: item.time || '（未設定）' },
    { label: 'タイトル', value: item.title || '' }
  ]);
  document.getElementById('mDelBtn').style.display = 'none';
  document.getElementById('mConfBtn').style.display = 'none';
  document.getElementById('overlay').classList.add('show');
}

// 案件（下見・下見予定）は正規の案件モーダル(shared-modal.js)をそのまま使う。
// ただし書き込み権限が無いユーザー（kari権限、または対象者=自分以外のスタッフ）が
// 開いた場合は、保存が静かに失敗して混乱するのを防ぐため、入力欄を読み取り専用にする。
function canEditTarget() {
  return isAdmin || (myUserKey && myUserKey === targetUserKey);
}
function openRealCaseModal(item) {
  var fakeScopedDb = {
    ref: function (path) {
      return (path === undefined || path === '')
        ? rawDb.ref('users/' + targetUserKey)
        : rawDb.ref('users/' + targetUserKey + '/' + path);
    }
  };
  var globalHeaders = window.__kariGlobalHeaders || [];
  window.openCaseModal(item.caseKey, item.obj, globalHeaders, targetTasks, null, fakeScopedDb, function () {
    renderWeekView();
  });
  var readonly = !canEditTarget();
  document.getElementById('readonly-note').style.display = readonly ? 'block' : 'none';
  if (readonly) {
    setTimeout(function () {
      var body = document.getElementById('modal-body');
      if (!body) return;
      body.querySelectorAll('input, textarea, select, button').forEach(function (el) {
        el.disabled = true;
        el.style.pointerEvents = 'none';
        el.style.opacity = '0.6';
      });
      body.querySelectorAll('.kanban-step').forEach(function (el) {
        el.style.pointerEvents = 'none';
        el.style.opacity = '0.6';
      });
    }, 0);
  }
}
function closeModal() {
  document.getElementById('overlay').classList.remove('show');
  currentModalPath = null;
}
function deleteCurrentSlot() {
  if (!currentModalPath) return;
  if (!confirm('この仮予約を削除しますか？')) return;
  slotsRootRef().child(currentModalPath).remove()
    .then(closeModal)
    .catch(function (e) { alert('削除できませんでした：' + e.message); });
}
function markKakutei() {
  if (!currentModalPath) return;
  slotsRootRef().child(currentModalPath).update({ status: '確定' })
    .then(closeModal)
    .catch(function (e) { alert('更新できませんでした：' + e.message); });
}

// ============ 新規予約（重複チェック付きトランザクション） ============
function submitReservation() {
  var date = document.getElementById('viewDate').value;
  var start = document.getElementById('fStart').value;
  var end = document.getElementById('fEnd').value;
  var name = document.getElementById('fName').value.trim();
  var memo = document.getElementById('fMemo').value.trim();
  var msg = document.getElementById('formMsg');
  var btn = document.getElementById('submitBtn');

  msg.className = ''; msg.textContent = '';

  if (!date || !start || !end) { msg.className = 'err'; msg.textContent = '日付・開始・終了を入力してください'; return; }
  if (start >= end) { msg.className = 'err'; msg.textContent = '終了時刻は開始時刻より後にしてください'; return; }
  if (!name) { msg.className = 'err'; msg.textContent = 'お名前・会社名を入力してください'; return; }

  btn.disabled = true;

  slotsRef(date).transaction(function (current) {
    current = current || {};
    for (var key in current) {
      var e = current[key];
      if (!(end <= e.start || start >= e.end)) {
        return; // undefinedを返す＝トランザクション中止（重複あり）
      }
    }
    var newId = rawDb.ref().push().key;
    current[newId] = {
      start: start,
      end: end,
      requester_name: name,
      memo: memo,
      status: '仮',
      ownerUid: currentUid,
      created_at: Date.now()
    };
    return current;
  }, function (error, committed) {
    btn.disabled = false;
    if (error) {
      msg.className = 'err'; msg.textContent = '通信エラー：' + error.message;
    } else if (!committed) {
      msg.className = 'err'; msg.textContent = 'その時間帯は既に他の仮予約と重複しています。時間を変えてください。';
    } else {
      msg.className = 'ok'; msg.textContent = '仮予約を登録しました。';
      document.getElementById('fMemo').value = '';
    }
  });
}
</script>
