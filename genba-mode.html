<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>現場モード</title>
<!-- VERSION: 2026-11-18 (v1118-b) 撮り直しで消した写真を写真画面からも外す | 前: 2026-11-17 (v1117-b) 写真の画面でダウンロード(共有シート)が使えるよう、写真の枠に web-share を許可 | 前: 2026-11-17 (v1117-a) ノート・写真・カメラの3画面を相互に切り替え(単独3通り+横向きの左右分割3通り: ノート|カメラ・ノート|写真・写真|カメラ)/URLのmode(file/photos/cam)で最初に出す画面を指定できる(案件モーダルの📷📝🖼から開く用)/写真(case-photos.html)は最初に開いた時に読み込み、開くたび・30秒ごとに新しい写真を追加/「☁ 写真一覧」は「📅 日別」に改名(従来どおり日付ごとの一覧を別タブで開く) | 前: 2026-11-13 (v1113-e) 分割表示中は、図面側を触っていてもカメラが1分で止まらないようにした(20秒ごとにカメラへ「使用中」を知らせる)。カメラだけ/ファイルだけの時は従来どおり | 前: 2026-11-12 (v1112-a) 軽量化: ファイルを見ている間はカメラ映像を止め、カメラ/分割に切り替えると再開/未保存枚数は1.5秒ごとの確認をやめ、カメラからの通知で更新 | 前: 2026-11-11 (v1111-d) ←で戻る時の未保存確認を廃止(未保存は「カメラ」タブの赤い枚数で常に表示) | 前: 2026-11-11 (v1111-c) 上部に「☁ 写真一覧」(クラウドの今日の写真を案件別に表示・写真アプリへ保存)を追加 | 前: 2026-11-11 (v1111-b) 未保存の写真があれば「カメラ」タブに枚数を赤で表示/←で戻るとき確認 | 前: 2026-11-11 (v1111-a) カメラへ案件キーも渡す(撮影写真の自動アップロード先を確定するため) | 前: 2026-11-10 (v1110-b) 修正: 子ページ枠の高さが150pxで止まり画面が出ない不具合(height:100%を指定) | 前: v1110-a 新規: 現場モード。ファイル(pdf-note.html)とカメラ(genba-camera.html)を1画面に常駐させ、タブ切替/横向き分割で行き来できる。案件はURL(?case=案件キー&name=案件名&addr=住所)で受け取り、最後の案件を端末に記憶 -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:-apple-system,"Hiragino Sans",sans-serif;overflow:hidden}
#top{position:fixed;left:0;right:0;top:0;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;gap:6px;background:#1c1c1e;border-bottom:1px solid #333;z-index:10}
#top button,#top a{font-size:14px;border:none;border-radius:8px;padding:8px 12px;background:#3a3a3c;color:#fff;text-decoration:none;white-space:nowrap;flex:none}
#top button.on{background:#0a84ff;font-weight:bold}
#title{flex:1;min-width:0;font-size:14px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
#ver{font-size:10px;color:#777;flex:none}
#body{position:fixed;left:0;right:0;bottom:0;top:calc(46px + env(safe-area-inset-top))}
.pane{position:absolute;top:0;height:100%;border:0;background:#000;visibility:hidden;pointer-events:none;left:0;width:100%}
/* 単独表示: 選んだ側だけ全面に出す。隠す側も同じ大きさのまま残す(映像・PDFの状態を保つ) */
body[data-mode=file] #pf,body[data-mode=photos] #pp,body[data-mode=cam] #pc{visibility:visible;pointer-events:auto;z-index:2}
/* 左右分割(横向きの広い画面のみ): fc=ノート|カメラ fp=ノート|写真 pc=写真|カメラ。左58%/右42% */
body[data-mode=fc] #pf,body[data-mode=fp] #pf,body[data-mode=pc] #pp{visibility:visible;pointer-events:auto;width:58%;left:0}
body[data-mode=fc] #pc,body[data-mode=pc] #pc,body[data-mode=fp] #pp{visibility:visible;pointer-events:auto;width:42%;left:58%;border-left:2px solid #333}
#empty{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;line-height:2;font-size:16px;padding:20px}
#empty a{color:#0a84ff}
</style>
</head>
<body data-mode="file">
<div id="top">
  <button id="bBack">←</button>
  <div id="title">現場モード</div>
  <button id="tFile">📝 ノート</button>
  <button id="tPhoto">🖼 写真</button>
  <button id="tCam">📷 カメラ</button>
  <button id="tSplit">◫ 分割</button>
  <button id="tDays">📅 日別</button>
  <span id="ver"></span>
</div>
<div id="body">
  <iframe id="pf" class="pane" allow="camera *; microphone *; geolocation *; web-share *; fullscreen *"></iframe>
  <iframe id="pc" class="pane" allow="camera *; microphone *; geolocation *; web-share *; fullscreen *"></iframe>
  <iframe id="pp" class="pane" allow="web-share *; fullscreen *"></iframe>
</div>
<div id="empty">案件が指定されていません。<br>案件モーダルの「🏗 現場モード」から開いてください。<br><a href="today.html">Todayへ</a></div>
<script>
(function(){
'use strict';
var VER='v1118-b';
var $=function(id){return document.getElementById(id)};
var LASTKEY='genbaMode.last', MODEKEY='genbaMode.mode';
var q=new URLSearchParams(location.search);
var cur={key:q.get('case')||'',name:q.get('name')||'',addr:q.get('addr')||'',file:q.get('file')||''};
if(cur.key){
  try{localStorage.setItem(LASTKEY,JSON.stringify({key:cur.key,name:cur.name,addr:cur.addr}))}catch(e){}
}else{
  try{var l=JSON.parse(localStorage.getItem(LASTKEY)||'null');if(l&&l.key){cur.key=l.key;cur.name=l.name||'';cur.addr=l.addr||''}}catch(e){}
}
$('ver').textContent=VER;
if(!cur.key){
  $('empty').style.display='flex';$('body').style.display='none';
  $('bBack').onclick=function(){location.href='today.html'};
  return;
}
$('title').textContent=cur.name||'(案件名なし)';

/* ---------- 画面モード ----------
   単独: file(ノート) / photos(写真) / cam(カメラ)
   左右分割(横向きの広い画面のみ): fc=ノート|カメラ / fp=ノート|写真 / pc=写真|カメラ */
var SINGLE=['file','photos','cam'],SPLITS=['fc','fp','pc'];
var SPLIT_LABEL={fc:'ノート|カメラ',fp:'ノート|写真',pc:'写真|カメラ'};
function canSplit(){return window.innerWidth>=900&&window.innerWidth/window.innerHeight>1.2}
function isSplit(m){return SPLITS.indexOf(m)>=0}
function normMode(m){if(m==='split')m='fc';return(SINGLE.indexOf(m)>=0||isSplit(m))?m:''}
function has(m,part){ // そのモードで part(file/photos/cam)が見えているか
  if(!isSplit(m))return m===part;
  return (m==='fc'&&(part==='file'||part==='cam'))||(m==='fp'&&(part==='file'||part==='photos'))||(m==='pc'&&(part==='photos'||part==='cam'));
}
function fallback(m){return m==='pc'?'photos':'file'} // 分割できない画面では、左側の画面だけを出す
var mode=normMode(q.get('mode')||'');
if(!mode){try{mode=normMode(localStorage.getItem(MODEKEY)||'')}catch(e){}}
if(!mode)mode=canSplit()?'fc':'file';
if(isSplit(mode)&&!canSplit())mode=fallback(mode);
function setMode(m,save){
  if(isSplit(m)&&!canSplit())m=fallback(m);
  mode=m;document.body.dataset.mode=m;
  $('tFile').classList.toggle('on',m==='file');
  $('tPhoto').classList.toggle('on',m==='photos');
  $('tCam').classList.toggle('on',m==='cam');
  $('tSplit').classList.toggle('on',isSplit(m));
  $('tSplit').textContent=isSplit(m)?'◫ '+SPLIT_LABEL[m]:'◫ 分割';
  if(save){try{localStorage.setItem(MODEKEY,m)}catch(e){}}
  if(has(m,'photos'))showPhotos();
  if(has(m,'cam'))wakeCam();else sleepCam(); // カメラが見えていない間は映像を止める
}
$('tFile').onclick=function(){setMode('file',true)};
$('tPhoto').onclick=function(){setMode('photos',true)};
$('tCam').onclick=function(){setMode('cam',true)};
$('tSplit').onclick=function(){
  if(!canSplit()){
    var t=$('title'),o=t.textContent;t.textContent='⚠ 分割は横向きの広い画面だけです';
    setTimeout(function(){t.textContent=o},2000);return;
  }
  // 押すたびに ノート|カメラ → ノート|写真 → 写真|カメラ → ノート|カメラ…(単独表示からは、今の画面に近い分割から始める)
  var next;
  if(isSplit(mode))next=SPLITS[(SPLITS.indexOf(mode)+1)%SPLITS.length];
  else next=(mode==='photos')?'fp':'fc';
  setMode(next,true);
};
$('tDays').onclick=function(){window.open('genba-photos.html','genbaPhotos')};
window.addEventListener('resize',function(){if(isSplit(mode)&&!canSplit())setMode(fallback(mode),false)});

/* ---------- 子ページ ---------- */
var pf=$('pf'),pc=$('pc'),pp=$('pp');
var fileUrl='pdf-note.html?case='+encodeURIComponent(cur.key)+'&name='+encodeURIComponent(cur.name)+(cur.file?'&file='+encodeURIComponent(cur.file):'');
var camUrl='genba-camera.html?case='+encodeURIComponent(cur.name||cur.key)+'&key='+encodeURIComponent(cur.key)+'&addr='+encodeURIComponent(cur.addr);
var photoUrl='case-photos.html?case='+encodeURIComponent(cur.key)+'&name='+encodeURIComponent(cur.name);
// 子ページ側の「案件に戻る」は枠内では意味がないので隠す(上部の←を使う)
function hideIn(frame,id){
  frame.addEventListener('load',function(){
    try{var b=frame.contentDocument.getElementById(id);if(b)b.style.display='none'}catch(e){}
  });
}
hideIn(pf,'bBack');   // pdf-note.html
hideIn(pc,'backBtn'); // genba-camera.html
hideIn(pp,'bBack');   // case-photos.html
pc.addEventListener('load',function(){if(!has(mode,'cam'))setTimeout(sleepCam,300)});
pf.src=fileUrl;
pc.src=camUrl;

/* 写真: 最初に見る時に読み込む。見る時は新しい写真を追加で取り込み、見ている間は30秒ごとに確認する */
var photosLoaded=false,photosLast=0;
function photosApi(){try{return pp.contentWindow.casePhotos||null}catch(e){return null}}
function refreshPhotos(){var a=photosApi();if(a&&a.refresh){a.refresh();photosLast=Date.now()}}
function showPhotos(){
  if(!photosLoaded){photosLoaded=true;pp.src=photoUrl;photosLast=Date.now();return}
  refreshPhotos();
}
setInterval(function(){if(has(mode,'photos')&&!document.hidden&&Date.now()-photosLast>30000)refreshPhotos()},15000);

/* カメラの映像は、見ていない間は止め、表示した時に再開する(カメラ側の窓口 genbaCam を使う) */
function camApi(){try{return pc.contentWindow.genbaCam||null}catch(e){return null}}
// 分割でカメラが見えている間、別の画面(ノート・写真)を触っていてもカメラが1分で止まらないよう、20秒ごとに「使用中」を知らせる
setInterval(function(){if(isSplit(mode)&&has(mode,'cam')&&!document.hidden){var a=camApi();if(a&&a.touch)a.touch()}},20000);
function sleepCam(){var a=camApi();if(a)a.pause()}
function wakeCam(){
  setTimeout(function(){
    var a=camApi();
    if(a){a.resume();return}
    try{ // 窓口がない古いカメラ画面の場合の従来の方法
      var d=pc.contentDocument;if(!d)return;
      var p=d.getElementById('paused');
      if(p&&p.style.display==='flex')p.click();
    }catch(e){}
  },150);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(has(mode,'cam'))wakeCam();
  if(has(mode,'photos'))refreshPhotos();
});

/* ---------- 戻る ---------- */
// 未保存の枚数: カメラ側が変わった時だけ知らせてくる(定期確認はしない)
var delTimer=null;
window.addEventListener('message',function(e){
  if(e.origin!==location.origin||!e.data)return;
  if(e.data.type==='genbaDeleted'){ // 撮り直しで消した写真を、写真画面からも外す
    clearTimeout(delTimer);delTimer=setTimeout(function(){var a=photosApi();if(photosLoaded&&a&&a.reload)a.reload()},1500);
    return;
  }
  if(e.data.type!=='genbaUnsaved')return;
  var n=e.data.n|0;
  $('tCam').textContent=n?'📷 カメラ ('+n+')':'📷 カメラ';
  $('tCam').style.background=n?'#c62828':'';
});
$('bBack').onclick=function(){window.close();setTimeout(function(){if(history.length>1)history.back();else location.href='today.html'},400)};

setMode(mode,false);
})();
</script>
</body>
</html>
