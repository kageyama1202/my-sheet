<!DOCTYPE html>
<html lang="ja">
<head>
<!-- VERSION: 2026-09-11 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現場寸法記入ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    margin: 0;
    background: #eef0f2;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  #toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 12px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    width: 100%;
    box-sizing: border-box;
    position: sticky;
    top: 0;
    z-index: 10;
    align-items: center;
  }
  #toolbar button {
    padding: 9px 14px;
    border: 1px solid #999;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
  }
  #toolbar button.active { background: #222; color: #fff; border-color: #222; }
  #toolbar button.danger { border-color: #c33; color: #c33; }
  #toolbar label.fileLabel {
    padding: 9px 14px;
    border: 1px dashed #666;
    border-radius: 6px;
    background: #f7f7f7;
    cursor: pointer;
    font-size: 14px;
  }
  #fileInput { display: none; }
  .sep { width: 1px; height: 26px; background: #ddd; margin: 0 4px; }
  #hint { font-size: 12px; color: #666; padding: 8px 12px; text-align: center; }
  #canvasWrap {
    overflow: auto;
    max-width: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 10px;
  }
  canvas { background: #fff; box-shadow: 0 1px 8px rgba(0,0,0,.18); touch-action: none; }
  #modalOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.42);
    display: none; align-items: center; justify-content: center; z-index: 100;
    padding: 16px;
  }
  #modalBox {
    background: #fff; border-radius: 10px; padding: 18px; width: 320px;
    box-shadow: 0 4px 24px rgba(0,0,0,.3);
  }
  #modalBox #modalLabel { font-size: 14px; color: #555; margin-bottom: 8px; }
  #modalBox textarea {
    width: 100%; font-size: 18px; padding: 10px; border: 1px solid #ccc;
    border-radius: 6px; resize: vertical; min-height: 70px; font-family: inherit;
  }
  #modalBox .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  #modalBox .row button {
    padding: 9px 16px; border-radius: 6px; border: 1px solid #999; background: #fff; cursor: pointer;
  }
  #modalBox .row button.ok { background: #222; color: #fff; border-color: #222; }
</style>
</head>
<body>

<div id="toolbar">
  <label class="fileLabel" for="fileInput">図面を開く(画像/PDF)</label>
  <input type="file" id="fileInput" accept="image/*,.pdf">
  <div class="sep"></div>
  <button data-mode="select" class="active">選択/移動</button>
  <button data-mode="rect">赤枠</button>
  <button data-mode="callout">寸法引き出し</button>
  <button data-mode="note">メモ(緑)</button>
  <div class="sep"></div>
  <button id="deleteBtn">選択削除</button>
  <button id="undoBtn">戻す</button>
  <button id="clearBtn" class="danger">全消去</button>
  <div class="sep"></div>
  <button id="saveBtn">PNG保存</button>
</div>
<div id="hint">図面(画像またはPDF)を開いてください</div>
<div id="canvasWrap"><canvas id="canvas" width="800" height="600"></canvas></div>

<div id="modalOverlay">
  <div id="modalBox">
    <div id="modalLabel">入力してください</div>
    <textarea id="modalInput"></textarea>
    <div class="row">
      <button id="modalCancel">キャンセル</button>
      <button id="modalOk" class="ok">OK</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const hint = document.getElementById('hint');

let bgImage = null;
let bgReady = false;
let elements = [];
let history = [];
let mode = 'select';
let selected = null;
let dragging = null;
let drawingRect = null;
let pendingCallout = null;
let pendingNote = null;

/* ---------- toolbar ---------- */
document.querySelectorAll('#toolbar button[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#toolbar button[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    selected = null;
    redraw();
  });
});

document.getElementById('deleteBtn').addEventListener('click', () => {
  if (selected) {
    pushHistory();
    elements = elements.filter(e => e !== selected);
    selected = null;
    redraw();
  }
});
document.getElementById('undoBtn').addEventListener('click', () => {
  if (history.length) {
    elements = history.pop();
    selected = null;
    redraw();
  }
});
document.getElementById('clearBtn').addEventListener('click', () => {
  if (elements.length && confirm('すべての書き込みを消しますか？')) {
    pushHistory();
    elements = [];
    redraw();
  }
});
document.getElementById('saveBtn').addEventListener('click', exportPNG);

function pushHistory() {
  history.push(JSON.parse(JSON.stringify(elements)));
  if (history.length > 30) history.shift();
}

/* ---------- load file ---------- */
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  hint.textContent = '読み込み中...';
  try {
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
      await loadPDF(file);
    } else {
      await loadImage(file);
    }
  } catch (err) {
    hint.textContent = '読み込みに失敗しました: ' + err.message;
  }
});

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (ev) => {
      img.onload = () => { setBackground(img, img.naturalWidth, img.naturalHeight); resolve(); };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadPDF(file) {
  const buf = await file.arrayBuffer();
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const page = await pdf.getPage(1);
  const scale = 2;
  const viewport = page.getViewport({ scale });
  const tmp = document.createElement('canvas');
  tmp.width = viewport.width;
  tmp.height = viewport.height;
  await page.render({ canvasContext: tmp.getContext('2d'), viewport }).promise;
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = tmp.toDataURL(); });
  setBackground(img, viewport.width, viewport.height);
}

function setBackground(img, w, h) {
  bgImage = img;
  const maxW = Math.min(window.innerWidth - 24, 1100);
  const scale = w > maxW ? maxW / w : 1;
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  bgReady = true;
  elements = [];
  history = [];
  selected = null;
  hint.textContent = '赤枠・寸法引き出し・メモを選んで図面上に書き込めます(要素は選択/移動でドラッグできます)';
  redraw();
}

/* ---------- drawing ---------- */
function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (bgReady) ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
  elements.forEach(el => drawElement(el, el === selected));
  if (drawingRect) {
    ctx.strokeStyle = '#cc2222';
    ctx.lineWidth = 4;
    ctx.strokeRect(drawingRect.x, drawingRect.y, drawingRect.w, drawingRect.h);
  }
}

function drawElement(el, isSelected) {
  if (el.type === 'rect') {
    ctx.strokeStyle = '#cc2222';
    ctx.lineWidth = 4;
    ctx.strokeRect(el.x, el.y, el.w, el.h);
  } else if (el.type === 'callout') {
    const boxCenterX = el.boxX + el.boxW / 2;
    const midY = Math.min(el.anchorY, el.boxY + el.boxH) - 20;
    ctx.strokeStyle = '#cc2222';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(el.anchorX, el.anchorY);
    ctx.lineTo(el.anchorX, midY);
    ctx.lineTo(boxCenterX, midY);
    ctx.lineTo(boxCenterX, el.boxY + el.boxH);
    ctx.stroke();
    ctx.fillStyle = '#cc2222';
    ctx.fillRect(el.anchorX - 3, el.anchorY - 3, 6, 6);
    roundRect(ctx, el.boxX, el.boxY, el.boxW, el.boxH, 10);
    ctx.fillStyle = '#fbd0d0';
    ctx.fill();
    ctx.font = 'bold 22px sans-serif';
    ctx.fillStyle = '#a10000';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillText(el.text, boxCenterX, el.boxY + el.boxH / 2);
  } else if (el.type === 'note') {
    roundRect(ctx, el.x, el.y, el.w, el.h, 10);
    ctx.fillStyle = '#c6f0a0';
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    wrapText(ctx, el.text, el.x + 14, el.y + 14, el.w - 28, 26);
  }
  if (isSelected) {
    const b = boundsOf(el);
    ctx.strokeStyle = '#0077ff';
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(b.x - 5, b.y - 5, b.w + 10, b.h + 10);
    ctx.setLineDash([]);
    if (el.type === 'callout') {
      ctx.beginPath();
      ctx.arc(el.anchorX, el.anchorY, 8, 0, Math.PI * 2);
      ctx.strokeStyle = '#0077ff';
      ctx.stroke();
    }
  }
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function wrapText(c, text, x, y, maxWidth, lineHeight) {
  const lines = text.split('\n');
  let yy = y;
  lines.forEach(line => {
    let cur = '';
    for (const ch of line) {
      const test = cur + ch;
      if (c.measureText(test).width > maxWidth && cur) {
        c.fillText(cur, x, yy);
        yy += lineHeight;
        cur = ch;
      } else {
        cur = test;
      }
    }
    c.fillText(cur, x, yy);
    yy += lineHeight;
  });
}

function boundsOf(el) {
  if (el.type === 'rect' || el.type === 'note') return { x: el.x, y: el.y, w: el.w, h: el.h };
  if (el.type === 'callout') return { x: el.boxX, y: el.boxY, w: el.boxW, h: el.boxH };
}

function hitTest(px, py) {
  for (let i = elements.length - 1; i >= 0; i--) {
    const el = elements[i];
    if (el.type === 'callout' && Math.hypot(px - el.anchorX, py - el.anchorY) < 12) return el;
    const b = boundsOf(el);
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return el;
  }
  return null;
}

/* ---------- pointer interaction ---------- */
canvas.addEventListener('pointerdown', (e) => {
  if (!bgReady) return;
  const pt = getPos(e);
  if (mode === 'rect') {
    drawingRect = { x: pt.x, y: pt.y, w: 0, h: 0 };
  } else if (mode === 'callout') {
    pendingCallout = { anchorX: pt.x, anchorY: pt.y };
  } else if (mode === 'note') {
    pendingNote = { x: pt.x, y: pt.y };
  } else if (mode === 'select') {
    const el = hitTest(pt.x, pt.y);
    selected = el;
    if (el) {
      if (el.type === 'callout' && Math.hypot(pt.x - el.anchorX, pt.y - el.anchorY) < 12) {
        dragging = { kind: 'anchor', el, ox: pt.x - el.anchorX, oy: pt.y - el.anchorY };
      } else {
        const b = boundsOf(el);
        dragging = { kind: 'move', el, ox: pt.x - b.x, oy: pt.y - b.y };
      }
    }
    redraw();
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!bgReady) return;
  const pt = getPos(e);
  if (mode === 'rect' && drawingRect) {
    drawingRect.w = pt.x - drawingRect.x;
    drawingRect.h = pt.y - drawingRect.y;
    redraw();
  } else if (dragging) {
    const el = dragging.el;
    if (dragging.kind === 'anchor') {
      el.anchorX = pt.x - dragging.ox;
      el.anchorY = pt.y - dragging.oy;
    } else {
      const b = boundsOf(el);
      const dx = (pt.x - dragging.ox) - b.x;
      const dy = (pt.y - dragging.oy) - b.y;
      moveElement(el, dx, dy);
    }
    redraw();
  }
});

function moveElement(el, dx, dy) {
  if (el.type === 'rect' || el.type === 'note') { el.x += dx; el.y += dy; }
  else if (el.type === 'callout') { el.boxX += dx; el.boxY += dy; }
}

canvas.addEventListener('pointerup', () => {
  if (mode === 'rect' && drawingRect) {
    let { x, y, w, h } = drawingRect;
    if (w < 0) { x += w; w = -w; }
    if (h < 0) { y += h; h = -h; }
    if (w > 5 && h > 5) {
      pushHistory();
      elements.push({ type: 'rect', x, y, w, h });
    }
    drawingRect = null;
    redraw();
  } else if (mode === 'callout' && pendingCallout) {
    openModal('寸法・数値を入力(例: 1735*2075)', '', (val) => {
      if (val) {
        pushHistory();
        ctx.font = 'bold 22px sans-serif';
        const tw = ctx.measureText(val).width;
        const bw = Math.max(120, tw + 40);
        elements.push({
          type: 'callout',
          anchorX: pendingCallout.anchorX,
          anchorY: pendingCallout.anchorY,
          boxX: pendingCallout.anchorX - bw / 2,
          boxY: Math.max(10, pendingCallout.anchorY - 90),
          boxW: bw, boxH: 50,
          text: val
        });
        redraw();
      }
      pendingCallout = null;
    }, () => { pendingCallout = null; });
  } else if (mode === 'note' && pendingNote) {
    openModal('メモを入力', '', (val) => {
      if (val) {
        pushHistory();
        elements.push({
          type: 'note',
          x: pendingNote.x, y: pendingNote.y,
          w: 280, h: Math.max(70, 26 * (val.split('\n').length + 1)),
          text: val
        });
        redraw();
      }
      pendingNote = null;
    }, () => { pendingNote = null; });
  }
  dragging = null;
});

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

/* ---------- modal ---------- */
const modalOverlay = document.getElementById('modalOverlay');
const modalInput = document.getElementById('modalInput');
const modalLabel = document.getElementById('modalLabel');
let modalOkCb = null, modalCancelCb = null;

function openModal(label, defVal, onOk, onCancel) {
  modalLabel.textContent = label;
  modalInput.value = defVal;
  modalOverlay.style.display = 'flex';
  modalOkCb = onOk; modalCancelCb = onCancel;
  setTimeout(() => modalInput.focus(), 50);
}
document.getElementById('modalOk').addEventListener('click', () => {
  modalOverlay.style.display = 'none';
  if (modalOkCb) modalOkCb(modalInput.value.trim());
});
document.getElementById('modalCancel').addEventListener('click', () => {
  modalOverlay.style.display = 'none';
  if (modalCancelCb) modalCancelCb();
});
modalInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && mode === 'callout') {
    e.preventDefault();
    document.getElementById('modalOk').click();
  }
});

/* ---------- export ---------- */
function exportPNG() {
  if (!bgReady) return;
  selected = null;
  redraw();
  const link = document.createElement('a');
  link.download = 'genba_annotated_' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
