<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>案件カレンダー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="user-scope.js"></script>
  <link rel="stylesheet" href="shared-modal.css">
  <style>
    *{box-sizing:border-box;}
    body{font-family:sans-serif;padding:0;margin:0;background:#f0f2f5;font-size:13px;}
    .header-bar{background:#fff;padding:6px 12px;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .header-bar h3{margin:0;font-size:15px;color:#1a73e8;}
    .top-link{text-decoration:none;font-weight:bold;color:#007bff;font-size:14px;}
    .nav-area{display:flex;align-items:center;gap:8px;margin-left:auto;}
    .nav-btn{font-size:14px;padding:4px 12px;cursor:pointer;border:1px solid #ccc;border-radius:4px;background:#fff;font-weight:bold;}
    .nav-btn:hover{background:#f0f0f0;}
    .month-label{font-size:18px;font-weight:bold;color:#333;min-width:140px;text-align:center;}
    .today-btn{font-size:12px;padding:3px 10px;cursor:pointer;border:1px solid #1a73e8;border-radius:4px;background:#1a73e8;color:#fff;font-weight:bold;}
    .filter-bar{background:#fff;padding:4px 12px;border-bottom:1px solid #ccc;display:flex;gap:15px;align-items:center;flex-wrap:wrap;font-size:12px;}
    .filter-bar label{cursor:pointer;display:flex;align-items:center;gap:3px;font-weight:bold;}
    .filter-bar input[type="checkbox"]{cursor:pointer;margin:0;width:14px;height:14px;}
    .legend-dot{width:12px;height:12px;border-radius:3px;display:inline-block;}
    .cal-wrapper{padding:6px;height:calc(100vh - 90px);display:flex;flex-direction:column;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);flex:1;gap:1px;background:#ccc;border:1px solid #ccc;}
    .cal-header{background:#e8eaed;text-align:center;font-weight:bold;padding:3px;font-size:12px;color:#555;}
    .cal-header.sun{color:#d32f2f;}
    .cal-header.sat{color:#1a73e8;}
    .cal-cell{background:#fff;padding:2px;display:flex;flex-direction:column;min-height:75px;overflow:hidden;cursor:pointer;}
    .cal-cell:hover{background:#f8f9ff;}
    .cal-cell.other-month{background:#fafafa;}
    .cal-cell.other-month .day-num{color:#bbb;}
    .cal-cell.today{background:#e8f0fe;}
    .day-num{font-size:11px;font-weight:bold;color:#333;padding:1px 3px;text-align:right;}
    .day-num.sun{color:#d32f2f;}
    .day-num.sat{color:#1a73e8;}
    .cal-event{font-size:9px;padding:1px 3px;margin:0 1px 1px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.3;}
    .cal-event:hover{opacity:0.85;}
    .ev-sekou{background:#c8e6c9;color:#1b5e20;border-left:2px solid #2e7d32;}
    .ev-shitami{background:#bbdefb;color:#0d47a1;border-left:2px solid #1565c0;}
    .ev-yotei{background:#fff3e0;color:#e65100;border-left:2px solid #ef6c00;}
    .ev-personal{background:#f3e5f5;color:#4a148c;border-left:2px solid #7b1fa2;}
    .ev-kari{background:#ffe0b2;color:#e65100;border-left:2px solid #ef6c00;}
    .cal-more{font-size:9px;color:#1a73e8;font-weight:bold;padding:0 3px;cursor:pointer;}
    #modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;backdrop-filter:blur(2px);}
    #modal-content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:18px;border-radius:8px;width:90%;max-width:850px;max-height:88vh;overflow-y:auto;box-shadow:0 10px 25px rgba(0,0,0,0.3);}
    #modal-close{float:right;font-size:14px;padding:5px 10px;cursor:pointer;background:#dc3545;color:#fff;border:none;border-radius:4px;font-weight:bold;}
    .modal-header-info{margin-bottom:12px;}
    .modal-date-row{font-size:13px;color:#555;font-weight:bold;background:#e9ecef;padding:6px 10px;border-radius:6px;display:inline-block;}
    .modal-title-row{font-size:17px;font-weight:bold;color:#333;margin-top:8px;display:flex;align-items:center;gap:10px;}
    .modal-copy-btn{font-size:11px;padding:4px 10px;cursor:pointer;border-radius:4px;border:none;background:#007bff;color:#fff;font-weight:bold;}
    .modal-copy-btn.copied{background:#28a745;}
    .modal-table{width:100%;border-collapse:collapse;margin-top:12px;}
    .modal-table th,.modal-table td{border:1px solid #ddd;padding:7px 9px;font-size:13px;text-align:left;}
    .modal-table th{background:#f8f9fa;width:28%;color:#495057;}
    .modal-input-section{margin-top:18px;}
    .modal-input-section h4{color:#155724;border-bottom:2px solid #28a745;padding-bottom:4px;font-size:14px;}
    .modal-input-row{display:flex;align-items:center;gap:10px;margin:6px 0;}
    .modal-input-row label{font-weight:bold;min-width:95px;font-size:13px;}
    .modal-input-row input,.modal-input-row select{padding:4px 7px;border:1px solid #ccc;border-radius:4px;font-size:13px;}
    .day-list-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:8888;}
    .day-list-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:16px;border-radius:8px;width:85%;max-width:600px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,0.25);}
    .day-list-panel h3{margin:0 0 10px 0;font-size:16px;color:#333;}
    .day-list-item{padding:8px 10px;border-bottom:1px solid #eee;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:4px;}
    .day-list-item:hover{background:#e8f4ff;}
    .day-list-item .ev-tag{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:bold;white-space:nowrap;}
    .day-list-close{float:right;font-size:13px;padding:4px 10px;cursor:pointer;background:#dc3545;color:#fff;border:none;border-radius:4px;font-weight:bold;}
    #noDataMsg{display:none;padding:20px;font-weight:bold;color:#d32f2f;text-align:center;}
  </style>
</head>
<body>
  <div id="modal-overlay">
    <div id="modal-content">
      <button id="modal-close">✖ 閉じる</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div class="day-list-overlay" id="dayListOverlay">
    <div class="day-list-panel">
      <button class="day-list-close" id="dayListClose">✖</button>
      <div id="dayListBody"></div>
    </div>
  </div>
  <div class="header-bar">
    <a href="index.html" class="top-link">◀ トップ</a>
    <a href="today.html" class="top-link">📋 リスト</a>
    <h3>📅 案件カレンダー</h3>
    <span id="pendingBadge" style="display:none;font-size:12px;font-weight:700;color:#e65100;"></span>
    <div class="nav-area">
      <button class="today-btn" id="btnToday">今日</button>
      <button class="nav-btn" id="btnPrev">◀</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="nav-btn" id="btnNext">▶</button>

  </div>
  <div class="filter-bar">
    <label><input type="checkbox" id="chkSekou" checked><span class="legend-dot" style="background:#2e7d32;"></span> 施工</label>
    <label><input type="checkbox" id="chkShitami" checked><span class="legend-dot" style="background:#1565c0;"></span> 下見</label>
    <label><input type="checkbox" id="chkYotei" checked><span class="legend-dot" style="background:#ef6c00;"></span> 下見予定</label>
    <label><input type="checkbox" id="chkPersonal" checked><span class="legend-dot" style="background:#7b1fa2;"></span> マイカレンダー</label>
  </div>

  <div class="cal-wrapper" id="calWrapper">
    <div class="cal-grid" id="calGrid"></div>
  </div>
  <script src="shared-modal.js"></script>
  <script>
    var firebaseConfig={apiKey:"AIzaSyDznSykpSebsejNdQtpOgfORuzZSoW3_fs",authDomain:"project-6745138395263517914.firebaseapp.com",databaseURL:"https://project-6745138395263517914-default-rtdb.firebaseio.com",projectId:"project-6745138395263517914",storageBucket:"project-6745138395263517914.firebasestorage.app",messagingSenderId:"1054295910908",appId:"1:1054295910908:web:4072df05bd90bbdc896a79"};
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    var database=scopedDatabase(firebase.database());

    // 匿名認証
    // 認証はlogin.html/viewer.htmlで完了済み（トークン方式）。ここでの匿名ログインは行わない。

    function getSafeVal(c,i){if(!c)return"";if(Array.isArray(c))return c.length>i&&c[i]!=null?String(c[i]):"";if(typeof c==='object')return c[i]!=null?String(c[i]):"";return"";}
    function formatToYMD(ds){if(!ds)return"";var d=String(ds).replace(/\s+/g,"").replace(/\//g,"-").replace(/\./g,"-");var p=d.split("-");if(p.length===3)return p[0]+"-"+String(p[1]).padStart(2,'0')+"-"+String(p[2]).padStart(2,'0');return d;}
    function getTodayStr(){var t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,'0')+"-"+String(t.getDate()).padStart(2,'0');}
    function getKubun(cols){var k=getSafeVal(cols,3).replace(/\s+/g,"");if(k==="ﾘ"||k==="リ")return"リ";if(k==="新")return"新";return k.substring(0,1)||"";}
    function getShortType(cols){var title=getSafeVal(cols,4).trim();var m=title.match(/【(.+?)(?:手配)?】/);if(m)return m[1];var m2=title.match(/\b(SK|SB|SU)\b/);if(m2)return m2[1];return title.substring(0,4);}
    function getTeiName(cols){var title=getSafeVal(cols,4).trim();var after=title.replace(/【.+?】/g,"").trim();if(after)return after;return getSafeVal(cols,5).trim();}
    function getPersonalTime(ev){if(!ev)return"";if(ev.allDay)return"終日";var s="",e="";if(ev.start&&ev.start.length>=16)s=ev.start.substring(11,16);if(ev.end&&ev.end.length>=16)e=ev.end.substring(11,16);if(s&&e)return s+"〜"+e;return s||"";}
    // メール／SMS文面用：8/20(木) のような短い日付表記
    function fmtDateShort(ds){var p=ds.split('-');var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));var wd=['日','月','火','水','木','金','土'][d.getDay()];return (d.getMonth()+1)+'/'+d.getDate()+'('+wd+')';}
    // 仮予約の状態(status)に応じたバッジ絵文字とラベルを返す
    function kariStatusBadge(status){if(status==='許可'||status==='確定')return{badge:'🟢',label:'対応可能'};if(status==='断り')return{badge:'❌',label:'対応不可'};return{badge:'🟠',label:'仮予約'};}
    // mailto:/sms:が環境によって反応しない場合の保険として、本文をクリップボードにコピーする
    function copyTextFallback(text,btnEl){
      function done(ok){if(!btnEl){if(!ok)alert('コピーできませんでした。手動でコピーしてください：\n\n'+text);return;}var o=btnEl.textContent;btnEl.textContent=ok?'✓ コピーしました':'コピー失敗';setTimeout(function(){btnEl.textContent=o;},1500);if(!ok)alert('コピーできませんでした。手動でコピーしてください：\n\n'+text);}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){done(true);}).catch(function(){done(false);});}else{done(false);}
    }
    // 営業時間（8:00〜19:00）外にメール/SMSを開こうとした場合、一呼吸置く確認を挟む
    var BUSINESS_HOUR_START=8,BUSINESS_HOUR_END=19;
    function guardSendTime(sendFn){
      var h=new Date().getHours();
      if(h>=BUSINESS_HOUR_START&&h<BUSINESS_HOUR_END){sendFn();return;}
      if(confirm('現在営業時間外です（'+BUSINESS_HOUR_START+':00〜'+BUSINESS_HOUR_END+':00推奨）。\n今開くと夜間に相手に届く可能性があります。\n\nこのまま開きますか？（キャンセルすれば送信されません。翌朝あらためてこのボタンを押してください）')){sendFn();}
    }

    var chkSekou=document.getElementById('chkSekou');
    var chkShitami=document.getElementById('chkShitami');
    var chkYotei=document.getElementById('chkYotei');
    var chkPersonal=document.getElementById('chkPersonal');
    var modalOverlay=document.getElementById('modal-overlay');
    var dayListOverlay=document.getElementById('dayListOverlay');

    var globalHeaders=[],globalTasks={},fullData=null;
    try{var _s=localStorage.getItem('appData');if(_s)fullData=JSON.parse(_s);}catch(e){console.error(e);}
    if(fullData&&fullData.app_meta&&fullData.app_tasks){globalHeaders=fullData.app_meta.headers;globalTasks=fullData.app_tasks;}
    else{document.getElementById('noDataMsg').style.display='block';document.getElementById('calWrapper').style.display='none';}

    var todayStr=getTodayStr();
    var personalCalCache={};
    try{var _pc=localStorage.getItem('personalCalendar');if(_pc)personalCalCache=JSON.parse(_pc);}catch(e){}
    database.ref('personal_calendar').once('value').then(function(snap){
      if(snap.val()){personalCalCache=snap.val();try{localStorage.setItem('personalCalendar',JSON.stringify(personalCalCache));}catch(e){}}
      renderCal();
    });

    // 仮予約(kari-yoyaku.html)で登録された仮予約を混ぜて表示する。
    var kariSlotsCache={};
    database.ref('kari_yoyaku_slots').once('value').then(function(snap){
      if(snap.val()){kariSlotsCache=snap.val();}
      renderCal();
      renderPendingBadge();
    }).catch(function(e){console.warn('kari_yoyaku_slots取得失敗',e);});
    // ★2026-08-02追加★ today.htmlと同じ不具合（確定/確定解除の書き込みは成功しているのに
    // ローカルキャッシュkariSlotsCacheを再取得しておらず画面に反映されない）を修正するための再読込関数。
    function reloadKariAndRenderCal(){database.ref('kari_yoyaku_slots').once('value').then(function(snap){kariSlotsCache=snap.val()||{};renderCal();renderPendingBadge();}).catch(function(e){console.warn('kari_yoyaku_slots再取得失敗',e);});}
    // 「まだ許可/断りを決めていない」「決めたけどまだ送信していない」件数を表示する
    function renderPendingBadge(){
      var el=document.getElementById('pendingBadge');
      if(!el)return;
      var decisionCount=0,sendCount=0;
      Object.keys(kariSlotsCache).forEach(function(d){Object.keys(kariSlotsCache[d]||{}).forEach(function(id){var e=kariSlotsCache[d][id];var st=e.status||'仮';if(st==='仮')decisionCount++;else if((st==='許可'||st==='断り')&&!e.replied)sendCount++;});});
      if(decisionCount===0&&sendCount===0){el.style.display='none';return;}
      var parts=[];
      if(decisionCount>0)parts.push('📩 未回答 '+decisionCount+'件');
      if(sendCount>0)parts.push('📤 未送信 '+sendCount+'件');
      el.textContent=parts.join('　');
      el.style.display='inline';
    }
    // 実際にメール/SMSを開いた・本文をコピーした時に「送信済み」マークを付ける
    function markReplied(date,id){database.ref('kari_yoyaku_slots/'+date+'/'+id).update({replied:true}).catch(function(e){console.warn('replied更新失敗',e);});}
    function markRepliedMulti(targets){
      if(!targets||!targets.length)return;
      var updates={};
      targets.forEach(function(t){updates[t.date+'/'+t.id+'/replied']=true;});
      database.ref('kari_yoyaku_slots').update(updates).catch(function(e){console.warn('replied一括更新失敗',e);});
    }

    function buildDateMap(){
      var dm={};
      var showS=chkSekou.checked,showD=chkShitami.checked,showY=chkYotei.checked,showP=chkPersonal.checked;
      Object.keys(globalTasks).forEach(function(key){
        var obj=globalTasks[key];var cols=obj.csvData;if(!cols)return;
        var status=getSafeVal(cols,1).replace(/\s+/g,"");
        var sekouDate=formatToYMD(getSafeVal(cols,2));
        if(status==="完了"&&sekouDate<todayStr)return;
        if(sekouDate&&sekouDate<todayStr)return;
        var kubun=getKubun(cols);var shortType=getShortType(cols);var tei=getTeiName(cols);
        var csvShitamiDate=formatToYMD(getSafeVal(cols,12));var csvShitamiTime=getSafeVal(cols,13).trim();
        var fbDate=obj.date||"";var fbTime=obj.time||"";
        if(showS&&sekouDate){if(!dm[sekouDate])dm[sekouDate]=[];dm[sekouDate].push({key:key,obj:obj,cols:cols,type:'sekou',label:"施"+kubun+" "+shortType+" "+tei,timeStr:''});}
        var orderStr=obj.order?obj.order+". ":"";
        if(showD&&csvShitamiDate){if(!dm[csvShitamiDate])dm[csvShitamiDate]=[];var lbl="下"+kubun+" "+orderStr+(csvShitamiTime?csvShitamiTime+" ":"")+shortType+" "+tei;dm[csvShitamiDate].push({key:key,obj:obj,cols:cols,type:'shitami',label:lbl,timeStr:csvShitamiTime});}
        if(showY&&fbDate){var isSameAsCSV=(fbDate===csvShitamiDate)&&(fbTime===csvShitamiTime||(fbTime===''&&csvShitamiTime===''));if(!isSameAsCSV){if(!dm[fbDate])dm[fbDate]=[];var lbl="予"+kubun+" "+orderStr+(fbTime?fbTime+" ":"")+shortType+" "+tei;dm[fbDate].push({key:key,obj:obj,cols:cols,type:'yotei',label:lbl,timeStr:fbTime});}}
      });
      if(showP){Object.keys(personalCalCache).forEach(function(dateKey){var evs=personalCalCache[dateKey];if(!evs)return;Object.keys(evs).forEach(function(evId){var ev=evs[evId];if(!ev||!ev.title)return;var pTime=getPersonalTime(ev);var lbl="📅 "+(pTime&&pTime!=='終日'?pTime+" ":pTime==='終日'?'終日 ':'')+ev.title;if(!dm[dateKey])dm[dateKey]=[];dm[dateKey].push({key:'personal_'+evId,obj:ev,cols:[],type:'personal',label:lbl,timeStr:pTime});});});}
      Object.keys(kariSlotsCache).forEach(function(dateKey){var evs=kariSlotsCache[dateKey];if(!evs)return;Object.keys(evs).forEach(function(id){var ev=evs[id];if(!ev)return;var sb=kariStatusBadge(ev.status);var areaStr=ev.area?'【'+ev.area+'】':'';var groupStr=ev.candidate_group?'（候補'+countCandidateGroupCal(ev.candidate_group)+'件中）':'';var needsSend=(ev.status==='許可'||ev.status==='断り')&&!ev.replied;var lbl=sb.badge+(needsSend?'📤':'')+" "+(ev.start||'')+" "+(ev.case_name||'')+areaStr+groupStr;var evWithId=Object.assign({},ev,{_dateKey:dateKey,_id:id});if(!dm[dateKey])dm[dateKey]=[];dm[dateKey].push({key:'kari_'+dateKey+'_'+id,obj:evWithId,cols:[],type:'kari',label:lbl,timeStr:ev.start||''});});});
      Object.keys(dm).forEach(function(dk){dm[dk].sort(function(a,b){var ta=a.timeStr==='終日'?'00:00':a.timeStr||'99:99';var tb=b.timeStr==='終日'?'00:00':b.timeStr||'99:99';return ta<tb?-1:ta>tb?1:0;});});
      return dm;
    }

    var currentYear,currentMonth;
    var now=new Date();currentYear=now.getFullYear();currentMonth=now.getMonth();
    document.getElementById('btnPrev').addEventListener('click',function(){currentMonth--;if(currentMonth<0){currentMonth=11;currentYear--;}renderCal();});
    document.getElementById('btnNext').addEventListener('click',function(){currentMonth++;if(currentMonth>11){currentMonth=0;currentYear++;}renderCal();});
    document.getElementById('btnToday').addEventListener('click',function(){currentYear=now.getFullYear();currentMonth=now.getMonth();renderCal();});
    chkSekou.addEventListener('change',renderCal);chkShitami.addEventListener('change',renderCal);chkYotei.addEventListener('change',renderCal);chkPersonal.addEventListener('change',renderCal);
    document.getElementById('modal-close').addEventListener('click',function(){modalOverlay.style.display='none';});
    modalOverlay.addEventListener('click',function(e){if(e.target===modalOverlay)modalOverlay.style.display='none';});
    document.getElementById('dayListClose').addEventListener('click',function(){dayListOverlay.style.display='none';});
    dayListOverlay.addEventListener('click',function(e){if(e.target===dayListOverlay)dayListOverlay.style.display='none';});
    renderCal();

    function renderCal(){
      var dateMap=buildDateMap();var grid=document.getElementById('calGrid');grid.innerHTML='';
      document.getElementById('monthLabel').textContent=currentYear+'年 '+(currentMonth+1)+'月';
      ['日','月','火','水','木','金','土'].forEach(function(d,i){var div=document.createElement('div');div.className='cal-header'+(i===0?' sun':'')+(i===6?' sat':'');div.textContent=d;grid.appendChild(div);});
      var firstDay=new Date(currentYear,currentMonth,1);var lastDay=new Date(currentYear,currentMonth+1,0);var startDow=firstDay.getDay();var totalDays=lastDay.getDate();var prevDays=new Date(currentYear,currentMonth,0).getDate();
      for(var i=startDow-1;i>=0;i--){var day=prevDays-i;var m=currentMonth-1;var y=currentYear;if(m<0){m=11;y--;}grid.appendChild(createCell(day,y+"-"+String(m+1).padStart(2,'0')+"-"+String(day).padStart(2,'0'),true,startDow-1-i,dateMap));}
      for(var d=1;d<=totalDays;d++){var ds=currentYear+"-"+String(currentMonth+1).padStart(2,'0')+"-"+String(d).padStart(2,'0');grid.appendChild(createCell(d,ds,false,(startDow+d-1)%7,dateMap));}
      var totalCells=startDow+totalDays;var remaining=Math.ceil(totalCells/7)*7-totalCells;
      for(var i=1;i<=remaining;i++){var m=currentMonth+1;var y=currentYear;if(m>11){m=0;y++;}grid.appendChild(createCell(i,y+"-"+String(m+1).padStart(2,'0')+"-"+String(i).padStart(2,'0'),true,(totalCells+i-1)%7,dateMap));}
    }

    function createCell(dayNum,dateStr,isOther,dow,dateMap){
      var cell=document.createElement('div');cell.className='cal-cell'+(isOther?' other-month':'')+(dateStr===todayStr?' today':'');
      var numDiv=document.createElement('div');numDiv.className='day-num'+(dow===0?' sun':'')+(dow===6?' sat':'');numDiv.textContent=dayNum;cell.appendChild(numDiv);
      var events=dateMap[dateStr]||[];
      events.slice(0,3).forEach(function(ev){var evDiv=document.createElement('div');evDiv.className='cal-event ev-'+ev.type;evDiv.textContent=ev.label;if(ev.type==='kari'&&ev.obj.status==='断り'){evDiv.style.opacity='0.5';evDiv.style.textDecoration='line-through';}evDiv.addEventListener('click',function(e){e.stopPropagation();if(ev.type==='personal')openPersonalModal(ev.obj);else if(ev.type==='kari')openKariModal(ev.obj);else openCaseModal(ev.key,ev.obj,globalHeaders,globalTasks,fullData,database,renderCal);});cell.appendChild(evDiv);});
      if(events.length>3){var more=document.createElement('div');more.className='cal-more';more.textContent='他 '+(events.length-3)+' 件';cell.appendChild(more);}
      cell.addEventListener('click',function(){if(events.length)openDayList(dateStr,events);});
      return cell;
    }

    function openDayList(dateStr,events){
      var html='<h3>📅 '+dateStr+'（'+events.length+'件）</h3>';
      events.forEach(function(ev){var tagClass=ev.type==='sekou'?'ev-sekou':ev.type==='shitami'?'ev-shitami':ev.type==='personal'?'ev-personal':ev.type==='kari'?'ev-kari':'ev-yotei';var kariSb=ev.type==='kari'?kariStatusBadge(ev.obj.status):null;var tagText=ev.type==='sekou'?'施工':ev.type==='shitami'?'下見':ev.type==='personal'?'個人':ev.type==='kari'?kariSb.label:'予定';var name='';if(ev.type==='personal'){name=ev.obj.title||'';}else if(ev.type==='kari'){name=(ev.obj.case_name||'')+(ev.obj.tantou?'（'+ev.obj.tantou+'）':'');}else{var kubun=getKubun(ev.cols);var st=getShortType(ev.cols);var tei=getTeiName(ev.cols);var orderPfx=ev.obj.order?ev.obj.order+'. ':'';name=orderPfx+'['+kubun+'] '+st+' '+tei;}var td=ev.timeStr&&ev.timeStr!=='終日'?ev.timeStr:ev.timeStr==='終日'?'終日':'';var declinedStyle=(ev.type==='kari'&&ev.obj.status==='断り')?' style="opacity:0.55;text-decoration:line-through;"':'';html+='<div class="day-list-item" data-key="'+ev.key+'" data-type="'+ev.type+'"'+declinedStyle+'><span class="ev-tag '+tagClass+'">'+tagText+'</span><span style="color:#1a73e8;font-size:11px;font-weight:bold;min-width:60px;">'+td+'</span><span style="font-weight:bold;font-size:13px;">'+name+'</span></div>';});
      document.getElementById('dayListBody').innerHTML=html;dayListOverlay.style.display='block';
      document.querySelectorAll('.day-list-item').forEach(function(item){item.addEventListener('click',function(){dayListOverlay.style.display='none';if(item.dataset.type==='personal'){var evObj=null;for(var i=0;i<events.length;i++){if(events[i].key===item.dataset.key){evObj=events[i].obj;break;}}if(evObj)openPersonalModal(evObj);return;}if(item.dataset.type==='kari'){var evObj=null;for(var i=0;i<events.length;i++){if(events[i].key===item.dataset.key){evObj=events[i].obj;break;}}if(evObj)openKariModal(evObj);return;}var obj=globalTasks[item.dataset.key];if(!obj)return;openCaseModal(item.dataset.key,obj,globalHeaders,globalTasks,fullData,database,renderCal);});});
    }

    function openPersonalModal(ev){
      var timeStr=getPersonalTime(ev);
      var html='<div class="modal-header-info"><div class="modal-title-row" style="color:#4a148c">📅 '+(ev.title||'')+'</div></div><table class="modal-table"><tr><th>日時</th><td>'+timeStr+'</td></tr>';
      if(ev.location)html+='<tr><th>場所</th><td><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(ev.location)+'" target="_blank" style="color:#0056b3">🗺️ '+ev.location+'</a></td></tr>';
      html+='</table>';document.getElementById('modal-body').innerHTML=html;modalOverlay.style.display='block';
    }
    // ステータスに応じて件名・本文を出し分ける（社内向けなので簡潔に）
    function calKariMailParts(ev){
      var status=ev.status||'仮';var dShort=fmtDateShort(ev._dateKey);
      if(status==='断り')return{subject:'【現調日程】'+(ev.case_name||'')+' 対応不可',body:(ev.tantou||'')+' 様\n\n'+(ev.case_name||'')+'\n✕対応不可：'+dShort+' '+(ev.start||'')+'\n他日程をご検討ください。\n\nよろしくお願いします。'};
      if(status==='許可'||status==='確定')return{subject:'【現調日程】'+(ev.case_name||'')+' 対応可',body:(ev.tantou||'')+' 様\n\n'+(ev.case_name||'')+'\n○対応可：'+dShort+' '+(ev.start||'')+'\n\nよろしくお願いします。'};
      return{subject:'【現調日程】'+(ev.case_name||''),body:(ev.tantou||'')+' 様\n\n'+(ev.case_name||'')+'\n'+dShort+' '+(ev.start||'')+'\n仮予約を受け付けました。\n\nよろしくお願いします。'};
    }
    function calKariBuildMailto(ev){var p=calKariMailParts(ev);return 'mailto:'+encodeURIComponent(ev.email)+'?subject='+encodeURIComponent(p.subject)+'&body='+encodeURIComponent(p.body);}
    function calKariBuildSms(ev){
      var status=ev.status||'仮';var dShort=fmtDateShort(ev._dateKey);var text;
      if(status==='断り')text=(ev.tantou||'')+'様　'+(ev.case_name||'')+'　✕対応不可：'+dShort+' '+(ev.start||'')+'　他日程をご検討ください。';
      else if(status==='許可'||status==='確定')text=(ev.tantou||'')+'様　'+(ev.case_name||'')+'　○対応可：'+dShort+' '+(ev.start||'');
      else text=(ev.tantou||'')+'様　'+(ev.case_name||'')+'　'+dShort+' '+(ev.start||'')+'　仮予約を受け付けました。';
      return 'sms:'+encodeURIComponent(ev.tel)+'?body='+encodeURIComponent(text);
    }
    function countCandidateGroupCal(groupId){var c=0;Object.keys(kariSlotsCache).forEach(function(dateKey){var day=kariSlotsCache[dateKey];Object.keys(day).forEach(function(id){if(day[id].candidate_group===groupId)c++;});});return c;}
    // 候補日が複数ある案件は、1件ずつ対応可否するたびにメールを送ると何通も届いてしまうため、
    // 対応可否が決まっている分をまとめて1通で送る。
    function buildGroupReplyPartsCal(groupId){
      var members=[];
      Object.keys(kariSlotsCache).forEach(function(d){Object.keys(kariSlotsCache[d]||{}).forEach(function(mid){var m=kariSlotsCache[d][mid];if(m.candidate_group===groupId)members.push({date:d,id:mid,e:m});});});
      if(!members.length)return null;
      members.sort(function(a,b){return (a.date+(a.e.start||'')).localeCompare(b.date+(b.e.start||''));});
      var ok=members.filter(function(m){return m.e.status==='許可'||m.e.status==='確定';});
      var ng=members.filter(function(m){return m.e.status==='断り';});
      if(ok.length===0&&ng.length===0)return null;
      var caseName=members[0].e.case_name||'';var tantou=members[0].e.tantou||'';var email='',tel='';
      members.forEach(function(m){if(!email&&m.e.email)email=m.e.email;if(!tel&&m.e.tel)tel=m.e.tel;});
      function fmtList(list){return list.map(function(m){return fmtDateShort(m.date)+' '+(m.e.start||'');}).join('、');}
      var lines=[tantou+' 様','',caseName+'の日程について',''];
      if(ok.length)lines.push('○対応可：'+fmtList(ok));
      if(ng.length)lines.push('✕対応不可：'+fmtList(ng));
      lines.push('','よろしくお願いします。');
      var smsText=tantou+'様　'+caseName+(ok.length?'　対応可：'+fmtList(ok):'')+(ng.length?'／対応不可：'+fmtList(ng):'');
      return{subject:'【現調日程】'+caseName+' 回答',body:lines.join('\n'),smsText:smsText,email:email,tel:tel,replyTargets:ok.concat(ng)};
    }
    function sendGroupReplyCal(groupId){
      if(!groupId)return;
      var parts=buildGroupReplyPartsCal(groupId);
      if(!parts){alert('まだ対応可否が決まっていません');return;}
      if(parts.email)guardSendTime(function(){location.href='mailto:'+encodeURIComponent(parts.email)+'?subject='+encodeURIComponent(parts.subject)+'&body='+encodeURIComponent(parts.body);markRepliedMulti(parts.replyTargets);});
      else if(parts.tel)guardSendTime(function(){location.href='sms:'+encodeURIComponent(parts.tel)+'?body='+encodeURIComponent(parts.smsText);markRepliedMulti(parts.replyTargets);});
      else alert('連絡先（メール・電話）が登録されていません');
    }
    function openKariModal(ev){
      var sb=kariStatusBadge(ev.status);
      var needsSend=(ev.status==='許可'||ev.status==='断り')&&!ev.replied;
      var timeOpts=generateTimeOptions();
      var editStyle='width:100%;box-sizing:border-box;padding:6px;border:1px solid #ccc;border-radius:4px;font-size:13px;';
      var html='<div class="modal-header-info"><div class="modal-title-row" style="color:#e65100">'+sb.badge+' '+sb.label+(needsSend?' <span style="font-size:11px;background:#fff3e0;color:#e65100;padding:2px 6px;border-radius:4px;">📤未送信</span>':'')+'：'+(ev.case_name||'')+'</div></div><table class="modal-table">'
        +'<tr><th>日付</th><td>'+ev._dateKey+' <a href="kari-yoyaku.html?date='+ev._dateKey+'&open='+encodeURIComponent(ev._id)+'" target="_blank" style="font-size:11px;color:#1a73e8;font-weight:600;white-space:nowrap;">📅日付変更はこちら</a></td></tr>'
        +'<tr><th>時間</th><td><select id="calKariEditTime" style="'+editStyle+'">'+timeOpts+'</select></td></tr>'
        +'<tr><th>担当者</th><td><input type="text" id="calKariEditTantou" style="'+editStyle+'" value="'+escHtmlModal(ev.tantou||'')+'"></td></tr>'
        +'<tr><th>住所（簡易）</th><td><input type="text" id="calKariEditArea" style="'+editStyle+'" value="'+escHtmlModal(ev.area||'')+'"></td></tr>'
        +'<tr><th>メール</th><td><input type="email" id="calKariEditEmail" style="'+editStyle+'" value="'+escHtmlModal(ev.email||'')+'"></td></tr>'
        +'<tr><th>電話番号</th><td><input type="tel" id="calKariEditTel" style="'+editStyle+'" value="'+escHtmlModal(ev.tel||'')+'"></td></tr>'
        +'<tr><th>メモ</th><td><textarea id="calKariEditMemo" style="'+editStyle+'min-height:50px;">'+escHtmlModal(ev.memo||'')+'</textarea></td></tr>';
      if(ev.attachment_url) html+='<tr><th>添付</th><td><a href="'+ev.attachment_url+'" target="_blank" style="color:#0056b3;">📎 '+(ev.attachment_name||'ファイルを開く')+'</a></td></tr>';
      if(ev.candidate_group) html+='<tr><th>候補日</th><td>同じ案件で他に '+(countCandidateGroupCal(ev.candidate_group)-1)+' 件の候補日があります</td></tr>';
      html+='</table><div id="calKariSaveMsg" style="display:none;color:#2e9e5b;font-size:12px;font-weight:600;margin-top:4px;">✓ 保存しました</div>';
      html+='<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">';
      if(ev.status!=='許可'&&ev.status!=='確定') html+='<button id="calKariPermitBtn" style="flex:1 1 100px;padding:11px;border-radius:8px;border:none;font-size:13px;font-weight:600;background:#2e9e5b;color:#fff;cursor:pointer;">対応可能にする</button>';
      if(ev.status!=='断り') html+='<button id="calKariDeclineBtn" style="flex:1 1 100px;padding:11px;border-radius:8px;border:none;font-size:13px;font-weight:600;background:#dc3545;color:#fff;cursor:pointer;">対応不可にする</button>';
      if(ev.status==='許可'||ev.status==='断り'||ev.status==='確定') html+='<button id="calKariResetBtn" style="flex:1 1 100px;padding:11px;border-radius:8px;border:none;font-size:13px;font-weight:600;background:#888;color:#fff;cursor:pointer;">仮に戻す</button>';
      html+='</div>';
      if(ev.candidate_group) html+='<div style="display:flex;gap:6px;margin-top:8px;"><button id="calKariGroupReplyBtn" style="flex:2;padding:9px;border-radius:6px;border:none;background:#1a73e8;color:#fff;cursor:pointer;font-size:12px;">📧 対応可否が決まった分をまとめて連絡</button><button id="calKariGroupCopyBtn" style="flex:1;padding:9px;border-radius:6px;border:1px solid #ccc;background:#fff;color:#333;cursor:pointer;font-size:12px;">📋 コピー</button></div>';
      if(needsSend) html+='<div style="font-size:11px;color:#e65100;font-weight:700;margin-top:8px;">📤 まだ送信していません</div>';
      html+='<div style="display:flex;gap:8px;margin-top:8px;">';
      if(ev.email) html+='<button id="calKariMailBtn" style="flex:1;padding:11px;border-radius:8px;border:none;font-size:14px;font-weight:600;background:#1a73e8;color:#fff;cursor:pointer;">📧 メールで連絡</button>';
      if(ev.tel) html+='<button id="calKariSmsBtn" style="flex:1;padding:11px;border-radius:8px;border:none;font-size:14px;font-weight:600;background:#2e7d5b;color:#fff;cursor:pointer;">💬 SMSで連絡</button>';
      if(ev.email||ev.tel) html+='<button id="calKariCopyBtn" style="flex:1;padding:11px;border-radius:8px;border:1px solid #ccc;font-size:13px;font-weight:600;background:#fff;color:#333;cursor:pointer;">📋 本文をコピー</button>';
      html+='</div><div style="font-size:11px;color:#888;margin-top:8px;">削除は仮予約ページで行ってください</div>';
      document.getElementById('modal-body').innerHTML=html;modalOverlay.style.display='block';

      document.getElementById('calKariEditTime').value=ev.start||'';
      function calKariSaveField(upd){
        database.ref('kari_yoyaku_slots/'+ev._dateKey+'/'+ev._id).update(upd).then(function(){
          for(var k in upd) ev[k]=upd[k];
          var msg=document.getElementById('calKariSaveMsg');
          if(msg){msg.style.display='inline-block';clearTimeout(msg._t);msg._t=setTimeout(function(){msg.style.display='none';},1500);}
          reloadKariAndRenderCal();
        }).catch(function(e){alert('更新できませんでした：'+e.message);});
      }
      document.getElementById('calKariEditTime').addEventListener('change',function(){calKariSaveField({start:this.value});});
      document.getElementById('calKariEditTantou').addEventListener('blur',function(){if(this.value!==(ev.tantou||''))calKariSaveField({tantou:this.value});});
      document.getElementById('calKariEditArea').addEventListener('blur',function(){if(this.value!==(ev.area||''))calKariSaveField({area:this.value});});
      document.getElementById('calKariEditEmail').addEventListener('blur',function(){if(this.value!==(ev.email||''))calKariSaveField({email:this.value});});
      document.getElementById('calKariEditTel').addEventListener('blur',function(){if(this.value!==(ev.tel||''))calKariSaveField({tel:this.value});});
      document.getElementById('calKariEditMemo').addEventListener('blur',function(){if(this.value!==(ev.memo||''))calKariSaveField({memo:this.value});});

      // 対応可否の判断とお客様への送信は分離する（判断は夜でもOK、送信は営業時間内に連絡ボタンで手動）。
      // 対応可否を変える＝まだこの内容で送信していない、なのでreplied:falseにリセットする。
      if(ev.status!=='許可'&&ev.status!=='確定'){
        document.getElementById('calKariPermitBtn').onclick=function(){
          database.ref('kari_yoyaku_slots/'+ev._dateKey+'/'+ev._id).update({status:'許可',replied:false}).then(function(){
            modalOverlay.style.display='none';
            reloadKariAndRenderCal();
          }).catch(function(e){alert('更新できませんでした：'+e.message);});
        };
      }
      if(ev.status!=='断り'){
        document.getElementById('calKariDeclineBtn').onclick=function(){
          if(!confirm('対応不可にしますか？'))return;
          database.ref('kari_yoyaku_slots/'+ev._dateKey+'/'+ev._id).update({status:'断り',replied:false}).then(function(){
            modalOverlay.style.display='none';
            reloadKariAndRenderCal();
          }).catch(function(e){alert('更新できませんでした：'+e.message);});
        };
      }
      if(ev.status==='許可'||ev.status==='断り'||ev.status==='確定'){
        document.getElementById('calKariResetBtn').onclick=function(){
          database.ref('kari_yoyaku_slots/'+ev._dateKey+'/'+ev._id).update({status:'仮',replied:false}).then(function(){
            modalOverlay.style.display='none';
            reloadKariAndRenderCal();
          }).catch(function(e){alert('更新できませんでした：'+e.message);});
        };
      }
      if(ev.candidate_group){
        document.getElementById('calKariGroupReplyBtn').onclick=function(){sendGroupReplyCal(ev.candidate_group);};
        document.getElementById('calKariGroupCopyBtn').onclick=function(){
          var parts=buildGroupReplyPartsCal(ev.candidate_group);
          if(!parts){alert('まだ対応可否が決まっていません');return;}
          copyTextFallback(parts.subject+'\n\n'+parts.body,this);
          markRepliedMulti(parts.replyTargets);
        };
      }
      if(ev.email) document.getElementById('calKariMailBtn').onclick=function(){guardSendTime(function(){location.href=calKariBuildMailto(ev);markReplied(ev._dateKey,ev._id);});};
      if(ev.tel) document.getElementById('calKariSmsBtn').onclick=function(){guardSendTime(function(){location.href=calKariBuildSms(ev);markReplied(ev._dateKey,ev._id);});};
      if(ev.email||ev.tel) document.getElementById('calKariCopyBtn').onclick=function(){
        var p=calKariMailParts(ev);
        copyTextFallback(p.subject+'\n\n'+p.body,this);
        markReplied(ev._dateKey,ev._id);
      };
    }
  </script>
</body>
</html>
