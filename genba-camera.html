<style>

<div id="app">
  <div id="stage">

  <div id="bar">
    <div id="tray"></div>

    <div class="row"><label>文言</label><input type="text" id="note" placeholder="テンプレを選ぶ/打って保存" autocomplete="off"><button id="tplSave">保存</button></div>

      <span id="gpsst" style="font-size:11px;color:#aaa"></span><span id="cloud" style="font-size:11px;color:#aaa;margin-left:6px"></span><span id="ver" style="font-size:10px;color:#666;margin-left:auto"></span>

<div id="hist"><h2>📦 撮影履歴(端末内に7日間保管)</h2><div id="histNote">赤=未保存 / 緑=送信済み。タップで「保存」待ちの一覧に戻せます。</div><div id="histGrid"></div><button id="histCloud" style="margin-top:8px;padding:14px;font-size:15px;background:#0a84ff">☁ クラウドの写真一覧(今日)を開く</button><button id="histClose">閉じる</button></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const VER='v1111-d';
const video=$('video'), view=$('view'), vctx=view.getContext('2d');
const TPL_DEFAULT=['外観','キーボックス','玄関から','遠景','正面から','横から','打ち合わせ内容','施工日お知らせ','天井の様子','排気ダクト','キッチン側','居間から','右側','左側','上から','下部','吊元の下部'];
const LS='genbaCamera.v2', LS_OLD='genbaCamera.v1', TPLKEY='genbaCamera.tpl', CASEKEY='genbaCamera.cases';
let facing='environment', stream=null;
let tray=[]; // {id,blob,name,url}

/* ---------- 撮影データの退避(IndexedDB) ----------
   撮った瞬間に端末内へ保存する。保存操作の失敗・キャンセル・再読込・タブの強制終了があっても写真は残る。
   status: pending(未保存) / sent(共有シートで送信済み。7日間は履歴に残す) */
const DB_NAME='genbaCameraPhotos',DB_STORE='photos',KEEP_MS=7*24*3600*1000;
let idbP=null;
function idbOpen(){
  if(idbP)return idbP;
  idbP=new Promise((res,rej)=>{
    try{
      const r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=()=>{r.result.createObjectStore(DB_STORE,{keyPath:'id'})};
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    }catch(e){rej(e)}
  });
  return idbP;
}
function idbTx(mode,fn){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(DB_STORE,mode),st=tx.objectStore(DB_STORE);
    const out=fn(st);
    tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:true);
    tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);
  }));
}
function idbPut(rec){return idbTx('readwrite',st=>st.put(rec)).then(()=>true).catch(()=>false)}
function idbDel(id){return idbTx('readwrite',st=>st.delete(id)).catch(()=>false)}
function idbAll(){return idbTx('readonly',st=>st.getAll()).then(a=>Array.isArray(a)?a:[]).catch(()=>[])}
function idbSetStatus(ids,status){
  return idbOpen().then(db=>new Promise(res=>{
    const tx=db.transaction(DB_STORE,'readwrite'),st=tx.objectStore(DB_STORE);
    ids.forEach(id=>{const g=st.get(id);g.onsuccess=()=>{const r=g.result;if(r){r.status=status;if(status==='sent')r.sentTs=Date.now();st.put(r)}}});
    tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false);
  })).catch(()=>false);
}
function newId(){return Date.now()+'_'+Math.random().toString(36).slice(2,8)}
function flashMsg(t,ms){
  const e=$('toast');e.textContent='';
  const sp=document.createElement('span');sp.textContent=t;e.appendChild(sp);
  e.style.display='flex';e.style.whiteSpace='normal';e.style.maxWidth='92%';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{e.style.display='none'},ms||7000);
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
async function restoreTray(){
  const all=await idbAll();
  const now=Date.now();
  // 送信済みで7日を過ぎたものは掃除
  all.filter(r=>r.status==='sent'&&r.uploaded&&r.indexed&&now-(r.sentTs||r.ts||0)>KEEP_MS).forEach(r=>idbDel(r.id)); // クラウドに上がって索引にも載った送信済みだけを7日後に掃除。未アップロードは絶対に消さない
  const pend=all.filter(r=>r.status==='pending'&&r.blob).sort((a,b)=>a.ts-b.ts);
  all.forEach(r=>{if(r.blob&&!r.uploaded)unsent.add(r.id)});
  pend.forEach(r=>{if(!tray.some(t=>t.id===r.id))tray.push({id:r.id,blob:r.blob,name:r.name,up:!!r.uploaded,url:URL.createObjectURL(r.blob)})});
  if(pend.length){updateTray();flashMsg('前回の未保存 '+pend.length+' 枚を復元しました。「保存」を押してください',9000)}
  showCloud();uploadPending();
}
/* 📦 履歴: 端末内に残っている写真(未保存+送信済み7日分)を見て、一覧に戻して再保存できる */
let histUrls=[];
function closeHist(){histUrls.forEach(u=>URL.revokeObjectURL(u));histUrls=[];$('hist').style.display='none'}
async function openHist(){
  const g=$('histGrid');g.textContent='読込中…';$('hist').style.display='flex';
  const all=(await idbAll()).filter(r=>r.blob).sort((a,b)=>b.ts-a.ts);
  g.textContent='';
  if(!all.length){g.textContent='履歴はありません';return}
  all.forEach(r=>{
    const c=document.createElement('button');c.className='hc'+(r.status==='sent'?' sent':'');
    const u=URL.createObjectURL(r.blob);histUrls.push(u);
    const im=document.createElement('img');im.src=u;
    const b=document.createElement('b');b.textContent=r.status==='sent'?'送信済み':'未保存';
    const d=new Date(r.ts);
    const sp=document.createElement('span');sp.textContent=(d.getMonth()+1)+'/'+d.getDate()+' '+p2(d.getHours())+':'+p2(d.getMinutes())+(r.uploaded?' ☁':'')+' '+(r.site||'');
    c.appendChild(im);c.appendChild(b);c.appendChild(sp);
    c.onclick=async()=>{
      if(tray.some(t=>t.id===r.id)){flashMsg('すでに保存待ちの一覧にあります',3000);return}
      await idbSetStatus([r.id],'pending');
      tray.push({id:r.id,blob:r.blob,name:r.name,url:URL.createObjectURL(r.blob)});
      updateTray();closeHist();flashMsg('一覧に戻しました。「保存」を押してください',5000);
    };
    g.appendChild(c);
  });
}
$('histBtn').onclick=openHist;$('histClose').onclick=closeHist;$('histCloud').onclick=()=>{window.open('genba-photos.html','genbaPhotos')};
// 未保存の写真があるまま閉じようとしたら警告(写真自体は端末内に退避済みなので、次回開けば復元される)
window.addEventListener('beforeunload',e=>{if(tray.length){e.preventDefault();e.returnValue=''}});

/* ---------- クラウド自動退避 ----------
   撮った写真は、端末内に保存したうえで Firebase Storage の案件フォルダ(users/{userKey}/case_files/{案件キー}/)へ自動アップロードする。
   案件モーダルの📎添付・pdf-noteの案件ファイルと同じ場所なので、そこからそのまま見える。圏外なら溜めておき、電波が戻ったら再送する。
   「保存」(共有シート→写真アプリ)は従来どおり別操作。アップロード済みでも一覧から勝手には消さない。 */
window.genbaUnsaved=function(){return tray.length}; // 現場モード(親ページ)が未保存枚数を表示するために参照する
let urlKey='',urlName='';
const unsent=new Set();
function caseKeyFor(site){
  if(urlKey&&site===urlName)return urlKey;
  const c=cases.find(x=>x.name===site);
  return (c&&c.key)||'';
}
function showCloud(){
  const e=$('cloud');if(!e)return;
  if(!unsent.size){e.textContent='☁ 退避済み';e.style.color='#30d158'}
  else{e.textContent=(navigator.onLine?'☁ 送信待ち ':'☁ 圏外・送信待ち ')+unsent.size;e.style.color='#ff9f0a'}
}
let stReady=null;
function ensureStorage(){
  if(window.firebase&&firebase.storage)return Promise.resolve(true);
  if(stReady)return stReady;
  stReady=new Promise(res=>{
    const sc=document.createElement('script');
    sc.src='https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js';

function idbMark(id,patch){

    const tx=db.transaction(DB_STORE,'readwrite'),st=tx.objectStore(DB_STORE);
    const g=st.get(id);g.onsuccess=()=>{const r=g.result;if(r){Object.assign(r,patch);st.put(r)}};
    tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false);
  })).catch(()=>false);
}
let upBusy=false;
function ymdOf(ts){const d=new Date(ts);return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())}
// アップロードした写真を日付別の索引に記録(genba-photos.html が「今日の写真」を案件別に出すため)
async function indexPhoto(r,key){
  const d=getDb();if(!d)return false;
  try{
    await Promise.race([
      d.ref('genba_photo_index/'+ymdOf(r.ts)+'/'+r.id).set({key:key,site:r.site||'',name:r.name,ts:r.ts}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))
    ]);
    return true;
  }catch(e){return false}
}
async function uploadPending(){
  if(upBusy||!navigator.onLine||typeof getUserKey!=='function'||!getUserKey())return;
  upBusy=true;
  try{
    if(!(await ensureStorage()))return;
    const all=(await idbAll()).filter(r=>r.blob&&(!r.uploaded||!r.indexed)).sort((a,b)=>a.ts-b.ts);
    for(const r of all){
      const key=r.key||caseKeyFor(r.site);
      if(!key)continue; // 案件が特定できない写真は、案件が分かった時点で送る
      if(!r.uploaded){
        try{
          await firebase.storage().ref('users/'+getUserKey()+'/case_files/'+key+'/'+r.name).put(r.blob,{contentType:'image/jpeg'});
          await idbMark(r.id,{uploaded:true,upTs:Date.now(),key:key});
          r.uploaded=true;
          unsent.delete(r.id);
          const t=tray.find(x=>x.id===r.id);if(t)t.up=true;
          updateTray();showCloud();
        }catch(e){break} // 通信不良: 残りは次回に回す
      }
      if(r.uploaded&&!r.indexed&&await indexPhoto(r,key))await idbMark(r.id,{indexed:true});
    }
  }catch(e){}
  finally{upBusy=false;showCloud()}
}

/* ---------- EXIF (日時 + GPS) ---------- */
function buildExif(date,pos){
  const gps=!!pos;
  const dtS=date.getFullYear()+':'+p2(date.getMonth()+1)+':'+p2(date.getDate())+' '+
    p2(date.getHours())+':'+p2(date.getMinutes())+':'+p2(date.getSeconds());
  const nIfd0=gps?2:1;
  const exifOff=8+2+nIfd0*12+4;
  const dtOff=exifOff+2+12+4;
  const gpsOff=dtOff+20;
  const latOff=gpsOff+2+5*12+4;
  const lonOff=latOff+24;
  const total=gps?lonOff+24:gpsOff;
  const b=new Uint8Array(total),v=new DataView(b.buffer);
  b[0]=0x4D;b[1]=0x4D;v.setUint16(2,0x2A);v.setUint32(4,8);
  let p=8;
  const e=(tag,type,cnt,val)=>{v.setUint16(p,tag);v.setUint16(p+2,type);v.setUint32(p+4,cnt);v.setUint32(p+8,val>>>0);p+=12};
  // IFD0
  v.setUint16(p,nIfd0);p+=2;
  e(0x8769,4,1,exifOff);
  if(gps)e(0x8825,4,1,gpsOff);
  p+=4;
  // Exif IFD
  p=exifOff;v.setUint16(p,1);p+=2;
  e(0x9003,2,20,dtOff);p+=4;
  for(let i=0;i<19;i++)b[dtOff+i]=dtS.charCodeAt(i);
  if(gps){
    const put=(off,val)=>{
      const a=Math.abs(val);const d=Math.floor(a);const mf=(a-d)*60;const m=Math.floor(mf);const s=(mf-m)*60;
      v.setUint32(off,d);v.setUint32(off+4,1);
      v.setUint32(off+8,m);v.setUint32(off+12,1);
      v.setUint32(off+16,Math.round(s*10000));v.setUint32(off+20,10000);
    };
    p=gpsOff;v.setUint16(p,5);p+=2;
    e(0,1,4,0x02030000);
    e(1,2,2,(pos.lat>=0?0x4E:0x53)<<24);
    e(2,5,3,latOff);
    e(3,2,2,(pos.lon>=0?0x45:0x57)<<24);
    e(4,5,3,lonOff);
    put(latOff,pos.lat);put(lonOff,pos.lon);
  }
  const len=2+6+total;
  const app1=new Uint8Array(2+len);
  app1[0]=0xFF;app1[1]=0xE1;app1[2]=len>>8;app1[3]=len&255;
  app1.set([0x45,0x78,0x69,0x66,0,0],4);
  app1.set(b,10);
  return app1;
}
async function addExif(blob,date,pos){
  const buf=new Uint8Array(await blob.arrayBuffer());
  if(buf[0]!==0xFF||buf[1]!==0xD8)return blob;
  return new Blob([buf.subarray(0,2),buildExif(date,pos),buf.subarray(2)],{type:'image/jpeg'});
}

const p2=n=>String(n).padStart(2,'0');
function dtStr(d){return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function fileStamp(d){return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds())}
const FONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawOverlay(c,w,h,date){
  // 上から: 案件名(最大) / テンプレ・入力文言 / 住所(小・折返し) / 日時(小)
  const rows=[];
  if(S.site.trim())rows.push({t:S.site.trim(),k:1.45,b:true});
  if(S.note.trim())rows.push({t:S.note.trim(),k:1,b:true});
  if(S.addr&&geo.addr)rows.push({t:geo.addr,k:.7,b:false,wrap:true});
  if(S.dt)rows.push({t:dtStr(date),k:.7,b:false});
  if(!rows.length)return;
  let fs=Math.min(w,h)*0.045*(S.size/100);
  const fnt=(l,f)=>(l.b?'bold ':'')+(f*l.k)+'px '+FONT;
  const maxW=w*0.94-fs*1.1;
  const widest=f=>{let m=0;rows.forEach(l=>{if(l.wrap)return;c.font=fnt(l,f);m=Math.max(m,c.measureText(l.t).width)});return m};
  let mw=widest(fs);
  if(mw>maxW){fs*=maxW/mw;mw=widest(fs)}
  const wrapW=Math.min(maxW,Math.max(mw,w*0.5));
  const lines=[];
  rows.forEach(l=>{
    if(!l.wrap){lines.push(l);return}
    c.font=fnt(l,fs);
    let cur='';
    for(const ch of l.t){
      if(cur&&c.measureText(cur+ch).width>wrapW){lines.push({t:cur,k:l.k,b:l.b});cur=ch}
      else cur+=ch;
    }
    if(cur)lines.push({t:cur,k:l.k,b:l.b});
  });
  let tw=0;lines.forEach(l=>{c.font=fnt(l,fs);tw=Math.max(tw,c.measureText(l.t).width)});
  const pad=fs*0.55,gap=fs*0.18,mg=fs*0.6;
  const lh=lines.map(l=>fs*l.k*1.15);
  const bw=tw+pad*2,bh=lh.reduce((a,b)=>a+b,0)+gap*(lines.length-1)+pad*2;
  const x=S.pos.endsWith('r')?w-mg-bw:mg;
  const y=S.pos.startsWith('b')?h-mg-bh:mg;
  if(S.bg>0){c.fillStyle='rgba(0,0,0,'+(S.bg/100)+')';rrect(c,x,y,bw,bh,fs*0.35);c.fill()}
  c.textBaseline='top';c.textAlign='left';
  let ty=y+pad;
  lines.forEach((l,i)=>{
    c.font=fnt(l,fs);
    if(S.bg<25){c.lineWidth=fs*l.k*0.14;c.strokeStyle='rgba(0,0,0,.85)';c.lineJoin='round';c.strokeText(l.t,x+pad,ty)}
    c.fillStyle='#fff';c.fillText(l.t,x+pad,ty);
    ty+=lh[i]+gap;
  });
}
function render(c,w,h,date){
  c.drawImage(video,0,0,w,h);
  drawOverlay(c,w,h,date);
}

/* ---------- preview (映像はそのまま表示、文字は必要時のみ再描画) ---------- */
const stage=$('stage'), frame=$('frame');
function layout(){
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw||!vh)return;
  const r=stage.getBoundingClientRect();
  const sc=Math.min(r.width/vw,r.height/vh);
  frame.style.width=Math.floor(vw*sc)+'px';
  frame.style.height=Math.floor(vh*sc)+'px';
}
function sizeOverlay(){
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw||!vh)return;
  const sc=Math.min(1,1280/Math.max(vw,vh));
  const cw=Math.round(vw*sc),ch=Math.round(vh*sc);
  if(view.width!==cw||view.height!==ch){view.width=cw;view.height=ch}
  layout();redraw();
}
function redraw(){
  if(!view.width)return;
  vctx.clearRect(0,0,view.width,view.height);
  drawOverlay(vctx,view.width,view.height,new Date());
}
video.addEventListener('loadedmetadata',sizeOverlay);
video.addEventListener('resize',sizeOverlay);
window.addEventListener('resize',layout);
if(window.ResizeObserver)new ResizeObserver(layout).observe(stage);
setInterval(redraw,10000); // 日時表示の更新用

/* ---------- capture ---------- */
function updateTray(){
  const t=$('tray');t.innerHTML='';
  tray.forEach((p,i)=>{
    const d=document.createElement('div');d.className='th';
    const im=document.createElement('img');im.src=p.url;
    const x=document.createElement('b');x.textContent='×';
    x.onclick=()=>{URL.revokeObjectURL(p.url);idbDel(p.id);tray.splice(i,1);updateTray()};
    d.appendChild(im);d.appendChild(x);
    if(p.up){const cl=document.createElement('i');cl.textContent='☁';d.appendChild(cl)}
    t.appendChild(d);
  });
  t.scrollLeft=t.scrollWidth;
  $('save').textContent='保存 ('+tray.length+')';
  $('save').disabled=!tray.length;
}
$('shutter').onclick=()=>{
  if(paused){resumeCam();return}
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw)return;
  const date=new Date();
  const cv=document.createElement('canvas');cv.width=vw;cv.height=vh;
  render(cv.getContext('2d'),vw,vh,date);
  const f=$('flash');f.style.opacity=.8;setTimeout(()=>f.style.opacity=0,80);
  const pos=(S.gps&&geo.pos)?{lat:geo.pos.lat,lon:geo.pos.lon}:null;
  cv.toBlob(async blob0=>{
    if(!blob0)return;
    let blob=blob0;
    try{blob=await addExif(blob0,date,pos)}catch(err){blob=blob0}
    const base=(S.site.trim()||'photo').replace(/[\\\/:*?"<>|\s]+/g,'_').slice(0,40);
    const name=base+'_'+fileStamp(date)+'_'+String(date.getMilliseconds()).padStart(3,'0')+'.jpg';
    const id=newId();
    tray.push({id,blob,name,url:URL.createObjectURL(blob)});
    updateTray();
    unsent.add(id);showCloud();
    idbPut({id,name,blob,ts:date.getTime(),site:S.site,key:caseKeyFor(S.site),uploaded:false,status:'pending'}).then(ok=>{
      if(!ok)flashMsg('⚠ 端末内への退避に失敗しました。こまめに「保存」を押してください',9000);
      else uploadPending();
    });
  },'image/jpeg',0.92);
};

/* ---------- save ---------- */
function clearTray(){tray.forEach(p=>URL.revokeObjectURL(p.url));tray=[];updateTray()}
let lastSent=null, toastTimer=null;
function releaseSent(){
  if(lastSent){lastSent.forEach(p=>URL.revokeObjectURL(p.url));lastSent=null}
}
function showToast(n){
  const t=$('toast');
  t.innerHTML='<span>'+n+'枚 送信済み</span><button id="undo">戻す</button>';
  t.style.display='flex';t.style.whiteSpace='nowrap';
  $('undo').onclick=()=>{
    if(lastSent){idbSetStatus(lastSent.map(p=>p.id),'pending');tray=lastSent.concat(tray);lastSent=null;updateTray()}
    t.style.display='none';clearTimeout(toastTimer);
  };
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.style.display='none';releaseSent()},20000);
}
$('save').onclick=async()=>{
  if(!tray.length)return;
  const sending=tray.slice();
  const files=sending.map(p=>new File([p.blob],p.name,{type:'image/jpeg'}));
  if(navigator.canShare&&navigator.canShare({files})){
    let err=null;
    try{await navigator.share({files})}catch(e){err=e||{}}
    if(!err){
      // 共有シートの操作が完了した場合だけ「送信済み」にする(端末内には7日間残る)
      idbSetStatus(sending.map(p=>p.id),'sent');
      releaseSent();
      tray=tray.filter(p=>!sending.includes(p));
      lastSent=sending;
      updateTray();showToast(sending.length);
    }else{
      // キャンセル・失敗: 写真は一覧に残したまま。消さない
      flashMsg(err.name==='AbortError'?'保存は完了していません(キャンセル)。写真は残っています。もう一度「保存」を押してください':'保存に失敗しました。写真は残っています: '+(err.message||err.name||''),9000);
    }
    return;
  }
  // fallback: download
  sending.forEach((p,i)=>setTimeout(()=>{
    const a=document.createElement('a');a.href=p.url;a.download=p.name;
    document.body.appendChild(a);a.click();a.remove();
  },i*400));
  setTimeout(()=>{
    idbSetStatus(sending.map(p=>p.id),'sent');
    tray=tray.filter(p=>!sending.includes(p));
    sending.forEach(p=>URL.revokeObjectURL(p.url));
    updateTray();
  },sending.length*400+500);
};

$('backBtn').onclick=function(){if(tray.length&&!confirm('まだ写真アプリに保存していない写真が '+tray.length+' 枚あります。\n保存せずに戻りますか?\n(写真は端末内に残ります)'))return;window.close();setTimeout(function(){if(history.length>1)history.back();else location.href='today.html'},400)};fitVV();$('ver').textContent=VER;loadUI();updateTray();restoreTray();startGeo();loadTpls();loadCases();
// 案件モーダルの「📷 撮影」から開かれた場合は、その案件を選んだ状態で直接カメラを起動する。
// それ以外(直接開いた場合)は、案件選択モーダルを出す。
(function(){
  let q=null;
  try{q=new URLSearchParams(location.search)}catch(e){}
  const c=q&&q.get('case');
  if(c){
    urlKey=q.get('key')||'';urlName=c;
    S.site=c;S.siteAddr=q.get('addr')||'';saveS();renderCase();
    try{history.replaceState(null,'',location.pathname)}catch(e){}
    startCam();
  }else{
    openModal();
  }
})();
})();
