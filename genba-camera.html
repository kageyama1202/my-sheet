<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>現場カメラ</title>
<!-- VERSION: 2026-11-08 撮影画面を大きく(設定を折りたたみ・横長は映像左/操作右)/キーボード対策/案件モーダルの📷撮影から起動(?case=)/案件選択モーダル+撮影開始/右下に案件名/テンプレ文言(Firebase保存) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="user-scope.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,"Hiragino Sans",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;position:fixed;left:0;right:0;top:0;height:100dvh;height:var(--vvh,100dvh);transform:translateY(var(--vvt,0px))}
#stage{flex:1;min-height:0;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:100%;height:100%}
#frame video,#frame canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#frame video{object-fit:fill}
#view{pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#err{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);text-align:center;font-size:14px;line-height:1.6;display:none;background:rgba(0,0,0,.7);padding:12px;border-radius:10px}
#err button{margin-top:8px}
#paused{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.88);font-size:18px;line-height:1.9;z-index:4}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;align-items:center;gap:12px;background:rgba(40,40,42,.95);padding:8px 8px 8px 16px;border-radius:20px;font-size:14px;white-space:nowrap;z-index:5}
#toast button{background:#0a84ff;padding:6px 14px}
#panel{background:#1c1c1e;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #333;max-height:46vh;max-height:calc(var(--vvh,100dvh)*.5);overflow-y:auto}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.row label{font-size:11px;color:#aaa;white-space:nowrap;min-width:44px}
input[type=text],select{flex:1;min-width:0;font-size:16px;padding:7px 8px;border-radius:8px;border:1px solid #444;background:#2c2c2e;color:#fff}
input[type=range]{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;max-height:80px;overflow-y:auto}
.chip{font-size:13px;padding:5px 10px;border-radius:14px;background:#3a3a3c;border:none;color:#fff}
.chip.on{background:#0a84ff}
button{font-size:14px;border:none;border-radius:8px;padding:8px 12px;background:#3a3a3c;color:#fff}
#bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:#000}
#shutter{width:68px;height:68px;border-radius:50%;background:#fff;border:5px solid #888;padding:0}
#shutter:active{background:#ddd}
#save{background:#0a84ff;min-width:92px}
#save:disabled{background:#3a3a3c;color:#777}
#tray{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;height:56px}
.th{position:relative;flex:0 0 auto;height:56px}
.th img{height:56px;border-radius:6px;display:block}
.th b{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:#ff453a;font-size:12px;line-height:20px;text-align:center}
.ck{display:flex;align-items:center;gap:4px;font-size:13px}
.ck input{width:18px;height:18px}

#panel{padding-bottom:calc(34px + env(safe-area-inset-bottom))}
body.kb #panel{padding-bottom:8px}
body.kb #modal{padding-bottom:8px}
#caseBtn{flex:1;min-width:0;text-align:left;font-size:15px;font-weight:bold;padding:9px 10px;background:#0a84ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#caseBtn.empty{background:#ff9f0a;color:#000}
#tplSave{background:#30d158;color:#000;white-space:nowrap}
#modal{position:fixed;left:0;right:0;top:0;height:100dvh;height:var(--vvh,100dvh);transform:translateY(var(--vvt,0px));background:#000;z-index:30;display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
#modal h2{margin:4px 0 8px;font-size:16px}
#mSearch{width:100%;flex:none;margin-bottom:8px}
#mList{flex:1;min-height:0;overflow-y:auto}
.mi{display:block;width:100%;text-align:left;margin-bottom:6px;padding:10px 12px;background:#2c2c2e;border-radius:10px;font-size:15px}
.mi b{display:block;font-size:16px}
.mi small{display:block;color:#aaa;font-size:12px;margin-top:2px;white-space:normal}
.mi .tg{display:inline-block;font-size:11px;background:#ff9f0a;color:#000;border-radius:8px;padding:1px 7px;margin-right:6px;font-weight:bold}
.mi.keep{background:#0a84ff}
.msec{font-size:12px;color:#aaa;margin:8px 0 4px}
#mFoot{flex:none;display:flex;gap:8px;margin-top:8px}
.mi.sel{outline:3px solid #30d158;background:#1f3a29}
#mSel{flex:none;font-size:14px;color:#aaa;margin-bottom:8px;line-height:1.4}
#mSel b{color:#fff;font-size:16px}
#mStart{flex:none;width:100%;padding:16px;font-size:18px;font-weight:bold;background:#30d158;color:#000;margin-top:10px}
#mStart:disabled{background:#3a3a3c;color:#777}
#mManual{flex:1;min-width:0}

#setBtn{background:#3a3a3c}
/* 横長の画面(iPad横・Mac): 映像を左いっぱいに、操作(シャッター・案件・文言)を右の列にまとめる */
@media (min-aspect-ratio:13/10) and (min-width:900px){
  #app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr}
  #stage{grid-column:1;grid-row:1/3}
  #bar{grid-column:2;grid-row:1}
  #panel{grid-column:2;grid-row:2;max-height:none;border-top:none;border-left:1px solid #333}
  .chips{max-height:none;overflow:visible}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="frame">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="view"></canvas>
    </div>
    <div id="flash"></div>
    <div id="toast"></div>
    <div id="paused">カメラを一時停止中<br>タップで再開</div>
    <div id="err"></div>
  </div>

  <div id="bar">
    <div id="tray"></div>
    <button id="shutter" aria-label="撮影"></button>
    <button id="save" disabled>保存 (0)</button>
  </div>

  <div id="panel">
    <div class="row"><label>案件</label><button id="caseBtn" class="empty">案件を選ぶ</button></div>
    <div class="row"><label>文言</label><input type="text" id="note" placeholder="テンプレを選ぶ/打って保存" autocomplete="off"><button id="tplSave">保存</button></div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button id="setBtn">⚙ 設定 ▾</button>
      <button id="flip">カメラ切替</button>
      <span id="gpsst" style="font-size:11px;color:#aaa"></span>
    </div>
    <div id="settings" style="display:none">
      <div class="row">
        <label>位置</label>
        <select id="pos">
          <option value="bl">左下</option><option value="br">右下</option>
          <option value="tl">左上</option><option value="tr">右上</option>
        </select>
        <label class="ck"><input type="checkbox" id="dt" checked>日時</label>
      </div>
      <div class="row">
        <label>GPS</label>
        <label class="ck"><input type="checkbox" id="gps" checked>GPS付与</label>
        <label class="ck"><input type="checkbox" id="addr" checked>住所表示</label>
      </div>
      <div class="row"><label>文字サイズ</label><input type="range" id="size" min="50" max="220" value="100"></div>
      <div class="row"><label>背景濃さ</label><input type="range" id="bg" min="0" max="90" value="55"></div>
    </div>
  </div>
</div>

<div id="modal">
  <h2>今日撮る案件を選んでください</h2>
  <div id="mSel"></div>
  <input type="text" id="mSearch" placeholder="名前・住所で検索(全案件から)" autocomplete="off">
  <div id="mList"></div>
  <div id="mFoot"><input type="text" id="mManual" placeholder="手入力(案件にない現場)"><button id="mManualOk">決定</button></div>
  <button id="mStart" disabled>撮影開始</button>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const video=$('video'), view=$('view'), vctx=view.getContext('2d');
const TPL_DEFAULT=['外観','キーボックス','玄関から','遠景','正面から','横から','打ち合わせ内容','施工日お知らせ','天井の様子','排気ダクト','キッチン側','居間から','右側','左側','上から','下部','吊元の下部'];
const LS='genbaCamera.v2', LS_OLD='genbaCamera.v1', TPLKEY='genbaCamera.tpl', CASEKEY='genbaCamera.cases';
let facing='environment', stream=null;
let tray=[]; // {blob,name,url}

/* ---------- settings ---------- */
function readLS(k){try{return JSON.parse(localStorage.getItem(k))||null}catch(e){return null}}
const old=readLS(LS_OLD)||{};
const carry={};['size','bg','dt','gps','addr'].forEach(k=>{if(old[k]!==undefined)carry[k]=old[k]});
// 位置の初期値は右下(旧バージョンの左下設定は引き継がない)
const S=Object.assign({site:'',siteAddr:'',note:'',pos:'br',dt:true,gps:true,addr:true,size:100,bg:55},carry,readLS(LS)||{});
function saveS(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}redraw()}
function loadUI(){
  $('note').value=S.note;$('pos').value=S.pos;
  $('dt').checked=S.dt;$('gps').checked=S.gps;$('addr').checked=S.addr;
  $('size').value=S.size;$('bg').value=S.bg;
  renderCase();renderChips();
}
function renderCase(){
  const b=$('caseBtn');
  if(S.site){b.textContent=S.site;b.classList.remove('empty')}
  else{b.textContent='案件を選ぶ';b.classList.add('empty')}
}

/* ---------- テンプレ文言(Firebase保存 + 端末キャッシュ) ---------- */
let tpls=TPL_DEFAULT.slice();
(function(){const c=readLS(TPLKEY);if(Array.isArray(c)&&c.length)tpls=c})();
let fdb=null;
function getDb(){
  if(fdb)return fdb;
  try{if(window.scopedDatabase&&window.firebase)fdb=scopedDatabase(firebase.database())}catch(e){}
  return fdb;
}
function cacheTpls(){try{localStorage.setItem(TPLKEY,JSON.stringify(tpls))}catch(e){}}
function pushTpls(){const d=getDb();if(d)d.ref('genba_camera_templates').set(tpls).catch(()=>{})}
function loadTpls(){
  const d=getDb();if(!d)return;
  d.ref('genba_camera_templates').once('value').then(sn=>{
    let v=sn.val();
    if(v&&!Array.isArray(v))v=Object.keys(v).map(k=>v[k]);
    if(Array.isArray(v)&&v.length){tpls=v.filter(x=>typeof x==='string'&&x);cacheTpls();renderChips()}
    else{pushTpls()} // 初回: 初期17件をFirebaseへ書き込む
  }).catch(()=>{});
}
function renderChips(){
  const c=$('chips');c.innerHTML='';
  tpls.forEach(t=>{
    const b=document.createElement('button');
    b.className='chip'+(S.note===t?' on':'');b.textContent=t;
    b.onclick=()=>{hideKb();S.note=(S.note===t?'':t);$('note').value=S.note;saveS();renderChips();};
    c.appendChild(b);
  });
}
$('tplSave').onclick=()=>{
  const t=$('note').value.trim();
  if(!t)return;
  hideKb();
  if(!tpls.includes(t)){tpls.push(t);cacheTpls();pushTpls();renderChips()}
  const b=$('tplSave');b.textContent='✓';setTimeout(()=>b.textContent='保存',900);
};
$('setBtn').onclick=()=>{const o=$('settings').style.display==='none';$('settings').style.display=o?'block':'none';$('setBtn').textContent=o?'⚙ 設定 ▴':'⚙ 設定 ▾';setTimeout(()=>{try{layout()}catch(e){}},50)};
$('note').oninput=e=>{S.note=e.target.value;saveS();renderChips()};
$('pos').onchange=e=>{S.pos=e.target.value;saveS()};
$('dt').onchange=e=>{S.dt=e.target.checked;saveS()};
$('gps').onchange=e=>{S.gps=e.target.checked;saveS()};
$('addr').onchange=e=>{S.addr=e.target.checked;saveS()};
$('size').oninput=e=>{S.size=+e.target.value;saveS()};
$('bg').oninput=e=>{S.bg=+e.target.value;saveS()};

/* ---------- 案件(Firebase app_tasks → 端末キャッシュ) ---------- */
let cases=readLS(CASEKEY)||[];
const sv=(c,i)=>{if(!c)return'';if(Array.isArray(c))return c.length>i&&c[i]!=null?String(c[i]):'';if(typeof c==='object')return c[i]!=null?String(c[i]):'';return''};
function ymd(ds){
  if(!ds)return'';
  const d=String(ds).replace(/\s+/g,'').replace(/\//g,'-').replace(/\./g,'-').split('-');
  return d.length===3?d[0]+'-'+p2(+d[1])+'-'+p2(+d[2]):'';
}
function todayStr(){const t=new Date();return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())}
function loadCases(){
  const d=getDb();if(!d)return;
  d.ref('app_tasks').once('value').then(sn=>{
    const t=sn.val()||{},arr=[];
    Object.keys(t).forEach(k=>{
      const o=t[k],c=o&&o.csvData;if(!c)return;
      const name=sv(c,4).trim();if(!name)return;
      const status=sv(c,1).replace(/\s+/g,'');
      if(status==='完了')return;
      arr.push({name,addr:sv(c,11).replace(/\s+/g,''),sekou:ymd(sv(c,2)),shitami:ymd(sv(c,12)),yotei:ymd(o.date||'')});
    });
    if(arr.length){
      cases=arr;
      try{localStorage.setItem(CASEKEY,JSON.stringify(arr))}catch(e){}
      if($('modal').style.display==='flex')renderModal();
    }
  }).catch(()=>{});
}

/* ---------- 案件選択モーダル ---------- */
const norm=t=>String(t||'').normalize('NFKC').replace(/[\s　]+/g,'').toLowerCase();
function pickCase(name,addr){
  hideKb();
  S.site=name;S.siteAddr=addr||'';saveS();renderCase();updateSel();
}
function updateSel(){
  const m=$('mSel');m.textContent='';
  if(S.site){m.appendChild(document.createTextNode('選択中: '));const b=document.createElement('b');b.textContent=S.site;m.appendChild(b)}
  else m.textContent='案件が未選択です。下から選んで「撮影開始」を押してください';
  $('mStart').disabled=!S.site;
  $('mStart').textContent=(stream&&stream.active)?'この案件で撮影を続ける':'撮影開始';
  document.querySelectorAll('#mList .mi').forEach(b=>b.classList.toggle('sel',!!S.site&&b.dataset.name===S.site));
}
function openModal(){
  $('mSearch').value='';$('mManual').value='';
  $('modal').style.display='flex';renderModal();
}
function closeModal(){
  hideKb();
  $('modal').style.display='none';
  // モーダルから撮影開始: 案件を決めた(または前回のまま続ける)時点でカメラを起動する
  if(!paused&&(!stream||!stream.active))startCam();
}
function caseTags(c){
  const td=todayStr(),a=[];
  if(c.shitami===td)a.push('今日 下見');
  else if(c.yotei===td)a.push('今日 下見予定');
  if(c.sekou===td)a.push('今日 施工');
  return a;
}
function renderModal(){
  const q=norm($('mSearch').value),L=$('mList');L.innerHTML='';
  let list,head;
  if(q){
    list=cases.filter(c=>norm(c.name).includes(q)||norm(c.addr).includes(q)).slice(0,40);
    head='検索結果('+list.length+'件)';
  }else{
    list=cases.filter(c=>caseTags(c).length);
    head='今日の案件('+list.length+'件)  ※他の案件は検索で選べます';
  }
  const h=document.createElement('div');h.className='msec';h.textContent=head;L.appendChild(h);
  if(!cases.length){
    const m=document.createElement('div');m.className='msec';
    m.textContent='案件データがありません。電波の良い所で一度開き直してください。手入力はできます。';
    L.appendChild(m);
  }
  list.forEach(c=>{
    const b=document.createElement('button');b.className='mi';b.dataset.name=c.name;
    const n=document.createElement('b');
    caseTags(c).forEach(t=>{const g=document.createElement('span');g.className='tg';g.textContent=t;n.appendChild(g)});
    n.appendChild(document.createTextNode(c.name));
    const a=document.createElement('small');a.textContent=c.addr;
    b.appendChild(n);b.appendChild(a);
    b.onclick=()=>pickCase(c.name,c.addr);
    L.appendChild(b);
  });
  updateSel();
}
$('mSearch').oninput=renderModal;
$('mManualOk').onclick=()=>{hideKb();const t=$('mManual').value.trim();if(t)pickCase(t,'')};
$('mStart').onclick=closeModal;
$('caseBtn').onclick=openModal;

/* ---------- キーボード対策: 見える範囲に合わせて縮め、入力が終わったら閉じる ---------- */
const vv=window.visualViewport;
function fitVV(){
  const zoomed=vv&&vv.scale>1.02;
  const h=(vv&&!zoomed)?vv.height:window.innerHeight;
  const t=(vv&&!zoomed)?vv.offsetTop:0;
  const r=document.documentElement.style;
  r.setProperty('--vvh',Math.round(h)+'px');
  r.setProperty('--vvt',Math.round(t)+'px');
  document.body.classList.toggle('kb',h<window.screen.height*0.7&&h<window.innerHeight*0.85);
  try{layout()}catch(e){}
}
if(vv){vv.addEventListener('resize',fitVV);vv.addEventListener('scroll',fitVV)}
window.addEventListener('resize',fitVV);
function hideKb(){const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))a.blur()}
['note','mSearch','mManual'].forEach(id=>{
  const el=$(id);
  el.setAttribute('enterkeyhint','done');
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();hideKb()}});
  el.addEventListener('focus',()=>setTimeout(()=>{try{el.scrollIntoView({block:'nearest'})}catch(e){}},350));
});

/* ---------- camera ---------- */
function showErr(msg,retry){
  const e=$('err');e.style.display='block';
  e.innerHTML=msg+(retry?'<br><button id="retry">再試行</button>':'');
  if(retry)$('retry').onclick=startCam;
}
async function startCam(){
  $('err').style.display='none';
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showErr('このブラウザはカメラに対応していません。HTTPS(GitHub Pages等)で開いてください。');return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:facing},width:{ideal:4032},height:{ideal:3024},aspectRatio:{ideal:4/3}},audio:false});
    video.srcObject=stream;
    await video.play().catch(()=>{});
  }catch(err){
    showErr('カメラを起動できません。<br>設定でカメラの許可を確認してください。<br>('+(err.name||err)+')',true);
  }
}
$('flip').onclick=()=>{facing=(facing==='environment'?'user':'environment');startCam()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!paused&&$('modal').style.display!=='flex'&&(!stream||!stream.active))startCam()});

/* ---------- 放置で自動停止(省電力) ---------- */
let paused=false,lastActive=Date.now();
const IDLE_MS=180000; // 3分
function touch(){lastActive=Date.now()}
['pointerdown','keydown','input'].forEach(ev=>document.addEventListener(ev,touch,true));
function pauseCam(){
  paused=true;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  video.srcObject=null;
  $('paused').style.display='flex';
}
function resumeCam(){
  paused=false;touch();
  $('paused').style.display='none';
  startCam();refreshGeo();
}
$('paused').onclick=resumeCam;
setInterval(()=>{if(!paused&&!document.hidden&&Date.now()-lastActive>IDLE_MS)pauseCam()},15000);

/* ---------- location ---------- */
const geo={pos:null,addr:'',lastQ:null};
let muni=null;
function gst(t){$('gpsst').textContent=t}
function loadMuni(){
  const s=document.createElement('script');
  s.src='https://maps.gsi.go.jp/js/muni.js';
  s.onload=()=>{try{muni=window.GSI&&window.GSI.MUNI_ARRAY}catch(e){}};
  document.head.appendChild(s);
}
function dist(a,b){
  const R=6371000,r=Math.PI/180;
  const dx=(b.lon-a.lon)*r*Math.cos(a.lat*r),dy=(b.lat-a.lat)*r;
  return R*Math.sqrt(dx*dx+dy*dy);
}
async function revGeo(lat,lon){
  try{
    const r=await fetch('https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat='+lat+'&lon='+lon);
    const j=await r.json();const res=j&&j.results;
    if(!res){geo.lastQ=null;return}
    let pre='';
    if(muni&&res.muniCd){
      const m=muni[String(parseInt(res.muniCd,10))];
      if(m){const a=String(m).split(',');if(a.length>=4)pre=a[1]+a[3]}
    }
    geo.addr=pre+(res.lv01Nm||'');
    redraw();
  }catch(e){geo.lastQ=null}
}
// 位置情報は常時取得せず、起動時・前面復帰時・60秒ごとに1回だけ取得(省電力)
function refreshGeo(){
  if(!S.gps&&!S.addr)return;
  if(!navigator.geolocation){gst('不可');return}
  navigator.geolocation.getCurrentPosition(p=>{
    geo.pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
    gst('OK ±'+Math.round(p.coords.accuracy)+'m');
    if(!geo.lastQ||dist(geo.lastQ,geo.pos)>30){
      geo.lastQ={lat:geo.pos.lat,lon:geo.pos.lon};
      revGeo(geo.pos.lat,geo.pos.lon);
    }
  },e=>gst(e.code===1?'許可なし':'取得失敗'),
  {enableHighAccuracy:true,maximumAge:30000,timeout:20000});
}
function startGeo(){
  loadMuni();gst('取得中…');refreshGeo();
  setInterval(()=>{if(!document.hidden&&!paused)refreshGeo()},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshGeo()});
}

/* ---------- EXIF (日時 + GPS) ---------- */
function buildExif(date,pos){
  const gps=!!pos;
  const dtS=date.getFullYear()+':'+p2(date.getMonth()+1)+':'+p2(date.getDate())+' '+
    p2(date.getHours())+':'+p2(date.getMinutes())+':'+p2(date.getSeconds());
  const nIfd0=gps?2:1;
  const exifOff=8+2+nIfd0*12+4;
  const dtOff=exifOff+2+12+4;
  const gpsOff=dtOff+20;
  const latOff=gpsOff+2+5*12+4;
  const lonOff=latOff+24;
  const total=gps?lonOff+24:gpsOff;
  const b=new Uint8Array(total),v=new DataView(b.buffer);
  b[0]=0x4D;b[1]=0x4D;v.setUint16(2,0x2A);v.setUint32(4,8);
  let p=8;
  const e=(tag,type,cnt,val)=>{v.setUint16(p,tag);v.setUint16(p+2,type);v.setUint32(p+4,cnt);v.setUint32(p+8,val>>>0);p+=12};
  // IFD0
  v.setUint16(p,nIfd0);p+=2;
  e(0x8769,4,1,exifOff);
  if(gps)e(0x8825,4,1,gpsOff);
  p+=4;
  // Exif IFD
  p=exifOff;v.setUint16(p,1);p+=2;
  e(0x9003,2,20,dtOff);p+=4;
  for(let i=0;i<19;i++)b[dtOff+i]=dtS.charCodeAt(i);
  if(gps){
    const put=(off,val)=>{
      const a=Math.abs(val);const d=Math.floor(a);const mf=(a-d)*60;const m=Math.floor(mf);const s=(mf-m)*60;
      v.setUint32(off,d);v.setUint32(off+4,1);
      v.setUint32(off+8,m);v.setUint32(off+12,1);
      v.setUint32(off+16,Math.round(s*10000));v.setUint32(off+20,10000);
    };
    p=gpsOff;v.setUint16(p,5);p+=2;
    e(0,1,4,0x02030000);
    e(1,2,2,(pos.lat>=0?0x4E:0x53)<<24);
    e(2,5,3,latOff);
    e(3,2,2,(pos.lon>=0?0x45:0x57)<<24);
    e(4,5,3,lonOff);
    put(latOff,pos.lat);put(lonOff,pos.lon);
  }
  const len=2+6+total;
  const app1=new Uint8Array(2+len);
  app1[0]=0xFF;app1[1]=0xE1;app1[2]=len>>8;app1[3]=len&255;
  app1.set([0x45,0x78,0x69,0x66,0,0],4);
  app1.set(b,10);
  return app1;
}
async function addExif(blob,date,pos){
  const buf=new Uint8Array(await blob.arrayBuffer());
  if(buf[0]!==0xFF||buf[1]!==0xD8)return blob;
  return new Blob([buf.subarray(0,2),buildExif(date,pos),buf.subarray(2)],{type:'image/jpeg'});
}

/* ---------- overlay ---------- */
const p2=n=>String(n).padStart(2,'0');
function dtStr(d){return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function fileStamp(d){return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds())}
const FONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawOverlay(c,w,h,date){
  // 上から: 案件名(最大) / テンプレ・入力文言 / 住所(小・折返し) / 日時(小)
  const rows=[];
  if(S.site.trim())rows.push({t:S.site.trim(),k:1.45,b:true});
  if(S.note.trim())rows.push({t:S.note.trim(),k:1,b:true});
  if(S.addr&&geo.addr)rows.push({t:geo.addr,k:.7,b:false,wrap:true});
  if(S.dt)rows.push({t:dtStr(date),k:.7,b:false});
  if(!rows.length)return;
  let fs=Math.min(w,h)*0.045*(S.size/100);
  const fnt=(l,f)=>(l.b?'bold ':'')+(f*l.k)+'px '+FONT;
  const maxW=w*0.94-fs*1.1;
  const widest=f=>{let m=0;rows.forEach(l=>{if(l.wrap)return;c.font=fnt(l,f);m=Math.max(m,c.measureText(l.t).width)});return m};
  let mw=widest(fs);
  if(mw>maxW){fs*=maxW/mw;mw=widest(fs)}
  const wrapW=Math.min(maxW,Math.max(mw,w*0.5));
  const lines=[];
  rows.forEach(l=>{
    if(!l.wrap){lines.push(l);return}
    c.font=fnt(l,fs);
    let cur='';
    for(const ch of l.t){
      if(cur&&c.measureText(cur+ch).width>wrapW){lines.push({t:cur,k:l.k,b:l.b});cur=ch}
      else cur+=ch;
    }
    if(cur)lines.push({t:cur,k:l.k,b:l.b});
  });
  let tw=0;lines.forEach(l=>{c.font=fnt(l,fs);tw=Math.max(tw,c.measureText(l.t).width)});
  const pad=fs*0.55,gap=fs*0.18,mg=fs*0.6;
  const lh=lines.map(l=>fs*l.k*1.15);
  const bw=tw+pad*2,bh=lh.reduce((a,b)=>a+b,0)+gap*(lines.length-1)+pad*2;
  const x=S.pos.endsWith('r')?w-mg-bw:mg;
  const y=S.pos.startsWith('b')?h-mg-bh:mg;
  if(S.bg>0){c.fillStyle='rgba(0,0,0,'+(S.bg/100)+')';rrect(c,x,y,bw,bh,fs*0.35);c.fill()}
  c.textBaseline='top';c.textAlign='left';
  let ty=y+pad;
  lines.forEach((l,i)=>{
    c.font=fnt(l,fs);
    if(S.bg<25){c.lineWidth=fs*l.k*0.14;c.strokeStyle='rgba(0,0,0,.85)';c.lineJoin='round';c.strokeText(l.t,x+pad,ty)}
    c.fillStyle='#fff';c.fillText(l.t,x+pad,ty);
    ty+=lh[i]+gap;
  });
}
function render(c,w,h,date){
  c.drawImage(video,0,0,w,h);
  drawOverlay(c,w,h,date);
}

/* ---------- preview (映像はそのまま表示、文字は必要時のみ再描画) ---------- */
const stage=$('stage'), frame=$('frame');
function layout(){
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw||!vh)return;
  const r=stage.getBoundingClientRect();
  const sc=Math.min(r.width/vw,r.height/vh);
  frame.style.width=Math.floor(vw*sc)+'px';
  frame.style.height=Math.floor(vh*sc)+'px';
}
function sizeOverlay(){
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw||!vh)return;
  const sc=Math.min(1,1280/Math.max(vw,vh));
  const cw=Math.round(vw*sc),ch=Math.round(vh*sc);
  if(view.width!==cw||view.height!==ch){view.width=cw;view.height=ch}
  layout();redraw();
}
function redraw(){
  if(!view.width)return;
  vctx.clearRect(0,0,view.width,view.height);
  drawOverlay(vctx,view.width,view.height,new Date());
}
video.addEventListener('loadedmetadata',sizeOverlay);
video.addEventListener('resize',sizeOverlay);
window.addEventListener('resize',layout);
if(window.ResizeObserver)new ResizeObserver(layout).observe(stage);
setInterval(redraw,10000); // 日時表示の更新用

/* ---------- capture ---------- */
function updateTray(){
  const t=$('tray');t.innerHTML='';
  tray.forEach((p,i)=>{
    const d=document.createElement('div');d.className='th';
    const im=document.createElement('img');im.src=p.url;
    const x=document.createElement('b');x.textContent='×';
    x.onclick=()=>{URL.revokeObjectURL(p.url);tray.splice(i,1);updateTray()};
    d.appendChild(im);d.appendChild(x);t.appendChild(d);
  });
  t.scrollLeft=t.scrollWidth;
  $('save').textContent='保存 ('+tray.length+')';
  $('save').disabled=!tray.length;
}
$('shutter').onclick=()=>{
  if(paused){resumeCam();return}
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw)return;
  const date=new Date();
  const cv=document.createElement('canvas');cv.width=vw;cv.height=vh;
  render(cv.getContext('2d'),vw,vh,date);
  const f=$('flash');f.style.opacity=.8;setTimeout(()=>f.style.opacity=0,80);
  const pos=(S.gps&&geo.pos)?{lat:geo.pos.lat,lon:geo.pos.lon}:null;
  cv.toBlob(async blob0=>{
    if(!blob0)return;
    let blob=blob0;
    try{blob=await addExif(blob0,date,pos)}catch(err){blob=blob0}
    const base=(S.site.trim()||'photo').replace(/[\\\/:*?"<>|\s]+/g,'_').slice(0,40);
    const name=base+'_'+fileStamp(date)+'.jpg';
    tray.push({blob,name,url:URL.createObjectURL(blob)});
    updateTray();
  },'image/jpeg',0.92);
};

/* ---------- save ---------- */
function clearTray(){tray.forEach(p=>URL.revokeObjectURL(p.url));tray=[];updateTray()}
let lastSent=null, toastTimer=null;
function releaseSent(){
  if(lastSent){lastSent.forEach(p=>URL.revokeObjectURL(p.url));lastSent=null}
}
function showToast(n){
  const t=$('toast');
  t.innerHTML='<span>'+n+'枚 送信済み</span><button id="undo">戻す</button>';
  t.style.display='flex';
  $('undo').onclick=()=>{
    if(lastSent){tray=lastSent.concat(tray);lastSent=null;updateTray()}
    t.style.display='none';clearTimeout(toastTimer);
  };
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.style.display='none';releaseSent()},20000);
}
$('save').onclick=async()=>{
  if(!tray.length)return;
  const sending=tray.slice();
  const files=sending.map(p=>new File([p.blob],p.name,{type:'image/jpeg'}));
  if(navigator.canShare&&navigator.canShare({files})){
    try{await navigator.share({files})}catch(e){}
    // 結果に関わらず一覧から外し、20秒間「戻す」を表示(キャンセル時の救済)
    releaseSent();
    tray=tray.filter(p=>!sending.includes(p));
    lastSent=sending;
    updateTray();showToast(sending.length);
    return;
  }
  // fallback: download
  sending.forEach((p,i)=>setTimeout(()=>{
    const a=document.createElement('a');a.href=p.url;a.download=p.name;
    document.body.appendChild(a);a.click();a.remove();
  },i*400));
  setTimeout(clearTray,sending.length*400+500);
};

fitVV();loadUI();updateTray();startGeo();loadTpls();loadCases();
// 案件モーダルの「📷 撮影」から開かれた場合は、その案件を選んだ状態で直接カメラを起動する。
// それ以外(直接開いた場合)は、案件選択モーダルを出す。
(function(){
  let q=null;
  try{q=new URLSearchParams(location.search)}catch(e){}
  const c=q&&q.get('case');
  if(c){
    S.site=c;S.siteAddr=q.get('addr')||'';saveS();renderCase();
    try{history.replaceState(null,'',location.pathname)}catch(e){}
    startCam();
  }else{
    openModal();
  }
})();
})();
