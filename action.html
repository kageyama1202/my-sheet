<!DOCTYPE html>
<!-- VERSION: 2026-09-01-005 -->
<!-- 第一次構想版：本日起こすべきアクション5本柱を一発表示するページ -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アクション</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="user-scope.js"></script>
<link rel="stylesheet" href="shared-modal.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic Pro','Meiryo',sans-serif;background:#0f1117;color:#e0e6f0;min-height:100vh;padding-bottom:40px;}
.header{background:#111827;border-bottom:2px solid #2d6a4f;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;}
.header a{color:#52b788;text-decoration:none;font-size:13px;font-weight:bold;}
.header h2{font-size:16px;color:#d8f3dc;flex:1;}
.refresh-btn{background:#1f2937;color:#9ca3af;border:1px solid #374151;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:bold;}
.refresh-btn:hover{background:#374151;color:#e0e6f0;}

.section{margin:14px 12px;background:#151a24;border-radius:10px;border:1px solid #232938;overflow:hidden;}
.section-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #232938;cursor:pointer;}
.section-head .icon{font-size:18px;}
.section-head .title{font-size:14px;font-weight:bold;flex:1;color:#d8f3dc;}
.section-head .count{font-size:12px;font-weight:bold;padding:2px 10px;border-radius:12px;background:#1f2937;color:#9ca3af;}
.section-head .count.has{background:#7c2d12;color:#fed7aa;}
.section-body{padding:8px;}
.section-body.collapsed{display:none;}
.empty-msg{color:#4b5563;font-size:12px;text-align:center;padding:14px 4px;font-style:italic;}

.action-card{background:#1a2232;border-radius:8px;padding:10px 12px;margin-bottom:6px;border-left:3px solid #52b788;cursor:pointer;transition:background 0.15s;}
.action-card:hover{background:#212c40;}
.action-card.contact{border-left-color:#00bcd4;}
.action-card.sms{border-left-color:#8e24aa;}
.action-card.report{border-left-color:#ef4444;}
.action-card.kari{border-left-color:#f0a500;}
.action-card.shitami{border-left-color:#4a90d9;}
.card-top-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.card-time{font-size:11px;font-weight:bold;color:#ffd166;}
.card-title{font-size:13px;font-weight:bold;color:#e0e6f0;flex:1;word-break:break-all;}
.card-sub{font-size:11px;color:#8a92a6;line-height:1.5;}
.card-sub .addr{color:#52b788;}
.card-sub .tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;background:#2d1b4e;color:#c4b5fd;margin-right:4px;}

.loading{text-align:center;padding:40px;color:#52b788;font-size:14px;}
.err{text-align:center;padding:20px;color:#ef4444;font-size:12px;}
</style>
</head>
<body>
<div id="modal-overlay"><div id="modal-content"><button id="modal-close">✖ 閉じる</button><div id="modal-body"></div></div></div>

<div class="header">
  <a href="index.html">◀ トップ</a>
  <h2>⚡ アクション</h2>
  <button class="refresh-btn" onclick="loadAll()">🔄 更新</button>
</div>

<div id="mainContent"><div class="loading">読み込み中...</div></div>

<script src="shared-modal.js"></script>
<script>
var firebaseConfig={
  apiKey:"AIzaSyDznSykpSebsejNdQtpOgfORuzZSoW3_fs",
  authDomain:"project-6745138395263517914.firebaseapp.com",
  databaseURL:"https://project-6745138395263517914-default-rtdb.firebaseio.com",
  projectId:"project-6745138395263517914",
  storageBucket:"project-6745138395263517914.firebasestorage.app",
  messagingSenderId:"1054295910908",
  appId:"1:1054295910908:web:4072df05bd90bbdc896a79"
};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
var db=scopedDatabase(firebase.database());

function getSafeVal(c,i){if(!c)return"";if(Array.isArray(c))return c.length>i&&c[i]!=null?String(c[i]):"";if(typeof c==='object')return c[i]!=null?String(c[i]):"";return"";}
function formatYMD(ds){if(!ds)return"";var d=String(ds).replace(/\s+/g,"").replace(/\//g,"-").replace(/\./g,"-");var p=d.split("-");if(p.length===3)return p[0]+"-"+String(p[1]).padStart(2,'0')+"-"+String(p[2]).padStart(2,'0');return d;}
function getTodayStr(){var t=new Date();return new Date(t.getTime()+9*3600000).toISOString().slice(0,10);}
function shortAddr(addr){if(!addr)return'';var a=addr.replace(/\s+/g,'').replace(/^北海道/,'').replace(/^札幌市/,'');var m=a.match(/(.{0,4}区.{0,12})/);return m?m[1]:a.substring(0,16);}
function escHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var todayStr=getTodayStr();
var globalTasks={};
var globalHeaders=[];
var fullData=null;
var smsList={};
var kariSlotsAll={};

// ---- データ読込 ----
function loadAll(){
  document.getElementById('mainContent').innerHTML='<div class="loading">読み込み中...</div>';
  var p1=db.ref('app_tasks').once('value').then(function(snap){globalTasks=snap.val()||{};});
  var p2=db.ref('app_meta/headers').once('value').then(function(snap){globalHeaders=snap.val()||[];});
  var p3=db.ref('app_sms_list').once('value').then(function(snap){smsList=snap.val()||{};});
  var p4=db.ref('kari_yoyaku_slots').once('value').then(function(snap){kariSlotsAll=snap.val()||{};});
  Promise.all([p1,p2,p3,p4]).then(function(){
    fullData={app_tasks:globalTasks,app_meta:{headers:globalHeaders}};
    render();
  }).catch(function(e){
    document.getElementById('mainContent').innerHTML='<div class="err">⚠ 読み込みエラー：'+escHtml(e.message)+'</div>';
  });
}

// ---- ①本日下見予定 ----
function buildTodayShitami(){
  var items=[];
  Object.keys(globalTasks).forEach(function(key){
    var obj=globalTasks[key];var c=obj.csvData;if(!c)return;
    var shitamiDate=formatYMD(getSafeVal(c,12))||(obj.date?String(obj.date).replace(/\s+/g,''):'');
    if(shitamiDate!==todayStr)return;
    var shitamiTime=getSafeVal(c,13)||obj.time||'';
    items.push({key:key,title:getSafeVal(c,4)||'名称未設定',time:shitamiTime,addr:getSafeVal(c,11),order:obj.order});
  });
  items.sort(function(a,b){
    var oa=parseInt(a.order,10);var ob=parseInt(b.order,10);
    var oaK=isNaN(oa)?9999:oa;var obK=isNaN(ob)?9999:ob;
    if(oaK!==obK)return oaK-obK;
    return (a.time||'99:99').localeCompare(b.time||'99:99');
  });
  return items;
}

// ---- ②連絡必要フラグ ----
function buildNeedsContact(){
  var items=[];
  Object.keys(globalTasks).forEach(function(key){
    var obj=globalTasks[key];var c=obj.csvData;if(!c)return;
    if(!obj.needsContact)return;
    items.push({key:key,title:getSafeVal(c,4)||'名称未設定',addr:getSafeVal(c,11)});
  });
  return items;
}

// ---- ③SMS未送信キュー ----
function buildSmsUnsent(){
  var items=[];
  Object.keys(smsList).forEach(function(fbKey){
    var item=smsList[fbKey];
    if(item.done)return;
    items.push({fbKey:fbKey,label:item.label||'（メモなし）',tel:item.tel||'',body:item.body||'',caseKey:item.caseKey||null});
  });
  items.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  return items;
}

// ---- ④報告書未提出（下見実施済みなのに報告書提出済みに進んでいない） ----
// SF「下見本数（予/実）」列（末尾=index14）を主判定に使用：実施数<予定数（典型は"1/0"）なら未提出候補。
// 対象とする「下見が過去にあった」判定は、SF確定日（c[12]）とアプリ側の予定日（obj.date）のどちらか一方でも
// 過去であれば対象にする（どちらか一方しか入っていないケースがあるため）。
function buildReportMissing(){
  var items=[];
  Object.keys(globalTasks).forEach(function(key){
    var obj=globalTasks[key];var c=obj.csvData;if(!c)return;

    var shitamiDate=formatYMD(getSafeVal(c,12)); // SF確定下見日
    var yoteiDate=obj.date?String(obj.date).replace(/\s+/g,''):''; // アプリ側の予定日
    var pastDate=(shitamiDate&&shitamiDate<todayStr)?shitamiDate:((yoteiDate&&yoteiDate<todayStr)?yoteiDate:'');
    if(!pastDate)return; // どちらも過去日でなければ対象外

    var localStatus=obj.localStatus||'';
    if(localStatus==='報告書提出済'||localStatus==='施工日連絡済')return; // 既に完了なら対象外

    var honsu=getSafeVal(c,14).replace(/\s+/g,'');
    var reportMissing=false;
    var reasonTag='';

    if(honsu&&honsu.indexOf('/')>-1){
      // SF列あり：実施数<予定数（典型は "1/0"）を報告書未提出として判定
      var parts=honsu.split('/');
      var yotei=parseInt(parts[0],10),jisshi=parseInt(parts[1],10);
      if(!isNaN(yotei)&&!isNaN(jisshi)&&jisshi<yotei){
        reportMissing=true;reasonTag='下見'+honsu+'（未提出）';
      }
    }else{
      // SF列が未取込：localStatusベースの簡易フォールバック
      reportMissing=true;
      reasonTag=localStatus?('現在:'+localStatus+'（推定）'):'未着手（推定）';
    }

    if(!reportMissing)return;
    items.push({key:key,title:getSafeVal(c,4)||'名称未設定',shitamiDate:pastDate,reason:reasonTag,addr:getSafeVal(c,11)});
  });
  items.sort(function(a,b){return a.shitamiDate.localeCompare(b.shitamiDate);});
  return items;
}

// ---- ⑤仮予約：未回答／未送信（本日以降のみ） ----
function buildKariPending(){
  var items=[];
  Object.keys(kariSlotsAll).forEach(function(date){
    if(date<todayStr)return; // 過去日は対象外
    var day=kariSlotsAll[date]||{};
    Object.keys(day).forEach(function(id){
      var e=day[id];
      var st=e.status||'仮';
      if(st==='仮'){
        items.push({date:date,id:id,title:(e.case_name||'（無題）')+(e.tantou?'（'+e.tantou+'）':''),time:e.start||'',kind:'未回答',area:e.area||''});
      }else if((st==='許可'||st==='断り')&&!e.replied){
        items.push({date:date,id:id,title:(e.case_name||'（無題）')+(e.tantou?'（'+e.tantou+'）':''),time:e.start||'',kind:(st==='許可'?'許可・未送信':'断り・未送信'),area:e.area||''});
      }
    });
  });
  items.sort(function(a,b){return (a.date+(a.time||'')).localeCompare(b.date+(b.time||''));});
  return items;
}

// ---- レンダリング ----
function sectionHtml(id,icon,title,items,renderCardFn){
  var count=items.length;
  var html='<div class="section">';
  html+='<div class="section-head" onclick="toggleSection(\''+id+'\')">';
  html+='<span class="icon">'+icon+'</span><span class="title">'+title+'</span>';
  html+='<span class="count'+(count>0?' has':'')+'">'+count+'件</span>';
  html+='</div>';
  html+='<div class="section-body" id="body-'+id+'">';
  if(count===0){
    html+='<div class="empty-msg">対象なし</div>';
  }else{
    items.forEach(function(item){html+=renderCardFn(item);});
  }
  html+='</div></div>';
  return html;
}

function toggleSection(id){
  var el=document.getElementById('body-'+id);
  if(el)el.classList.toggle('collapsed');
}

function render(){
  var todayShitami=buildTodayShitami();
  var needsContact=buildNeedsContact();
  var smsUnsent=buildSmsUnsent();
  var reportMissing=buildReportMissing();
  var kariPending=buildKariPending();

  var html='';

  html+=sectionHtml('shitami','📋','本日の下見予定',todayShitami,function(item){
    return '<div class="action-card shitami" onclick="openTask(\''+escHtml(item.key)+'\')">'
      +'<div class="card-top-row">'
      +(item.time?'<span class="card-time">🕐 '+escHtml(item.time)+'</span>':'')
      +'<span class="card-title">'+escHtml(item.title)+'</span></div>'
      +'<div class="card-sub">'+(item.addr?'<span class="addr">📍'+escHtml(shortAddr(item.addr))+'</span>':'')+'</div>'
      +'</div>';
  });

  html+=sectionHtml('contact','📞','連絡必要',needsContact,function(item){
    return '<div class="action-card contact" onclick="openTask(\''+escHtml(item.key)+'\')">'
      +'<div class="card-top-row"><span class="card-title">'+escHtml(item.title)+'</span></div>'
      +'<div class="card-sub">'+(item.addr?'<span class="addr">📍'+escHtml(shortAddr(item.addr))+'</span>':'')+'</div>'
      +'</div>';
  });

  html+=sectionHtml('sms','💬','SMS未送信',smsUnsent,function(item){
    var bodyPreview=item.body.length>40?item.body.substring(0,40)+'…':item.body;
    return '<div class="action-card sms" onclick="openSmsTool()">'
      +'<div class="card-top-row"><span class="card-title">'+escHtml(item.label)+'</span></div>'
      +'<div class="card-sub">☎ '+escHtml(item.tel)+'<br>'+escHtml(bodyPreview)+'</div>'
      +'</div>';
  });

  html+=sectionHtml('report','📝','報告書未提出',reportMissing,function(item){
    return '<div class="action-card report" onclick="openTask(\''+escHtml(item.key)+'\')">'
      +'<div class="card-top-row"><span class="card-title">'+escHtml(item.title)+'</span></div>'
      +'<div class="card-sub"><span class="tag">'+escHtml(item.reason)+'</span>下見日:'+escHtml(item.shitamiDate.replace(/^\d{4}-/,''))
      +(item.addr?'　<span class="addr">📍'+escHtml(shortAddr(item.addr))+'</span>':'')+'</div>'
      +'</div>';
  });

  html+=sectionHtml('kari','🗓','仮予約：回答・送信待ち',kariPending,function(item){
    return '<div class="action-card kari" onclick="openKari(\''+escHtml(item.date)+'\',\''+escHtml(item.id)+'\')">'
      +'<div class="card-top-row">'
      +(item.time?'<span class="card-time">🕐 '+escHtml(item.time)+'</span>':'')
      +'<span class="card-title">'+escHtml(item.title)+'</span></div>'
      +'<div class="card-sub"><span class="tag">'+escHtml(item.kind)+'</span>'+escHtml(item.date)
      +(item.area?'　📍'+escHtml(item.area):'')+'</div>'
      +'</div>';
  });

  document.getElementById('mainContent').innerHTML=html;
}

// ---- アクション ----
function openTask(key){
  if(!key||!globalTasks[key])return;
  openCaseModal(key,globalTasks[key],globalHeaders,globalTasks,fullData,db,function(){loadAll();});
}
function openSmsTool(){
  location.href='sms.html';
}
function openKari(date,id){
  location.href='kari-yoyaku.html?date='+encodeURIComponent(date)+'&open='+encodeURIComponent(id);
}

// 認証セッションの復元が完了してからデータ取得する（未認証状態での即時アクセスによるpermission_denied対策）
firebase.auth().onAuthStateChanged(function(user){
  if(user){
    loadAll();
  }else{
    document.getElementById('mainContent').innerHTML='<div class="err">⚠ ログインセッションが確認できません。トップページ（index.html）から入り直してください。</div>';
  }
});
</script>
</body>
</html>
