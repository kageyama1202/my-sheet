  agenda.html（Today's Agenda）

<script>
// ==================== FIREBASE ====================
var firebaseConfig = {
  apiKey: "AIzaSyDznSykpSebsejNdQtpOgfORuzZSoW3_fs",
  authDomain: "project-6745138395263517914.firebaseapp.com",
  databaseURL: "https://project-6745138395263517914-default-rtdb.firebaseio.com",
  projectId: "project-6745138395263517914",
  storageBucket: "project-6745138395263517914.firebasestorage.app",
  messagingSenderId: "1054295910908",
  appId: "1:1054295910908:web:4072df05bd90bbdc896a79"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db = scopedDatabase(firebase.database());

// ==================== GLOBALS ====================
var globalTasks = {};
var globalHeaders = [];
var fullData = null;

// ==================== 定数 ====================
// 出発地点（札幌市白石区栄通18丁目付近の概算座標。ルート順の目安計算にのみ使用）
var HOME_POINT = { lat: 43.0430, lng: 141.3995 };

var AREA_TABLE = [
  { keys: ['千歳','恵庭','苫小牧'],           min: 55 },
  { keys: ['当別','小樽','岩見沢','北広島'],   min: 40 },
  { keys: ['江別','石狩'],                     min: 30 },
  { keys: ['手稲','南区','清田','西区'],       min: 20 },
  { keys: ['白石','厚別','豊平','東区','中央区','北区'], min: 15 }
];
var DEFAULT_TRAVEL = 20;
var STAY_MIN = 25;
var BATH_ALERT_DAYS = 21;

// 新築SK/SUピックアップ
var PICK_RED_DAYS = 14;
var PICK_MAX_DAYS = 21;

// 行動メモ：施工日がこの日数より古い案件は紐付け対象外（過去案件の同姓ヒット抑制）
var MEMO_OLD_DAYS = 60;
var MEMO_MAX_CAND = 8;
// 紐付け判定に使わない一般語（メモによく出る業務用語）
var MEMO_STOP = ['電話','連絡','確認','下見','施工','新築','現場','見積','見積り','報告','報告書','本日','明日','今日','午前','午後',
  '予定','変更','打合','打合せ','打ち合わせ','工事','日程','調整','送付','書類','図面','発注','手配','依頼','返信','訪問','再訪',
  '再訪問','完了','準備','担当','会社','客様','お客様','キッチン','バス','ユニット','リフォーム','メール','ショートメール','洗面',
  '浴室','風呂','採寸','寸法','写真','提出','期限','至急','要確認','折返','折り返し','不在','留守','留守電','施主','業者','監督'];

function getTravelMin(addr) {
  if (!addr) return DEFAULT_TRAVEL;
  for (var i = 0; i < AREA_TABLE.length; i++) {
    for (var j = 0; j < AREA_TABLE[i].keys.length; j++) {
      if (addr.indexOf(AREA_TABLE[i].keys[j]) >= 0) return AREA_TABLE[i].min;
    }
  }
  return DEFAULT_TRAVEL;
}
function trimAddr(addr) {
  if (!addr) return '';
  var a = addr.replace(/\s+/g,'').replace(/^北海道/,'').replace(/^札幌市/,'');
  var m = a.match(/^(.+?丁目)/);
  if (m) return m[1];
  var m2 = a.match(/^(.{2,8}[区市町村])/);
  if (m2) return m2[1];
  return a.slice(0,15);
}

// ==================== DATE HELPERS ====================
function todayStr() {
  return new Date(new Date().getTime() + 9*3600000).toISOString().slice(0,10);
}
function addDays(s, n) {
  var d = new Date(s + 'T00:00:00+09:00');
  d.setDate(d.getDate() + n);
  return new Date(d.getTime() + 9*3600000).toISOString().slice(0,10);
}
function wday(s) {
  return ['日','月','火','水','木','金','土'][new Date(s+'T00:00:00+09:00').getDay()];
}
function fmtMD(s) {
  if (!s) return '';
  return parseInt(s.slice(5,7)) + '/' + parseInt(s.slice(8,10));
}
function daysBetween(s1, s2) {
  var d1 = new Date(s1 + 'T00:00:00+09:00');
  var d2 = new Date(s2 + 'T00:00:00+09:00');
  return Math.round((d2 - d1) / 86400000);
}
function normalizeYMD(ds) {
  if (!ds) return '';
  var d = String(ds).replace(/\s+/g,'').replace(/\//g,'-').replace(/\./g,'-');
  var p = d.split('-');
  if (p.length === 3) return p[0]+'-'+('0'+p[1]).slice(-2)+'-'+('0'+p[2]).slice(-2);
  return d;
}
function timeToMin(t) {
  if (!t) return null;
  var p = String(t).split(':');
  if (p.length < 2) return null;
  var h = parseInt(p[0],10), m = parseInt(p[1],10);
  if (isNaN(h) || isNaN(m)) return null;
  return h*60+m;
}
function minToTime(m) {
  m = Math.round(m);
  var h = Math.floor(m/60), mm = m%60;
  if (h < 0) h = 0; if (h > 29) h = 29;
  return ('0'+h).slice(-2) + ':' + ('0'+mm).slice(-2);
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getSafeVal(cols, i) {
  if (!cols) return '';
  if (Array.isArray(cols)) return (cols.length > i && cols[i] != null) ? String(cols[i]) : '';
  return '';
}
function mapsUrl(addr) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr || '');
}

// ==================== キャッシュ読み書き（appData_+userKey 方式） ====================
function persistCache() {
  if (fullData) {
    fullData.app_tasks = globalTasks;
    try { localStorage.setItem(modalAppDataKey(), JSON.stringify(fullData)); } catch(e) {}
  }
}

// ==================== データ読込 ====================
function loadData() {
  document.getElementById('stMsg').textContent = '読み込み中...';
  setHeader();

  // ① キャッシュから即表示
  try {
    var ls = localStorage.getItem(modalAppDataKey());
    if (ls) {
      var ld = JSON.parse(ls);
      if (ld && ld.app_tasks) { globalTasks = ld.app_tasks; fullData = ld; }
      if (ld && ld.app_meta) { globalHeaders = ld.app_meta.headers || []; visitCountHeaderIdx = null; }
      renderAll();
    }
  } catch(e) {}

  // ② Firebaseから最新を取得
  Promise.all([
    db.ref('app_tasks').once('value'),
    db.ref('app_meta').once('value')
  ]).then(function(results) {
    var tasksSnap = results[0], metaSnap = results[1];
    globalTasks = tasksSnap.val() || {};
    var meta = metaSnap.val() || {};
    globalHeaders = meta.headers || globalHeaders;
    visitCountHeaderIdx = null;
    fullData = fullData || {};
    fullData.app_tasks = globalTasks;
    fullData.app_meta = meta;
    persistCache();

    var n = Object.keys(globalTasks).length;
    document.getElementById('stMsg').innerHTML = '<span class="ok">✓ ' + n + '件取得</span>';
    document.getElementById('btnCalc').disabled = false;

  });

  // ③ 行動メモ（案件データとは独立して読込。失敗しても他機能は動く）
  loadMemo();
}

var memoState = { date: '', text: '', pins: {} };
var memoSaveTimer = null;
var memoRenderTimer = null;
var memoExpanded = {};
var caseIndex = null;

function memoRefPath() { return 'app_agenda/' + memoState.date; }

function loadMemo() {
  memoState.date = todayStr();

function setMemoSt(html) { document.getElementById('memoSt').innerHTML = html; }

function onMemoInput() {

function saveMemo() {

function lineHash(s) {
  var h = 5381;
  for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
  return 'h' + (h >>> 0).toString(36);
}
function normText(s) { return String(s || '').replace(/[\s　]+/g, ''); }

var stopRe = null;
function getStopRe() {
  if (stopRe) return stopRe;
  var words = MEMO_STOP.concat(['様邸','様','邸','殿','さん']).slice().sort(function(a,b){ return b.length - a.length; });
  stopRe = new RegExp(words.map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }).join('|'), 'g');
  return stopRe;
}
// 案件名から名前トークンを抽出（「山田太郎様邸 SK」→「山田太郎」）
function nameTokensOf(title) {
  var out = [];
  String(title || '').split(/[\s　・,，、()（）\[\]【】\/／\-－_＿:：]+/).forEach(function(p) {
    var m = p.match(/^(.+?)(様|邸|殿)/);
    if (m) p = m[1];
    p = p.replace(/さん$/, '');
    if (p.length < 2) return;
    if (/^[A-Za-z0-9ｦ-ﾟ]+$/.test(p)) return;
    if (MEMO_STOP.indexOf(p) >= 0) return;
    out.push(p);
  });
  return out;
}
// メモ1行からキーワード抽出（漢字列・カタカナ列・英数字3文字以上）
function memoWords(line) {
  var out = [];
  var re = /[\u4E00-\u9FFF々〆ヵヶ]{2,}|[\u30A1-\u30FAー]{2,}|[\uFF66-\uFF9F]{2,}|[A-Za-z0-9]{3,}/g;
  var m;
  while ((m = re.exec(line)) !== null) {
    m[0].replace(getStopRe(), '|').split('|').forEach(function(w) {
      if (w.length >= 2 && out.indexOf(w) < 0) out.push(w);
    });
  }
  return out;
}
function buildCaseIndex() {
  var today = todayStr();
  var idx = [];
  Object.keys(globalTasks).forEach(function(key) {
    var obj = globalTasks[key];
    var cols = obj.csvData;
    if (!cols) return;
    var seko = normalizeYMD(getSafeVal(cols, 2));
    if (seko && /^\d{4}-\d{2}-\d{2}$/.test(seko) && daysBetween(seko, today) > MEMO_OLD_DAYS) return;
    var title = getSafeVal(cols, 4).trim();
    idx.push({
      key: key,
      title: title || key,
      titleN: normText(title),
      addrN: normText(getSafeVal(cols, 11)),
      addr: getSafeVal(cols, 11),
      hid: normText(getSafeVal(cols, 0)),
      nameTokens: nameTokensOf(title),
      seko: seko
    });
  });
  caseIndex = idx;
  return idx;
}
// 1行に対する候補案件をスコア順で返す
function matchLine(line) {
  var idx = caseIndex || buildCaseIndex();
  var lineN = normText(line);
  var words = memoWords(line);
  var hits = [];
  idx.forEach(function(c) {
    var score = 0;
    c.nameTokens.forEach(function(t) { if (lineN.indexOf(t) >= 0) score += 4; });
    words.forEach(function(w) {
      if ((c.hid && w === c.hid) || w === c.key) score += 10;
      else if (c.titleN.indexOf(w) >= 0) score += 3;
      else if (c.addrN.indexOf(w) >= 0) score += 1;
    });
    if (score > 0) hits.push({ c: c, score: score });
  });
  hits.sort(function(a,b){ return b.score - a.score || (a.c.seko || '9').localeCompare(b.c.seko || '9'); });
  return hits;
}

function chipOpen(key, cls, icon, title, withX, hash) {
  var h = '<span class="chip ' + cls + '" onclick="openModal(\'' + esc(key) + '\')">' + icon + '<span class="t">' + esc(title) + '</span>';
  if (withX) h += '<button class="chip-x" title="紐付け解除" onclick="event.stopPropagation();unpinLine(\'' + hash + '\')">✕</button>';
  h += '</span>';
  return h;
}
function chipCand(key, title, hash) {
  return '<span class="chip chip-cand" onclick="pinLine(\'' + hash + '\',\'' + esc(key) + '\')">＋<span class="t">' + esc(title) + '</span></span>';
}

function renderMemoLinks() {
  var wrap = document.getElementById('memoLinks');
  var lines = (memoState.text || '').split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
  if (!lines.length) {
    wrap.innerHTML = '';
    document.getElementById('memoCnt').textContent = '0行';
    return;
  }
  if (!Object.keys(globalTasks).length) {
    wrap.innerHTML = '<div class="section-empty">案件データ読込後に紐付けを表示します</div>';
    return;
  }
  var linked = 0;
  var html = '';
  lines.forEach(function(line) {
    var hash = lineHash(line);
    var pinKey = memoState.pins[hash];
    html += '<div class="mline"><div class="mline-text">' + esc(line) + '</div><div class="mline-links">';

    if (pinKey && globalTasks[pinKey]) {
      var pt = getSafeVal(globalTasks[pinKey].csvData, 4).trim() || pinKey;
      html += chipOpen(pinKey, 'chip-pin', '📌', pt, true, hash);
      linked++;
    } else {
      var hits = matchLine(line);
      if (!hits.length) {
        html += '<span class="mline-none">紐付けなし</span>';
      } else {
        var top = hits[0].score;
        var tops = hits.filter(function(h){ return h.score === top; });
        var auto = (tops.length === 1 && top >= 3) ? tops[0].c : null;
        if (auto && !memoExpanded[hash]) {
          html += chipOpen(auto.key, 'chip-auto', '🔗', auto.title, false, hash);
          linked++;
          if (hits.length > 1) html += '<button class="chip-more" onclick="toggleCand(\'' + hash + '\')">他候補' + (hits.length - 1) + '件</button>';
          else html += '<button class="chip-more" onclick="pinLine(\'' + hash + '\',\'' + esc(auto.key) + '\')">📌確定</button>';
        } else {
          if (auto) {
            html += chipOpen(auto.key, 'chip-auto', '🔗', auto.title, false, hash);
            linked++;
          }
          html += '<span class="mline-lbl">候補から選択：</span>';
          hits.slice(0, MEMO_MAX_CAND).forEach(function(h) {
            if (auto && h.c.key === auto.key) {
              html += '<button class="chip-more" onclick="pinLine(\'' + hash + '\',\'' + esc(auto.key) + '\')">📌この案件で確定</button>';
              return;
            }
            html += chipCand(h.c.key, h.c.title, hash);
          });
          if (hits.length > MEMO_MAX_CAND) html += '<span class="mline-none">他' + (hits.length - MEMO_MAX_CAND) + '件（語を足して絞込）</span>';
          if (auto) html += '<button class="chip-more" onclick="toggleCand(\'' + hash + '\')">閉じる</button>';
        }
      }
    }
    html += '</div></div>';
  });
  wrap.innerHTML = html;
  document.getElementById('memoCnt').textContent = linked + '/' + lines.length + '行 紐付';
}
function toggleCand(hash) {
  memoExpanded[hash] = !memoExpanded[hash];
  renderMemoLinks();
}
function pinLine(hash, key) {
  memoState.pins[hash] = key;
  memoExpanded[hash] = false;
  renderMemoLinks();
  db.ref(memoRefPath() + '/pins/' + hash).set(key).catch(function(e) { alert('紐付け保存失敗：' + e.message); });
}
function unpinLine(hash) {
  delete memoState.pins[hash];
  renderMemoLinks();
  db.ref(memoRefPath() + '/pins/' + hash).remove().catch(function(e) { alert('紐付け解除失敗：' + e.message); });
}

// ==================== B) 新築SK・SU 下見ピックアップ ====================
// 対象：工事区分(cols[3])にSKまたはSUを含み、リフォーム(ﾘ/リ)でない＝新築、
// 施工日(cols[2])が今日〜21日後、shitamiVisitedが立っていない案件。
// 状態：再訪問必要(shitamiRevisit) / 下見日未定 / 予定日経過・未実施 → 要行動、下見日確定(未来日) → 折りたたみ
var pickFoldOpen = false;
function isShinchiku(kubun) { return kubun.indexOf('ﾘ') === -1 && kubun.indexOf('リ') === -1; }

function renderPickup() {
  var today = todayStr();
  var action = [], fixed = [];
  Object.keys(globalTasks).forEach(function(key) {
    var obj = globalTasks[key];
    var cols = obj.csvData;
    if (!cols) return;
    var kubun = getSafeVal(cols, 3);
    if (kubun.indexOf('SK') === -1 && kubun.indexOf('SU') === -1) return;
    if (!isShinchiku(kubun)) return;
    var seko = normalizeYMD(getSafeVal(cols, 2));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(seko)) return;
    var diff = daysBetween(today, seko);
    if (diff < 0 || diff > PICK_MAX_DAYS) return;
    if (obj.shitamiVisited) return;

    var eff = getEffectiveShitamiDate(obj);
    var state;
    if (obj.shitamiRevisit && !(eff && eff.date >= today)) state = 'revisit';
    else if (eff && eff.date >= today) state = 'fixed';
    else if (eff) state = 'past';
    else state = 'none';

    var it = { key: key, obj: obj, cols: cols, kubun: kubun, seko: seko, diff: diff, eff: eff, state: state };
    if (state === 'fixed') fixed.push(it); else action.push(it);
  });
  var byDiff = function(a,b){ return a.diff - b.diff; };
  action.sort(byDiff); fixed.sort(byDiff);

  document.getElementById('pickCnt').textContent = '要行動 ' + action.length + ' / 確定 ' + fixed.length;
  var body = document.getElementById('pickBody');
  if (!action.length && !fixed.length) {
    body.innerHTML = '<div class="section-empty">🎉 21日以内の新築SK・SUはすべて下見完了です</div>';
    return;
  }
  var html = '';
  if (!action.length) {
    html += '<div class="section-empty">✅ 要行動なし（下見日はすべて確定済み）</div>';
  } else {
    action.forEach(function(it) { html += pickCard(it, true); });
  }
  if (fixed.length) {
    html += '<button class="fold-toggle" onclick="togglePickFold()">' + (pickFoldOpen ? '▾' : '▸') + ' 下見日確定済み・未実施 ' + fixed.length + '件</button>';
    if (pickFoldOpen) {
      html += '<div class="fold-body">';
      fixed.forEach(function(it) { html += pickCard(it, false); });
      html += '</div>';
    }
  }
  body.innerHTML = html;
}
function togglePickFold() { pickFoldOpen = !pickFoldOpen; renderPickup(); }

function pickCard(it, withBtn) {
  var title = getSafeVal(it.cols, 4).trim() || it.key;
  var addr = getSafeVal(it.cols, 11);
  var tier = it.diff <= PICK_RED_DAYS ? 'tier-r' : 'tier-y';
  var stHtml;
  if (it.state === 'revisit') stHtml = '<span class="st st-revisit">🔁再訪問必要</span>';
  else if (it.state === 'past') stHtml = '<span class="st st-past">⚠予定' + fmtMD(it.eff.date) + '経過・未実施</span>';
  else if (it.state === 'fixed') stHtml = '<span class="st st-fixed">📅下見 ' + fmtMD(it.eff.date) + '(' + wday(it.eff.date) + ')' + (it.eff.time ? ' ' + esc(it.eff.time) : '') + '</span>';
  else stHtml = '<span class="st st-none">下見日未定</span>';
  var kb = it.kubun.indexOf('SK') >= 0 ? 'SK' : 'SU';

  var h = '<div class="pcard ' + tier + '">';
  h += '<div class="pcard-days"><div class="n">' + (it.diff === 0 ? '今日' : it.diff) + '</div><div class="u">' + (it.diff === 0 ? '施工' : '日後施工') + '</div></div>';
  h += '<div class="pcard-main" onclick="openModal(\'' + esc(it.key) + '\')">';
  h += '<div style="margin-bottom:3px;"><span class="st st-kubun">' + kb + '</span>' + stHtml + '</div>';
  h += '<div class="acard-title">' + esc(title) + '</div>';
  h += '<div class="acard-sub"><span>🔨施工 ' + fmtMD(it.seko) + '(' + wday(it.seko) + ')</span>';
  if (addr) h += '<span class="area">📍' + esc(trimAddr(addr)) + '</span>';
  h += '</div></div>';
  if (withBtn) h += '<button class="btn-decide" onclick="openModal(\'' + esc(it.key) + '\')">📅 下見日を決める</button>';
  h += '</div>';
  return h;
}

// CSV下見日はSF取込データのためアプリからはクリアしない。クリアするのはアプリ入力のobj.date/timeのみ。
function buildStamp() {
  var d = new Date();
  return d.getFullYear() + '/' + ('0'+(d.getMonth()+1)).slice(-2) + '/' + ('0'+d.getDate()).slice(-2)
    + ' ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
}
function afterVisitChange() {
  renderVisitChecks();
  renderPickup();
  updateRouteAvailability();
}
function clearScheduleWithMemo(key, label, extra) {
  var obj = globalTasks[key];
  if (!obj) return;
  var stamp = buildStamp();
  var eff = getEffectiveShitamiDate(obj);
  var prevDate = eff ? eff.date : (obj.date || '未設定');
  var prevTime = eff ? eff.time : (obj.time || '');
  var srcTag = (eff && eff.source === 'csv') ? '[CSV下見日]' : '[アプリ入力日]';
  var csvNote = (eff && eff.source === 'csv') ? '（CSV下見日はSF側の更新が必要）' : '';
  var noteLine = '【' + label + ' ' + stamp + '】予定日時' + srcTag + ' ' + prevDate + (prevTime ? ' ' + prevTime : '') + ' → クリア' + csvNote;
  var newMemo = (obj.memo ? obj.memo + '\n\n' : '') + noteLine;
  var updates = { date: '', time: '', order: '', memo: newMemo };
  if (extra) for (var ek in extra) updates[ek] = extra[ek];

  db.ref('app_tasks/'+key).update(updates).then(function() {
    for (var k in updates) obj[k] = updates[k];
    persistCache();
    afterVisitChange();
  }).catch(function(e) { alert('更新失敗：' + e.message); });
}
function markVisited(key) {
  var obj = globalTasks[key];
  if (!obj) return;
  var nowIso = new Date().toISOString();
  db.ref('app_tasks/'+key).update({ shitamiVisited: true, shitamiVisitedAt: nowIso, shitamiRevisit: null }).then(function() {
    obj.shitamiVisited = true;
    obj.shitamiVisitedAt = nowIso;
    delete obj.shitamiRevisit;
    persistCache();
    afterVisitChange();
  }).catch(function(e) { alert('更新失敗：' + e.message); });
}
function markRevisitNeeded(key) {
  var obj = globalTasks[key];
  if (!obj) return;
  var cols = obj.csvData;
  var title = getSafeVal(cols, 4).trim() || key;
  if (!confirm('「' + title + '」は現地には行ったが「再訪問が必要」として記録します。\n予定日時をクリアします。よろしいですか？')) return;
  clearScheduleWithMemo(key, '再訪問必要', { shitamiRevisit: true });
}
function markNotVisited(key) {
  var obj = globalTasks[key];
  if (!obj) return;
  var cols = obj.csvData;
  var title = getSafeVal(cols, 4).trim() || key;
  if (!confirm('「' + title + '」を「行けなかった」として記録します。\n予定日時をクリアします。よろしいですか？')) return;
  clearScheduleWithMemo(key, '下見未実施');
}

// ==================== ③ 本日のコース設定 ====================
function getUsableGeo(obj) {
  var g = obj.geocode;
  if (!g || g.lat == null || g.lng == null) return null;
  if (g.confidence === 'low' || g.confidence === 'fail') return null;
  return { lat: g.lat, lng: g.lng };
}
function haversineKm(lat1,lng1,lat2,lng2) {
  var R = 6371;
  var dLat = (lat2-lat1) * Math.PI/180;
  var dLng = (lng2-lng1) * Math.PI/180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}
function travelMinBetween(fromPt, toObj) {
  var toGeo = getUsableGeo(toObj);
  if (fromPt && toGeo) {
    var km = haversineKm(fromPt.lat, fromPt.lng, toGeo.lat, toGeo.lng);
    var roadKm = km * 1.3;
    var min = Math.round(roadKm / 25 * 60);
    return Math.max(5, min);
  }
  var addr = getSafeVal(toObj.csvData, 11);
  return getTravelMin(addr);
}

function buildTodayCases() {
  var today = todayStr();
  var list = [];
  Object.keys(globalTasks).forEach(function(key) {
    var obj = globalTasks[key];
    if (obj.date !== today) return;
    var cols = obj.csvData;
    var geo = getUsableGeo(obj);
    list.push({
      key: key,
      obj: obj,
      title: getSafeVal(cols, 4).trim() || key,
      addr: getSafeVal(cols, 11),
      kubun: getSafeVal(cols, 3),
      fixedTime: obj.time || null,
      hasGeo: !!geo,
      lat: geo ? geo.lat : null,
      lng: geo ? geo.lng : null,
      stayMin: STAY_MIN,
      visited: !!obj.shitamiVisited
    });
  });
  return list;
}

function planTodayRoute(items) {
  var fixed = items.filter(function(it){ return !!it.fixedTime; })
                    .sort(function(a,b){ return a.fixedTime.localeCompare(b.fixedTime); });
  var free = items.filter(function(it){ return !it.fixedTime; });

  var route = [{ virtual: true, point: HOME_POINT }].concat(fixed);

  function ptOf(node) {
    if (node.virtual) return node.point;
    if (node.hasGeo) return { lat: node.lat, lng: node.lng };
    return null;
  }
  function roughKm(fromNode, toNode) {
    var p1 = ptOf(fromNode), p2 = ptOf(toNode);
    if (p1 && p2) return haversineKm(p1.lat, p1.lng, p2.lat, p2.lng);
    var addr = toNode.virtual ? '' : toNode.addr;
    return getTravelMin(addr) / 60 * 25;
  }

  free.forEach(function(cand) {
    var bestIdx = route.length, bestCost = Infinity;
    for (var i = 1; i <= route.length; i++) {
      var prev = route[i-1];
      var next = (i < route.length) ? route[i] : null;
      var dPrevCand = roughKm(prev, cand);
      var cost;
      if (next) {
        var dCandNext = roughKm(cand, next);
        var dPrevNext = roughKm(prev, next);
        cost = dPrevCand + dCandNext - dPrevNext;
      } else {
        cost = dPrevCand;
      }
      if (cost < bestCost) { bestCost = cost; bestIdx = i; }
    }
    route.splice(bestIdx, 0, cand);
  });

  return route.filter(function(r){ return !r.virtual; });
}

function simulateTimeline(route) {
  var startMin = 8*60+30;
  if (route.length && route[0].fixedTime) {
    var ft = timeToMin(route[0].fixedTime);
    if (ft != null && ft < startMin) startMin = ft;
  }
  var curTime = startMin;
  var curPt = HOME_POINT;
  var result = [];
  route.forEach(function(item) {
    var fromPt = curPt;
    var travel = travelMinBetween(fromPt, item.obj);
    var arrive = curTime + travel;
    var warn = '';
    if (item.fixedTime) {
      var ft = timeToMin(item.fixedTime);
      if (ft != null) {
        if (arrive > ft + 5) warn = '⏰予定(' + item.fixedTime + ')より遅れる可能性';
        arrive = ft;
      }
    }
    var leave = arrive + item.stayMin;
    result.push({ item: item, travel: travel, arrive: arrive, leave: leave, warn: warn });
    curTime = leave;
    if (item.hasGeo) curPt = { lat: item.lat, lng: item.lng };
  });
  return result;
}

var currentRoute = null;

function calcRoute() {
  var items = buildTodayCases();
  document.getElementById('routeCnt').textContent = items.length + '件';
  if (items.length === 0) {
    document.getElementById('routeBody').innerHTML = '<div class="section-empty">本日(obj.date=今日)の予定案件がありません</div>';
    document.getElementById('routeSummaryWrap').innerHTML = '';
    document.getElementById('btnSaveOrder').disabled = true;
    return;
  }
  var route = planTodayRoute(items);
  var timeline = simulateTimeline(route);
  currentRoute = timeline;
  renderRoute(timeline);
  document.getElementById('btnSaveOrder').disabled = false;
}

function renderRoute(timeline) {
  var totalMin = 0;
  timeline.forEach(function(r){ totalMin += r.travel + r.item.stayMin; });
  var endTime = timeline.length ? minToTime(timeline[timeline.length-1].leave) : '-';
  document.getElementById('routeSummaryWrap').innerHTML =
    '<div class="route-summary">' +
    '<div><label>件数 </label><span>' + timeline.length + '件</span></div>' +
    '<div><label>合計(移動+滞在) </label><span>' + totalMin + '分</span></div>' +
    '<div><label>終了予定 </label><span>' + endTime + '</span></div>' +
    '</div>';

  var html = '';
  timeline.forEach(function(r, i) {
    var item = r.item;
    var isReform = item.kubun.indexOf('ﾘ') >= 0;
    var badges = isReform ? '<span class="badge badge-reform">ﾘ リフォーム</span>' : '<span class="badge badge-new">新 新築</span>';
    badges += item.fixedTime ? '<span class="badge badge-fixed">🔒 時間固定</span>' : '<span class="badge badge-est">✦ 提案順</span>';
    if (item.visited) badges += '<span class="badge badge-est" style="background:#1b3a2e;color:#6ee7b7;">✅ 完了</span>';

    html += '<div class="rcard' + (item.visited ? ' rcard-done' : '') + '">';
    html += '<div class="rcard-num">' + (i+1) + '</div>';
    html += '<div class="rcard-times">';
    html += '<div class="t-arrive">' + minToTime(r.arrive) + '</div>';
    html += '<div class="t-leave">〜' + minToTime(r.leave) + '</div>';
    html += '<div class="t-travel">移' + r.travel + '分</div>';
    html += '</div>';
    html += '<div class="rcard-body" onclick="openModal(\''+esc(item.key)+'\')">';
    html += '<div style="margin-bottom:3px;">' + badges + '</div>';
    html += '<div class="rcard-title">' + esc(item.title) + '</div>';
    html += '<div class="rcard-sub">';
    if (item.addr) html += '<span class="area">📍' + esc(trimAddr(item.addr)) + '</span>';
    if (item.fixedTime) html += '<span class="lock">⏰' + esc(item.fixedTime) + '</span>';
    if (r.warn) html += '<span class="warn">' + esc(r.warn) + '</span>';
    html += '</div></div>';
    if (item.addr) html += '<a class="btn-map" href="' + mapsUrl(item.addr) + '" target="_blank" rel="noopener">🗺 MAP</a>';
    html += '</div>';
  });
  document.getElementById('routeBody').innerHTML = html;
}

function saveRouteOrder() {
  if (!currentRoute || !currentRoute.length) return;
  var btn = document.getElementById('btnSaveOrder');
  btn.disabled = true;
  btn.textContent = '保存中...';

  var updates = {};
  currentRoute.forEach(function(r, i) {
    updates['app_tasks/' + r.item.key + '/order'] = i + 1;
  });

  db.ref().update(updates).then(function() {
    currentRoute.forEach(function(r, i) {
      globalTasks[r.item.key].order = i + 1;
    });
    persistCache();
    btn.textContent = '💾 順番を保存';
    btn.disabled = false;
    alert('順番を保存しました（' + currentRoute.length + '件）');
  }).catch(function(e) {
    btn.textContent = '💾 順番を保存';
    btn.disabled = false;
    alert('保存失敗：' + e.message);
  });
}

function updateRouteAvailability() {
  var today = todayStr();
  var n = 0;
  Object.keys(globalTasks).forEach(function(key) {
    if (globalTasks[key].date === today) n++;
  });
  document.getElementById('routeCnt').textContent = n + '件';
}
