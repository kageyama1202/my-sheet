<!--
  agenda.html（Today's Agenda）全面改修版
  旧内容（Claude API連携の3日間プラン生成）は不安定化・未使用だったため全廃。
  代わりに以下3機能をAI呼び出しなしのローカル計算のみで実装：
   1) 下見実施チェック：過去の下見予定について「実際に行けたか」を毎朝確認する
   2) 本日のコース設定：本日予定の案件を、座標(あれば直線距離)＋エリア表(なければ)で
      簡易ルート計算し、順番・到着予定時刻を提案する
   3) お風呂(SB)21日アラート：施工日が21日以内に迫っているのに下見未実施のSB案件を警告
-->
<html lang="ja">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic Pro','Meiryo',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;}

.header{background:#111827;border-bottom:2px solid #1e40af;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
.header a{color:#60a5fa;text-decoration:none;font-size:13px;font-weight:bold;}
.header-title{font-size:15px;font-weight:bold;color:#e2e8f0;flex:1;}
.header-date{font-size:11px;color:#94a3b8;background:#1e293b;padding:3px 10px;border-radius:10px;}
.btn-refresh{background:rgba(255,255,255,0.1);color:#94a3b8;border:none;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;}
.btn-refresh:hover{background:rgba(255,255,255,0.2);}

.status-bar{background:#0d1117;border-bottom:1px solid #1f2937;padding:7px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11px;color:#64748b;position:sticky;top:45px;z-index:99;}
.ok{color:#34d399;}.warn{color:#f59e0b;}.err{color:#f87171;}

.section{margin:14px 14px 0;}
.section-card{background:#111827;border:1px solid #1f2937;border-radius:10px;overflow:hidden;}
.section-head{padding:10px 16px;font-size:13px;font-weight:bold;display:flex;align-items:center;gap:8px;}
.section-head .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,0.1);padding:2px 9px;border-radius:10px;font-weight:normal;}
.section-head.bath{background:#3b1d1d;border-bottom:2px solid #ef4444;color:#fca5a5;}
.section-head.visit{background:#1e293b;border-bottom:2px solid #f59e0b;color:#fde68a;}
.section-head.route{background:#1e3a5f;border-bottom:2px solid #3b82f6;color:#bfdbfe;}
.section-body{padding:2px 0;}
.section-empty{padding:16px;font-size:12px;color:#4b5563;text-align:center;}

.acard{padding:10px 16px;border-bottom:1px solid #1a2234;display:flex;align-items:center;gap:10px;}
.acard:last-child{border-bottom:none;}
.acard-main{flex:1;min-width:0;cursor:pointer;}
.acard-main:hover .acard-title{color:#60a5fa;text-decoration:underline;}
.acard-title{font-size:13px;font-weight:bold;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acard-sub{font-size:11px;color:#64748b;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
.acard-sub .area{color:#34d399;}
.acard-sub .daysleft{color:#fca5a5;font-weight:bold;}
.acard-sub .lock{color:#fbbf24;}
.acard-btns{display:flex;gap:6px;flex-shrink:0;}
.abtn{border:none;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer;white-space:nowrap;}
.abtn-yes{background:#1b5e20;color:#a5d6a7;border:1px solid #2e7d32;}
.abtn-yes:hover{background:#256029;}
.abtn-no{background:#4a1414;color:#fca5a5;border:1px solid #c62828;}
.abtn-no:hover{background:#5c1a1a;}

.route-toolbar{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #1f2937;}
.btn-calc{background:#1d4ed8;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;}
.btn-calc:hover{background:#2563eb;}
.btn-calc:disabled{background:#374151;color:#6b7280;cursor:not-allowed;}
.btn-save-order{background:#065f46;color:#6ee7b7;border:none;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;}
.btn-save-order:hover{background:#047857;}
.btn-save-order:disabled{background:#374151;color:#6b7280;cursor:not-allowed;}
.route-note{font-size:11px;color:#64748b;flex:1;}

.route-summary{margin:10px 16px 0;background:#0d1117;border:1px solid #1e40af;border-radius:8px;padding:8px 14px;font-size:12px;display:flex;gap:16px;flex-wrap:wrap;}
.route-summary span{color:#60a5fa;font-weight:bold;}
.route-summary label{color:#64748b;}

.rcard{display:flex;align-items:stretch;min-height:56px;border-bottom:1px solid #1a2234;}
.rcard:last-child{border-bottom:none;}
.rcard-num{width:32px;min-width:32px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;color:#60a5fa;background:#0d1117;}
.rcard-times{width:58px;min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;border-right:1px solid #1f2937;}
.t-arrive{font-size:11px;font-weight:bold;color:#fbbf24;}
.t-leave{font-size:10px;color:#64748b;}
.t-travel{font-size:9px;color:#475569;margin-top:2px;}
.rcard-body{flex:1;padding:7px 8px 7px 10px;min-width:0;cursor:pointer;}
.rcard-body:hover .rcard-title{color:#60a5fa;text-decoration:underline;}
.rcard-title{font-size:13px;font-weight:bold;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rcard-sub{font-size:11px;color:#64748b;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px;}
.rcard-sub .area{color:#34d399;}
.rcard-sub .lock{color:#fbbf24;}
.rcard-sub .warn{color:#f87171;}
.badge{display:inline-block;font-size:10px;font-weight:bold;padding:1px 5px;border-radius:3px;white-space:nowrap;}
.badge-reform{background:#1e3a5f;color:#93c5fd;}
.badge-new{background:#2d2a1a;color:#fbbf24;}
.badge-fixed{background:#78350f;color:#fde68a;}
.badge-est{background:#1a2e1a;color:#86efac;}
.btn-map{flex-shrink:0;align-self:center;margin:0 10px;background:#065f46;color:#6ee7b7;border:none;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:3px;}
.btn-map:hover{background:#047857;}

.bottom-pad{height:40px;}
</style>
</head>
<body>

<div id="modal-overlay"><div id="modal-content"><button id="modal-close">✖ 閉じる</button><div id="modal-body"></div></div></div>

<div class="header">
  <a href="index.html">◀ トップ</a>
  <div class="header-title">📅 Today's Agenda</div>
  <div class="header-date" id="headerDate">-</div>
  <button class="btn-refresh" onclick="loadData()">🔄 更新</button>
</div>

<div class="status-bar">

</div>

<!-- ① お風呂21日アラート -->
<div class="section">
  <div class="section-card">
    <div class="section-head bath">🛁 お風呂・施工日接近アラート<span class="cnt" id="bathCnt">-</span></div>

</div>

<!-- ② 下見実施チェック -->
<div class="section">
  <div class="section-card">

</div>

<!-- ③ 本日のコース設定 -->
<div class="section">
  <div class="section-card">
    <div class="section-head route">🧭 本日のコース設定<span class="cnt" id="routeCnt">-</span></div>
    <div class="route-toolbar">
      <button class="btn-calc" id="btnCalc" onclick="calcRoute()" disabled>🧭 コース計算</button>
      <button class="btn-save-order" id="btnSaveOrder" onclick="saveRouteOrder()" disabled>💾 順番を保存</button>
      <span class="route-note" id="routeNote">データ取得中...</span>

    <div id="routeSummaryWrap"></div>

  </div>
</div>

<script>
// ==================== FIREBASE ====================
var firebaseConfig = {
  apiKey: "AIzaSyDznSykpSebsejNdQtpOgfORuzZSoW3_fs",
  authDomain: "project-6745138395263517914.firebaseapp.com",
  databaseURL: "https://project-6745138395263517914-default-rtdb.firebaseio.com",
  projectId: "project-6745138395263517914",
  storageBucket: "project-6745138395263517914.firebasestorage.app",
  messagingSenderId: "1054295910908",
  appId: "1:1054295910908:web:4072df05bd90bbdc896a79"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db = scopedDatabase(firebase.database());

// ==================== GLOBALS ====================
var globalTasks = {};
var globalHeaders = [];
var fullData = null;

// ==================== 定数 ====================
// 出発地点（札幌市白石区栄通18丁目付近の概算座標。誤差は数百m程度で、
// ルート順の目安計算にのみ使用するため厳密な番地座標でなくてよい）
var HOME_POINT = { lat: 43.0430, lng: 141.3995 };

var AREA_TABLE = [
  { keys: ['千歳','恵庭','苫小牧'],           min: 55 },
  { keys: ['当別','小樽','岩見沢','北広島'],   min: 40 },
  { keys: ['江別','石狩'],                     min: 30 },
  { keys: ['手稲','南区','清田','西区'],       min: 20 },
  { keys: ['白石','厚別','豊平','東区','中央区','北区'], min: 15 }
];
var DEFAULT_TRAVEL = 20;
var STAY_MIN = 25;
var BATH_ALERT_DAYS = 21;

function getTravelMin(addr) {
  if (!addr) return DEFAULT_TRAVEL;
  for (var i = 0; i < AREA_TABLE.length; i++) {
    for (var j = 0; j < AREA_TABLE[i].keys.length; j++) {
      if (addr.indexOf(AREA_TABLE[i].keys[j]) >= 0) return AREA_TABLE[i].min;
    }
  }
  return DEFAULT_TRAVEL;
}
function trimAddr(addr) {
  if (!addr) return '';
  var a = addr.replace(/\s+/g,'').replace(/^北海道/,'').replace(/^札幌市/,'');
  var m = a.match(/^(.+?丁目)/);
  if (m) return m[1];
  var m2 = a.match(/^(.{2,8}[区市町村])/);
  if (m2) return m2[1];
  return a.slice(0,15);
}

// ==================== DATE HELPERS ====================
function todayStr() {
  return new Date(new Date().getTime() + 9*3600000).toISOString().slice(0,10);
}
function addDays(s, n) {
  var d = new Date(s + 'T00:00:00+09:00');
  d.setDate(d.getDate() + n);
  return new Date(d.getTime() + 9*3600000).toISOString().slice(0,10);
}
function wday(s) {
  return ['日','月','火','水','木','金','土'][new Date(s+'T00:00:00+09:00').getDay()];
}
function fmtMD(s) {
  if (!s) return '';
  return parseInt(s.slice(5,7)) + '/' + parseInt(s.slice(8,10));
}
function daysBetween(s1, s2) {
  var d1 = new Date(s1 + 'T00:00:00+09:00');
  var d2 = new Date(s2 + 'T00:00:00+09:00');
  return Math.round((d2 - d1) / 86400000);
}
function normalizeYMD(ds) {
  if (!ds) return '';
  var d = String(ds).replace(/\s+/g,'').replace(/\//g,'-').replace(/\./g,'-');
  var p = d.split('-');
  if (p.length === 3) return p[0]+'-'+('0'+p[1]).slice(-2)+'-'+('0'+p[2]).slice(-2);
  return d;
}
function timeToMin(t) {
  if (!t) return null;
  var p = String(t).split(':');
  if (p.length < 2) return null;
  var h = parseInt(p[0],10), m = parseInt(p[1],10);
  if (isNaN(h) || isNaN(m)) return null;
  return h*60+m;
}
function minToTime(m) {
  m = Math.round(m);
  var h = Math.floor(m/60), mm = m%60;
  if (h < 0) h = 0; if (h > 29) h = 29;
  return ('0'+h).slice(-2) + ':' + ('0'+mm).slice(-2);
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getSafeVal(cols, i) {
  if (!cols) return '';
  if (Array.isArray(cols)) return (cols.length > i && cols[i] != null) ? String(cols[i]) : '';
  return '';
}
function mapsUrl(addr) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr || '');
}

// ==================== キャッシュ読み書き（他ページと同じ appData_+userKey 方式） ====================
function persistCache() {
  if (fullData) {
    fullData.app_tasks = globalTasks;
    try { localStorage.setItem(modalAppDataKey(), JSON.stringify(fullData)); } catch(e) {}
  }
}

// ==================== データ読込 ====================
function loadData() {
  document.getElementById('stMsg').textContent = '読み込み中...';
  setHeader();

  // ① まずキャッシュから即表示（他ページ同様、index.html訪問済みなら鮮度が高い）
  try {
    var ls = localStorage.getItem(modalAppDataKey());
    if (ls) {
      var ld = JSON.parse(ls);
      if (ld && ld.app_tasks) { globalTasks = ld.app_tasks; fullData = ld; }
      if (ld && ld.app_meta) { globalHeaders = ld.app_meta.headers || []; visitCountHeaderIdx = null; }
      renderAll();
    }
  } catch(e) {}

  // ② Firebaseから最新のapp_tasks/app_metaを取得して上書き（毎朝の確認用ページなので鮮度優先）
  Promise.all([
    db.ref('app_tasks').once('value'),
    db.ref('app_meta').once('value')
  ]).then(function(results) {
    var tasksSnap = results[0], metaSnap = results[1];
    globalTasks = tasksSnap.val() || {};
    var meta = metaSnap.val() || {};
    globalHeaders = meta.headers || globalHeaders;
    visitCountHeaderIdx = null;
    fullData = fullData || {};
    fullData.app_tasks = globalTasks;
    fullData.app_meta = meta;
    persistCache();

    var n = Object.keys(globalTasks).length;
    document.getElementById('stMsg').innerHTML = '<span class="ok">✓ ' + n + '件取得</span>';
    document.getElementById('btnCalc').disabled = false;
    document.getElementById('routeNote').textContent = '本日予定の案件が対象です';
    renderAll();
  }).catch(function(e) {
    document.getElementById('stMsg').innerHTML = '<span class="err">❌ ' + esc(e.message) + '</span>';
  });
}

function setHeader() {
  var t = todayStr();
  document.getElementById('headerDate').textContent = fmtMD(t)+'('+wday(t)+')';
}

function renderAll() {
  autoSyncVisitedFromReportCount();
  renderBathAlerts();
  renderVisitChecks();
  updateRouteAvailability();
}

// ==================== 下見本数(予/実)による自動確認 ====================
// SF側レポートの「下見本数（予/実）」列（実施数=実 が1以上）が入っていれば、
// 「実際に行った」ことがほぼ確実なため、本人に確認させるまでもなく自動でshitamiVisitedを立てる。
// 列位置は固定インデックスではなく、ヘッダー名「下見本数」を含む列を都度検索する
// （CSV列構成が将来変わっても壊れにくくするため）。
var visitCountHeaderIdx = null;
function findHeaderIndex(nameSubstr) {
  for (var i = 0; i < globalHeaders.length; i++) {
    if (globalHeaders[i] && String(globalHeaders[i]).indexOf(nameSubstr) >= 0) return i;
  }
  return -1;
}
function getVisitActualCount(cols) {
  if (visitCountHeaderIdx == null) visitCountHeaderIdx = findHeaderIndex('下見本数');
  if (visitCountHeaderIdx < 0) return null;
  var raw = getSafeVal(cols, visitCountHeaderIdx);
  if (!raw) return null;
  var m = String(raw).replace(/\s+/g,'').match(/^(\d+)\s*\/\s*(\d+)$/);
  if (!m) return null;
  return parseInt(m[2], 10);
}
function autoSyncVisitedFromReportCount() {
  var updates = {};
  var nowIso = new Date().toISOString();
  Object.keys(globalTasks).forEach(function(key) {
    var obj = globalTasks[key];
    if (obj.shitamiVisited) return;
    var actual = getVisitActualCount(obj.csvData);
    if (actual != null && actual > 0) {
      updates['app_tasks/'+key+'/shitamiVisited'] = true;
      updates['app_tasks/'+key+'/shitamiVisitedAt'] = nowIso;
      updates['app_tasks/'+key+'/shitamiVisitedSource'] = 'report_count';
      obj.shitamiVisited = true;
      obj.shitamiVisitedAt = nowIso;
      obj.shitamiVisitedSource = 'report_count';
    }
  });
  if (Object.keys(updates).length) {
    db.ref().update(updates).catch(function(e) { console.warn('自動確認の同期に失敗：', e); });
    persistCache();
  }
}

function openModal(key) {
  if (!globalTasks[key]) return;
  openCaseModal(key, globalTasks[key], globalHeaders, globalTasks, fullData, db, function() { renderAll(); });
}

// ==================== ① お風呂21日アラート ====================
// 対象：工事区分名(C3列=cols[3])に「SB」を含み、施工日(C2列=cols[2])が
// 今日から21日以内、かつ shitamiVisited フラグが立っていない案件。
// 「下見日が入力済みか」ではなく「実際に行けたか(shitamiVisited)」で判定する
// ＝日程だけ入って現地訪問できていないケースを拾うのが目的。
function renderBathAlerts() {
  var today = todayStr();
  var list = [];
  Object.keys(globalTasks).forEach(function(key) {
    var obj = globalTasks[key];
    var cols = obj.csvData;
    if (!cols) return;
    var kubun = getSafeVal(cols, 3);
    if (kubun.indexOf('SB') === -1) return;
    var sekoRaw = getSafeVal(cols, 2);
    var seko = normalizeYMD(sekoRaw);
    if (!seko) return;
    var diff = daysBetween(today, seko);
    if (diff < 0 || diff > BATH_ALERT_DAYS) return;
    if (obj.shitamiVisited) return;
    list.push({ key: key, obj: obj, cols: cols, seko: seko, diff: diff });
  });
  list.sort(function(a,b){ return a.diff - b.diff; });

  document.getElementById('bathCnt').textContent = list.length + '件';
  var body = document.getElementById('bathBody');
  if (list.length === 0) {
    body.innerHTML = '<div class="section-empty">🎉 該当なし（21日以内・未実施のお風呂案件はありません）</div>';
    return;
  }
  var html = '';
  list.forEach(function(it) {
    var title = getSafeVal(it.cols, 4).trim() || it.key;
    var addr = getSafeVal(it.cols, 11);
    var diffLabel = it.diff === 0 ? '本日施工日' : it.diff + '日後';
    html += '<div class="acard">';
    html += '<div class="acard-main" onclick="openModal(\''+esc(it.key)+'\')">';
    html += '<div class="acard-title">' + esc(title) + '</div>';
    html += '<div class="acard-sub">';
    html += '<span class="daysleft">🔨 施工日 ' + fmtMD(it.seko) + '（' + diffLabel + '）</span>';
    if (addr) html += '<span class="area">📍' + esc(trimAddr(addr)) + '</span>';
    html += '</div></div>';
    html += '</div>';
  });
  body.innerHTML = html;
}

// ==================== ② 下見実施チェック ====================
// 業務ルール：CSV下見日・下見時間(cols[12]/[13]、SF由来)が入っている案件は「入ったら絶対行く」扱い。
// そのためCSV下見日を最優先の判定基準とし、アプリ入力のobj.dateは補助として併用する。
// 対象：①CSV下見日(cols[12])が今日より前で未確認、②obj.dateが今日より前で未確認、のどちらかに該当し、
// かつ shitamiVisitedフラグが立っていない案件。
// 表示する「予定日」はCSV下見日があればそちらを優先表示する（アプリ入力より確度が高いため）。
function getEffectiveShitamiDate(obj) {
  var cols = obj.csvData;
  var csvDate = normalizeYMD(getSafeVal(cols, 12));
  var csvTime = getSafeVal(cols, 13);
  if (csvDate) return { date: csvDate, time: csvTime, source: 'csv' };
  if (obj.date) return { date: obj.date, time: obj.time || '', source: 'app' };
  return null;
}
function renderVisitChecks() {
  var today = todayStr();
  var list = [];
  Object.keys(globalTasks).forEach(function(key) {
    var obj = globalTasks[key];
    if (obj.shitamiVisited) return;
    var eff = getEffectiveShitamiDate(obj);
    if (!eff || eff.date >= today) return;
    list.push({ key: key, obj: obj, eff: eff });
  });
  list.sort(function(a,b){ return (a.eff.date+(a.eff.time||'')).localeCompare(b.eff.date+(b.eff.time||'')); });

  document.getElementById('visitCnt').textContent = list.length + '件';
  var body = document.getElementById('visitBody');
  if (list.length === 0) {
    body.innerHTML = '<div class="section-empty">✅ 未確認の過去予定はありません</div>';
    return;
  }
  var html = '';
  list.forEach(function(it) {
    var cols = it.obj.csvData;
    var title = getSafeVal(cols, 4).trim() || it.key;
    var addr = getSafeVal(cols, 11);
    var srcLabel = it.eff.source === 'csv' ? '📋CSV確定' : '📅アプリ入力';
    html += '<div class="acard">';
    html += '<div class="acard-main" onclick="openModal(\''+esc(it.key)+'\')">';
    html += '<div class="acard-title">' + esc(title) + '</div>';
    html += '<div class="acard-sub">';
    html += '<span class="lock">⏰' + srcLabel + ' ' + fmtMD(it.eff.date) + (it.eff.time ? ' ' + esc(it.eff.time) : '') + '</span>';
    if (addr) html += '<span class="area">📍' + esc(trimAddr(addr)) + '</span>';
    html += '</div></div>';
    html += '<div class="acard-btns">';
    html += '<button class="abtn abtn-yes" onclick="event.stopPropagation();markVisited(\''+esc(it.key)+'\')">✅ 行った</button>';
    html += '<button class="abtn abtn-no" onclick="event.stopPropagation();markNotVisited(\''+esc(it.key)+'\')">❌ 行けなかった</button>';
    html += '</div>';
    html += '</div>';
  });
  body.innerHTML = html;
}

function markVisited(key) {
  var obj = globalTasks[key];
  if (!obj) return;
  var nowIso = new Date().toISOString();
  db.ref('app_tasks/'+key).update({ shitamiVisited: true, shitamiVisitedAt: nowIso }).then(function() {
    obj.shitamiVisited = true;
    obj.shitamiVisitedAt = nowIso;
    persistCache();
    renderVisitChecks();
  }).catch(function(e) { alert('更新失敗：' + e.message); });
}

// CSV下見日(cols[12]/[13])はSF取込データのためアプリからはクリアしない（次回CSV取込まで残る）。
// クリアするのはアプリ入力のobj.date/timeのみ。メモ記録と連絡必要フラグは判定元によらず共通で行う。
function markNotVisited(key) {
  var obj = globalTasks[key];
  if (!obj) return;
  var cols = obj.csvData;
  var title = getSafeVal(cols, 4).trim() || key;
  var eff = getEffectiveShitamiDate(obj);
  var csvNote = (eff && eff.source === 'csv') ? '\n（CSV下見日はSF由来のためアプリからは自動クリアされません。SF側の更新をご確認ください）' : '';
  if (!confirm('「' + title + '」を「行けなかった」として記録します。\nアプリ入力の予定日時をクリアし、連絡必要フラグを立てます。' + csvNote + '\n\nよろしいですか？')) return;

  var d = new Date();
  var stamp = d.getFullYear() + '/' + ('0'+(d.getMonth()+1)).slice(-2) + '/' + ('0'+d.getDate()).slice(-2)
    + ' ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  var prevDate = eff ? eff.date : (obj.date || '未設定');
  var prevTime = eff ? eff.time : (obj.time || '');
  var srcTag = (eff && eff.source === 'csv') ? '[CSV下見日]' : '[アプリ入力日]';
  var noteLine = '【下見未実施 ' + stamp + '】予定日時' + srcTag + ' ' + prevDate + (prevTime ? ' ' + prevTime : '') + ' → 行けず';
  var newMemo = (obj.memo ? obj.memo + '\n\n' : '') + noteLine;
  var updates = { date: '', time: '', needsContact: true, memo: newMemo, shitamiVisited: false };

  db.ref('app_tasks/'+key).update(updates).then(function() {
    for (var k in updates) obj[k] = updates[k];
    persistCache();
    renderVisitChecks();
    updateRouteAvailability();
  }).catch(function(e) { alert('更新失敗：' + e.message); });
}

// ==================== ③ 本日のコース設定 ====================
function getUsableGeo(obj) {
  var g = obj.geocode;
  if (!g || g.lat == null || g.lng == null) return null;
  if (g.confidence === 'low' || g.confidence === 'fail') return null;
  return { lat: g.lat, lng: g.lng };
}
function haversineKm(lat1,lng1,lat2,lng2) {
  var R = 6371;
  var dLat = (lat2-lat1) * Math.PI/180;
  var dLng = (lng2-lng1) * Math.PI/180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}
// 2点間の移動時間目安（分）。両方に使える座標があれば直線距離×道なり補正÷平均時速で概算。
// どちらか座標が使えない場合は、従来のエリア表（自宅からの目安）にフォールバックする
// （エリア表はもともと「自宅からの距離」しか表現できないため、区間移動としては粗い近似）。
function travelMinBetween(fromPt, toObj) {
  var toGeo = getUsableGeo(toObj);
  if (fromPt && toGeo) {
    var km = haversineKm(fromPt.lat, fromPt.lng, toGeo.lat, toGeo.lng);
    var roadKm = km * 1.3;
    var min = Math.round(roadKm / 25 * 60);
    return Math.max(5, min);
  }
  var addr = getSafeVal(toObj.csvData, 11);
  return getTravelMin(addr);
}

function buildTodayCases() {
  var today = todayStr();
  var list = [];
  Object.keys(globalTasks).forEach(function(key) {
    var obj = globalTasks[key];
    if (obj.date !== today) return;
    var cols = obj.csvData;
    var geo = getUsableGeo(obj);
    list.push({
      key: key,
      obj: obj,
      title: getSafeVal(cols, 4).trim() || key,
      addr: getSafeVal(cols, 11),
      kubun: getSafeVal(cols, 3),
      fixedTime: obj.time || null,
      hasGeo: !!geo,
      lat: geo ? geo.lat : null,
      lng: geo ? geo.lng : null,
      stayMin: STAY_MIN
    });
  });
  return list;
}

// 挿入法（nearest insertion）：時間固定の案件を骨格とし、
// 自由（時間未指定）案件は挿入コスト（追加移動距離）が最小になる位置に順次挿入する。
function planTodayRoute(items) {
  var fixed = items.filter(function(it){ return !!it.fixedTime; })
                    .sort(function(a,b){ return a.fixedTime.localeCompare(b.fixedTime); });
  var free = items.filter(function(it){ return !it.fixedTime; });

  var route = [{ virtual: true, point: HOME_POINT }].concat(fixed);

  function ptOf(node) {
    if (node.virtual) return node.point;
    if (node.hasGeo) return { lat: node.lat, lng: node.lng };
    return null;
  }
  function roughKm(fromNode, toNode) {
    var p1 = ptOf(fromNode), p2 = ptOf(toNode);
    if (p1 && p2) return haversineKm(p1.lat, p1.lng, p2.lat, p2.lng);
    // 座標が使えない側はエリア表の分数を距離の代わりに使う（時速25km換算で粗く逆算）
    var addr = toNode.virtual ? '' : toNode.addr;
    return getTravelMin(addr) / 60 * 25;
  }

  free.forEach(function(cand) {
    var bestIdx = route.length, bestCost = Infinity;
    for (var i = 1; i <= route.length; i++) {
      var prev = route[i-1];
      var next = (i < route.length) ? route[i] : null;
      var dPrevCand = roughKm(prev, cand);
      var cost;
      if (next) {
        var dCandNext = roughKm(cand, next);
        var dPrevNext = roughKm(prev, next);
        cost = dPrevCand + dCandNext - dPrevNext;
      } else {
        cost = dPrevCand;
      }
      if (cost < bestCost) { bestCost = cost; bestIdx = i; }
    }
    route.splice(bestIdx, 0, cand);
  });

  return route.filter(function(r){ return !r.virtual; });
}

function simulateTimeline(route) {
  var startMin = 8*60+30;
  if (route.length && route[0].fixedTime) {
    var ft = timeToMin(route[0].fixedTime);
    if (ft != null && ft < startMin) startMin = ft;
  }
  var curTime = startMin;
  var curPt = HOME_POINT;
  var result = [];
  route.forEach(function(item) {
    var fromPt = curPt;
    var travel = travelMinBetween(fromPt, item.obj);
    var arrive = curTime + travel;
    var warn = '';
    if (item.fixedTime) {
      var ft = timeToMin(item.fixedTime);
      if (ft != null) {
        if (arrive > ft + 5) warn = '⏰予定(' + item.fixedTime + ')より遅れる可能性';
        arrive = ft;
      }
    }
    var leave = arrive + item.stayMin;
    result.push({ item: item, travel: travel, arrive: arrive, leave: leave, warn: warn });
    curTime = leave;
    if (item.hasGeo) curPt = { lat: item.lat, lng: item.lng };
  });
  return result;
}

var currentRoute = null;

function calcRoute() {
  var items = buildTodayCases();
  document.getElementById('routeCnt').textContent = items.length + '件';
  if (items.length === 0) {
    document.getElementById('routeBody').innerHTML = '<div class="section-empty">本日(obj.date=今日)の予定案件がありません</div>';
    document.getElementById('routeSummaryWrap').innerHTML = '';
    document.getElementById('btnSaveOrder').disabled = true;
    return;
  }
  var route = planTodayRoute(items);
  var timeline = simulateTimeline(route);
  currentRoute = timeline;
  renderRoute(timeline);
  document.getElementById('btnSaveOrder').disabled = false;
}

function renderRoute(timeline) {
  var totalMin = 0;
  timeline.forEach(function(r){ totalMin += r.travel + r.item.stayMin; });
  var endTime = timeline.length ? minToTime(timeline[timeline.length-1].leave) : '-';
  document.getElementById('routeSummaryWrap').innerHTML =
    '<div class="route-summary">' +
    '<div><label>件数 </label><span>' + timeline.length + '件</span></div>' +
    '<div><label>合計(移動+滞在) </label><span>' + totalMin + '分</span></div>' +
    '<div><label>終了予定 </label><span>' + endTime + '</span></div>' +
    '</div>';

  var html = '';
  timeline.forEach(function(r, i) {
    var item = r.item;
    var isReform = item.kubun.indexOf('ﾘ') >= 0;
    var badges = isReform ? '<span class="badge badge-reform">ﾘ リフォーム</span>' : '<span class="badge badge-new">新 新築</span>';
    badges += item.fixedTime ? '<span class="badge badge-fixed">🔒 時間固定</span>' : '<span class="badge badge-est">✦ 提案順</span>';

    html += '<div class="rcard">';
    html += '<div class="rcard-num">' + (i+1) + '</div>';
    html += '<div class="rcard-times">';
    html += '<div class="t-arrive">' + minToTime(r.arrive) + '</div>';
    html += '<div class="t-leave">〜' + minToTime(r.leave) + '</div>';
    html += '<div class="t-travel">移' + r.travel + '分</div>';
    html += '</div>';
    html += '<div class="rcard-body" onclick="openModal(\''+esc(item.key)+'\')">';
    html += '<div style="margin-bottom:3px;">' + badges + '</div>';
    html += '<div class="rcard-title">' + esc(item.title) + '</div>';
    html += '<div class="rcard-sub">';
    if (item.addr) html += '<span class="area">📍' + esc(trimAddr(item.addr)) + '</span>';
    if (item.fixedTime) html += '<span class="lock">⏰' + esc(item.fixedTime) + '</span>';
    if (r.warn) html += '<span class="warn">' + esc(r.warn) + '</span>';
    html += '</div></div>';
    if (item.addr) html += '<a class="btn-map" href="' + mapsUrl(item.addr) + '" target="_blank" rel="noopener">🗺 MAP</a>';
    html += '</div>';
  });
  document.getElementById('routeBody').innerHTML = html;
}

function saveRouteOrder() {
  if (!currentRoute || !currentRoute.length) return;
  var btn = document.getElementById('btnSaveOrder');
  btn.disabled = true;
  btn.textContent = '保存中...';

  var updates = {};
  currentRoute.forEach(function(r, i) {
    updates['app_tasks/' + r.item.key + '/order'] = i + 1;
  });

  db.ref().update(updates).then(function() {
    currentRoute.forEach(function(r, i) {
      globalTasks[r.item.key].order = i + 1;
    });
    persistCache();
    btn.textContent = '💾 順番を保存';
    btn.disabled = false;
    alert('順番を保存しました（' + currentRoute.length + '件）');
  }).catch(function(e) {
    btn.textContent = '💾 順番を保存';
    btn.disabled = false;
    alert('保存失敗：' + e.message);
  });
}

function updateRouteAvailability() {
  var today = todayStr();
  var n = 0;
  Object.keys(globalTasks).forEach(function(key) {
    if (globalTasks[key].date === today) n++;
  });
  document.getElementById('routeCnt').textContent = n + '件';
}

loadData();
